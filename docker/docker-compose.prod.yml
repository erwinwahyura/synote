# Production Docker Compose - Synote only
# Uses existing system Caddy for HTTPS (port 80/443 already in use)

version: '3.8'

services:
  synote:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      pull: true
    container_name: synote-backend
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - SYNOTE_AUTH_TOKEN=${SYNOTE_AUTH_TOKEN:-changeme}
    volumes:
      - synote-data:/app/data/notes
      # Config is baked into image, override if needed:
      # - ./config.prod.toml:/app/config.toml:ro
    ports:
      - "127.0.0.1:8089:8080"  # Localhost only - system Caddy proxies
    # Health check disabled for debugging - container kept restarting
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 60s
    networks:
      - synote-network

  # Optional: Automated backups
  backup:
    image: offen/docker-volume-backup:latest
    container_name: synote-backup
    restart: unless-stopped
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - synote-data:/backup/data:ro
      - ./backups:/archive

volumes:
  synote-data:

networks:
  synote-network:
    driver: bridge
