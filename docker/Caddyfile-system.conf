# Synote - Caddy config for system Caddy
# Place this in /etc/caddy/conf.d/synote.conf or include in main Caddyfile

synote.localhost {
    # For local testing
    reverse_proxy localhost:8089
}

synote.research.erwarx.com {
    # Production with automatic HTTPS
    reverse_proxy localhost:8089
    
    # Compress responses
    encode gzip
    
    # Security headers
    header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        X-XSS-Protection "1; mode=block"
        Referrer-Policy strict-origin-when-cross-origin
    }
}
