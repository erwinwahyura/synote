version: '3.8'

services:
  synote:
    image: docker-synote:latest
    container_name: synote-backend
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    volumes:
      - /mnt/apps-data/synote:/app/data/notes
    ports:
      - "127.0.0.1:8089:8080"
    networks:
      - synote-network

  backup:
    image: offen/docker-volume-backup:latest
    container_name: synote-backup
    restart: unless-stopped
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - /mnt/apps-data/synote:/backup/data:ro
      - /mnt/apps-data/synote-backups:/archive

networks:
  synote-network:
    driver: bridge
