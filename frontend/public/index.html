<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synote - Personal Notes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        /* ── Variables ──────────────────────────────────────────── */
        :root {
            --sidebar-bg: #16161e;
            --sidebar-border: rgba(255,255,255,0.07);
            --sidebar-text: #c9c9d9;
            --sidebar-muted: #666680;
            --sidebar-hover: rgba(255,255,255,0.05);
            --sidebar-active-bg: rgba(109,94,245,0.18);
            --sidebar-active-text: #a89cff;
            --sidebar-active-border: #6d5ef5;

            --content-bg: #ffffff;
            --content-secondary: #fafafa;
            --border: #e8e8ef;
            --border-light: #f2f2f7;

            --accent: #6d5ef5;
            --accent-hover: #5a4de0;
            --accent-light: #eeecff;
            --accent-dim: rgba(109,94,245,0.1);

            --text-primary: #1a1a2e;
            --text-secondary: #5a5a72;
            --text-muted: #9999b0;

            --danger: #e5534b;
            --danger-light: #fff0ef;
            --success: #3fb950;

            --radius-sm: 5px;
            --radius-md: 8px;
            --radius-lg: 12px;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.2);

            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'Monaco', 'Menlo', monospace;

            --sidebar-width: 260px;
        }

        /* ── Dark Mode ──────────────────────────────────────────── */
        html.dark {
            --content-bg: #1e1e2e;
            --content-secondary: #181825;
            --border: #313244;
            --border-light: #262637;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --text-muted: #6c7086;
            --accent-light: rgba(109,94,245,0.18);
            --danger-light: rgba(229,83,75,0.12);
        }

        html.dark #hljs-theme { display: none; }

        /* ── Reset ──────────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            display: flex;
            height: 100vh;
            background: var(--content-bg);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ────────────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
        }

        .sidebar-header {
            padding: 14px 12px 10px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .sidebar-top h1 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .sidebar-top h1::before {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
        }

        .sidebar-header-btns {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--sidebar-border);
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            font-size: 13px;
            color: var(--sidebar-muted);
            transition: all 0.12s;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .sidebar-toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .graph-btn {
            flex: 1;
            padding: 6px 10px;
            background: rgba(255,255,255,0.06);
            color: var(--sidebar-text);
            border: 1px solid var(--sidebar-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            font-family: var(--font);
            transition: all 0.12s;
            white-space: nowrap;
        }

        .graph-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .sort-select {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--sidebar-border);
            border-radius: var(--radius-sm);
            color: var(--sidebar-muted);
            font-size: 11.5px;
            font-family: var(--font);
            padding: 4px 6px;
            cursor: pointer;
            outline: none;
            transition: color 0.12s;
        }

        .sort-select:hover { color: var(--sidebar-text); }
        .sort-select option { background: #1e1e2e; color: #cdd6f4; }

        /* ── Search ─────────────────────────────────────────────── */
        .search-box {
            padding: 10px 12px;
            border-bottom: 1px solid var(--sidebar-border);
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 7px 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--sidebar-border);
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-family: var(--font);
            color: var(--sidebar-text);
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }

        .search-input::placeholder { color: var(--sidebar-muted); }
        .search-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.09); }

        .search-results-info {
            padding: 5px 12px;
            font-size: 11px;
            color: var(--sidebar-muted);
            border-bottom: 1px solid var(--sidebar-border);
        }

        /* ── Notes List ─────────────────────────────────────────── */
        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 6px;
        }

        .notes-list::-webkit-scrollbar { width: 4px; }
        .notes-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .list-section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--sidebar-muted);
            padding: 10px 6px 4px;
        }

        .note-item {
            padding: 8px 8px;
            margin-bottom: 1px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.1s;
            border-left: 2px solid transparent;
        }

        .note-item:hover { background: var(--sidebar-hover); }

        .note-item.active {
            background: var(--sidebar-active-bg);
            border-left-color: var(--sidebar-active-border);
        }

        .note-item-title {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--sidebar-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
            display: flex; align-items: center;
        }

        .note-item.active .note-item-title { color: var(--sidebar-active-text); }

        .note-item-date {
            font-size: 10.5px;
            color: var(--sidebar-muted);
            display: flex; justify-content: space-between;
        }
        .note-age { opacity: 0.6; }

        .note-item.active .note-item-date { color: rgba(168,156,255,0.55); }

        .note-item-snippet {
            font-size: 11px;
            color: var(--sidebar-muted);
            margin-top: 3px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-item-match-badge {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 5px;
            vertical-align: middle;
            background: var(--accent-dim);
            color: var(--accent);
        }

        /* ── Multi-Pane ─────────────────────────────────────────── */
        .panes-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .note-pane {
            flex: 1;
            min-width: 0;
            max-width: none;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow: hidden;
            background: var(--content-bg);
        }

        .note-pane:last-child { border-right: none; max-width: unset; }

        .pane-topbar {
            padding: 7px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: var(--content-secondary);
        }

        .pane-nav-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            font-family: var(--font);
            transition: all 0.1s;
            flex-shrink: 0;
        }

        .pane-nav-btn:hover:not(:disabled) { background: var(--border-light); color: var(--text-primary); }
        .pane-nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }

        .pane-title-label {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .pane-topbar-actions { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }

        .pane-body {
            flex: 1;
            overflow-y: auto;
            padding: 36px 44px 48px;
        }

        .pane-body::-webkit-scrollbar { width: 5px; }
        .pane-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .pane-note-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.2;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .pane-body .tags-display {
            padding: 0;
            border: none;
            margin-bottom: 16px;
            min-height: unset;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .pane-body .preview-content { padding: 0; }

        /* ── Table of Contents ──────────────────────────────────── */
        .pane-toc {
            background: var(--content-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .pane-toc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .pane-toc-label {
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        .pane-toc-arrow { font-size: 10px; color: var(--text-muted); transition: transform 0.18s; }
        .pane-toc.collapsed .pane-toc-arrow { transform: rotate(-90deg); }

        .pane-toc-list { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
        .pane-toc.collapsed .pane-toc-list { display: none; }

        .toc-item {
            color: var(--text-secondary);
            font-size: 13px;
            padding: 2px 0;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: color 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-item:hover, .toc-item.toc-active { color: var(--accent); }
        .toc-item.toc-active { font-weight: 600; border-left: 2px solid var(--accent); padding-left: 6px; margin-left: -8px; }
        .toc-item[data-level="2"] { padding-left: 12px; }
        .toc-item[data-level="3"] { padding-left: 24px; font-size: 12.5px; }
        .toc-item[data-level="4"] { padding-left: 36px; font-size: 12px; color: var(--text-muted); }

        /* ── Mini-graph (in pane) ───────────────────────────────── */
        .pane-mini-graph {
            margin-top: 32px; padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }
        .pane-mini-graph-title {
            font-size: 10.5px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 8px;
        }
        .pane-mini-graph svg { width: 100%; height: 160px; background: #0d0d1a; border-radius: var(--radius-md); }

        /* ── Reminder badge ──────────────────────────────────────── */
        .reminder-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(245,166,35,0.15); color: #f5a623;
            border: 1px solid rgba(245,166,35,0.3);
            border-radius: 20px; padding: 2px 8px; font-size: 11px;
            margin-left: 8px; cursor: pointer;
        }
        .reminder-badge:hover { background: rgba(245,166,35,0.25); }

        /* ── Table editor ────────────────────────────────────────── */
        .preview-content td.editing, .preview-content th.editing {
            padding: 0 !important;
            background: var(--accent-light) !important;
            outline: 2px solid var(--accent);
        }
        .preview-content td.editing input, .preview-content th.editing input {
            width: 100%; border: none; outline: none; padding: 7px 12px;
            background: transparent; font-size: 13.5px; font-family: var(--font);
            color: var(--text-primary);
        }

        /* ── Backlinks (in pane) ────────────────────────────────── */
        .pane-backlinks-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        .pane-backlinks-title {
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .backlinks-section { margin-bottom: 12px; }

        .backlinks-section-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            padding: 0 0 4px;
        }

        .backlink-item {
            padding: 6px 0;
            cursor: pointer;
            border-left: 2px solid transparent;
            padding-left: 8px;
            margin-left: -8px;
            transition: all 0.1s;
        }

        .backlink-item:hover { border-left-color: var(--accent); }

        .backlink-title { font-size: 12.5px; color: var(--text-secondary); }
        .backlink-item:hover .backlink-title { color: var(--accent); }
        .backlink-item.broken .backlink-title { color: var(--text-muted); font-style: italic; }

        .no-backlinks { font-size: 12.5px; color: var(--text-muted); }

        /* ── Tags ───────────────────────────────────────────────── */
        .tag {
            display: inline-flex;
            align-items: center;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.12s;
        }

        .tag:hover { background: var(--accent); color: white; }

        /* ── Preview (markdown) ─────────────────────────────────── */
        .preview-content { font-size: var(--preview-font-size, 14.5px); line-height: 1.75; color: var(--text-primary); }

        .preview-content h1 {
            font-size: 1.75em; font-weight: 700; margin: 0.5em 0 0.4em;
            border-bottom: 2px solid var(--border-light); padding-bottom: 0.25em;
            letter-spacing: -0.3px;
        }

        .preview-content h2 {
            font-size: 1.3em; font-weight: 600; margin: 0.9em 0 0.4em;
            border-bottom: 1px solid var(--border-light); padding-bottom: 0.2em;
            cursor: pointer; user-select: none;
            display: flex; align-items: center; gap: 6px;
        }
        .preview-content h3 {
            font-size: 1.1em; font-weight: 600; margin: 0.8em 0 0.35em;
            cursor: pointer; user-select: none;
            display: flex; align-items: center; gap: 6px;
        }
        .preview-content h4 { font-size: 1em; font-weight: 600; margin: 0.7em 0 0.3em; }

        .heading-fold-arrow {
            font-size: 10px; color: var(--text-muted);
            transition: transform 0.15s; flex-shrink: 0; opacity: 0.5;
        }
        .preview-content h2:hover .heading-fold-arrow,
        .preview-content h3:hover .heading-fold-arrow { opacity: 1; }
        .heading-folded .heading-fold-arrow { transform: rotate(-90deg); }

        .heading-section.folded { display: none; }
        .preview-content p { margin-bottom: 0.85em; }
        .preview-content ul, .preview-content ol { margin-bottom: 0.85em; padding-left: 1.6em; }
        .preview-content li { margin-bottom: 0.2em; }

        .preview-content code {
            background: var(--accent-light); color: var(--accent);
            padding: 0.15em 0.4em; border-radius: 4px;
            font-family: var(--font-mono); font-size: 84%;
        }

        .preview-content pre {
            background: #1e1e2e; padding: 0; border-radius: var(--radius-md);
            overflow-x: auto; margin-bottom: 1em; box-shadow: var(--shadow-sm);
        }

        .preview-content pre code { background: none; color: #cdd6f4; padding: 12px 16px; font-size: 13px; display: block; }

        /* Code block with header */
        .code-block-wrap { border-radius: var(--radius-md); overflow: hidden; margin-bottom: 1em; box-shadow: var(--shadow-sm); }
        .code-block-wrap pre { margin-bottom: 0; border-radius: 0; }
        .code-block-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px; background: #161626; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .code-lang { font-size: 10.5px; color: rgba(255,255,255,0.4); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; }
        .copy-code-btn { font-size: 11px; color: rgba(255,255,255,0.45); background: transparent; border: none; cursor: pointer; padding: 2px 6px; border-radius: 3px; }
        .copy-code-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .code-line { display: block; }
        .line-num { display: inline-block; width: 2.5em; text-align: right; margin-right: 16px; color: rgba(255,255,255,0.2); user-select: none; font-size: 11.5px; }

        .preview-content blockquote {
            border-left: 3px solid var(--accent); padding: 8px 14px;
            color: var(--text-secondary); margin: 1em 0;
            background: var(--accent-light);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        /* ── Callout blocks ─────────────────────────────────────── */
        .callout {
            border-radius: var(--radius-md); padding: 12px 16px;
            margin: 1em 0; border-left: 4px solid;
        }
        .callout-title {
            font-weight: 600; font-size: 13px; margin-bottom: 5px;
            display: flex; align-items: center; gap: 6px;
        }
        .callout-body { font-size: 13.5px; }
        .callout-body p:last-child { margin-bottom: 0; }

        .callout.note     { background: rgba(109,94,245,0.08); border-color: var(--accent); color: var(--text-primary); }
        .callout.note .callout-title { color: var(--accent); }
        .callout.tip      { background: rgba(63,185,80,0.08);  border-color: var(--success); }
        .callout.tip .callout-title  { color: var(--success); }
        .callout.warning  { background: rgba(245,166,35,0.1);  border-color: #f5a623; }
        .callout.warning .callout-title { color: #f5a623; }
        .callout.important { background: rgba(229,83,75,0.08); border-color: var(--danger); }
        .callout.important .callout-title { color: var(--danger); }
        .callout.caution  { background: rgba(229,83,75,0.05);  border-color: #e07b39; }
        .callout.caution .callout-title  { color: #e07b39; }

        .preview-content a { color: var(--accent); text-decoration: none; }
        .preview-content a:hover { text-decoration: underline; }

        .preview-content a.wikilink {
            color: var(--accent); background: var(--accent-light);
            padding: 1px 6px; border-radius: 4px; font-weight: 500;
            font-size: 13.5px; transition: all 0.12s; cursor: pointer;
        }

        .preview-content a.wikilink:hover { background: var(--accent); color: white; text-decoration: none; }

        .preview-content a.wikilink.broken {
            color: var(--danger); background: var(--danger-light);
            border: 1px dashed var(--danger);
        }

        .preview-content a.wikilink.broken:hover { background: var(--danger); color: white; }

        .preview-content table { border-collapse: collapse; width: 100%; margin-bottom: 1em; font-size: 13.5px; }
        .preview-content th, .preview-content td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
        .preview-content th { background: var(--content-secondary); font-weight: 600; }
        .preview-content tr:hover td { background: var(--border-light); }
        .preview-content img { max-width: 100%; height: auto; border-radius: var(--radius-md); }
        .preview-content hr { border: none; border-top: 2px solid var(--border-light); margin: 1.5em 0; }

        /* ── Buttons ────────────────────────────────────────────── */
        .btn {
            padding: 5px 12px;
            border: 1px solid var(--border);
            background: var(--content-bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            font-family: var(--font);
            color: var(--text-secondary);
            transition: all 0.12s;
        }

        .btn:hover { background: var(--content-secondary); color: var(--text-primary); }

        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: white; }

        .btn-danger { color: var(--danger); border-color: transparent; }
        .btn-danger:hover { background: var(--danger-light); border-color: var(--danger); }

        .btn-icon {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: transparent;
            cursor: pointer; color: var(--text-muted); font-size: 14px;
            font-family: var(--font);
            transition: all 0.12s;
        }

        .btn-icon:hover { background: var(--content-secondary); color: var(--text-primary); }

        /* ── Export menu ────────────────────────────────────────── */
        .export-wrap { position: relative; }

        .export-menu {
            position: absolute; top: calc(100% + 5px); right: 0;
            background: var(--content-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md);
            min-width: 130px; z-index: 400; overflow: hidden;
            display: none;
        }

        .export-wrap.open .export-menu { display: block; }

        .export-item {
            display: block; width: 100%; padding: 8px 13px;
            font-size: 12.5px; font-family: var(--font);
            color: var(--text-primary); background: transparent;
            border: none; text-align: left; cursor: pointer;
            transition: background 0.1s;
        }

        .export-item:hover { background: var(--border-light); }

        /* ── Empty State ────────────────────────────────────────── */
        .empty-state {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%; color: var(--text-muted);
            text-align: center; gap: 10px;
        }

        .empty-state h2 { font-size: 18px; font-weight: 600; color: var(--text-secondary); }
        .empty-state p { font-size: 13.5px; }

        /* ── Editor Modal ───────────────────────────────────────── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(10,10,20,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(6px);
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-editor {
            width: 88vw; height: 86vh;
            background: var(--content-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column;
            overflow: hidden;
            animation: scaleIn 0.16s ease;
        }

        @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }

        .modal-title-input {
            flex: 1; font-size: 16px; font-weight: 600;
            border: none; outline: none;
            font-family: var(--font); color: var(--text-primary);
            background: transparent;
        }

        .modal-actions { display: flex; gap: 8px; align-items: center; }

        .modal-body { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* ── Editor panes ───────────────────────────────────────── */
        .editor-split { display: flex; flex: 1; overflow: hidden; }

        .editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .editor-pane-header {
            padding: 4px 12px;
            background: var(--content-secondary); border-bottom: 1px solid var(--border-light);
            font-size: 10.5px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); letter-spacing: 0.6px;
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .md-toolbar { display: flex; align-items: center; gap: 1px; }
        .md-tb-btn {
            width: 24px; height: 22px; border: none; background: transparent;
            cursor: pointer; border-radius: 3px; font-size: 12px; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
        }
        .md-tb-btn:hover { background: var(--border-light); color: var(--text-primary); }
        .md-tb-sep { width: 1px; height: 14px; background: var(--border); margin: 0 3px; }

        .editor-body {
            flex: 1; border: none; padding: 18px 22px;
            font-family: var(--font-mono); font-size: 13.5px; line-height: 1.75;
            resize: none; outline: none; overflow-y: auto;
            color: var(--text-primary); background: var(--content-bg);
        }

        .editor-body::-webkit-scrollbar { width: 5px; }
        .editor-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .preview-pane { flex: 1; border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

        .preview-pane .preview-content { flex: 1; padding: 18px 24px; overflow-y: auto; }

        /* ── Command Palette ────────────────────────────────────── */
        .cmd-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 14vh;
            animation: fadeIn 0.12s ease;
        }

        .cmd-palette {
            width: 560px; max-width: 90vw;
            background: var(--content-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .cmd-input-wrap {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .cmd-icon { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }

        .cmd-input {
            flex: 1; font-size: 15px; font-family: var(--font);
            border: none; outline: none;
            background: transparent; color: var(--text-primary);
        }

        .cmd-input::placeholder { color: var(--text-muted); }

        .cmd-results { max-height: 340px; overflow-y: auto; }
        .cmd-results::-webkit-scrollbar { width: 4px; }
        .cmd-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .cmd-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 18px; cursor: pointer;
            transition: background 0.08s;
        }

        .cmd-item:hover, .cmd-item.selected { background: var(--accent-dim); }
        .cmd-item.selected .cmd-item-title { color: var(--accent); }

        .cmd-item-icon { font-size: 14px; opacity: 0.5; flex-shrink: 0; }
        .cmd-item-title { flex: 1; font-size: 13.5px; color: var(--text-primary); }
        .cmd-item-date { font-size: 11px; color: var(--text-muted); }

        .cmd-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
        .cmd-section-label { padding: 5px 18px 3px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); }

        .cmd-footer {
            padding: 8px 18px;
            border-top: 1px solid var(--border);
            display: flex; gap: 16px;
            font-size: 11.5px; color: var(--text-muted);
        }

        .cmd-hint { display: flex; align-items: center; gap: 5px; }

        .cmd-key {
            background: var(--border-light); border: 1px solid var(--border);
            border-radius: 3px; padding: 1px 5px; font-size: 10.5px;
            font-family: var(--font-mono); color: var(--text-secondary);
        }

        /* ── Hover Preview ──────────────────────────────────────── */
        .wikilink-preview {
            position: fixed; z-index: 3000;
            background: var(--content-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 14px 16px;
            max-width: 340px; min-width: 220px;
            max-height: 280px; overflow: hidden;
            pointer-events: none;
            opacity: 0; transition: opacity 0.15s;
        }

        .wikilink-preview.visible { opacity: 1; }

        .wp-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }
        .wp-body { font-size: 12px; color: var(--text-secondary); line-height: 1.55; overflow: hidden; max-height: 200px; }
        .wp-body h1,.wp-body h2,.wp-body h3 { font-size: 12px; font-weight: 600; margin: 4px 0 2px; color: var(--text-primary); }
        .wp-body p { margin-bottom: 4px; }
        .wp-body code { font-size: 10.5px; }
        .wp-body pre { padding: 6px 8px; font-size: 10.5px; border-radius: 4px; }
        .wp-body ul, .wp-body ol { padding-left: 14px; margin-bottom: 4px; }

        /* ── Tag cloud panel ─────────────────────────────────────── */
        .tag-cloud-panel {
            padding: 8px 12px; border-bottom: 1px solid var(--border);
            display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0;
        }
        .tag-cloud-item {
            padding: 2px 8px; border-radius: 10px;
            background: var(--accent-dim); color: var(--accent);
            font-size: 11.5px; cursor: pointer; border: 1px solid transparent;
            transition: border-color 0.1s;
        }
        .tag-cloud-item:hover { border-color: var(--accent); }
        .tag-cloud-item .tc-count { opacity: 0.6; font-size: 10px; margin-left: 3px; }

        /* ── Quick capture FAB ───────────────────────────────────── */
        .quick-capture-fab {
            position: fixed; bottom: 24px; right: 24px; z-index: 4000;
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--accent); color: white; border: none;
            font-size: 22px; cursor: pointer; box-shadow: var(--shadow-lg);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex; align-items: center; justify-content: center;
        }
        .quick-capture-fab:hover { transform: scale(1.12); box-shadow: 0 6px 24px rgba(109,94,245,0.5); }
        .quick-capture-modal {
            position: fixed; bottom: 80px; right: 24px; z-index: 4001;
            width: 340px; background: var(--content-bg);
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); overflow: hidden;
        }
        .quick-capture-header { padding: 10px 14px 4px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .quick-capture-title { width: 100%; padding: 6px 14px; border: none; border-bottom: 1px solid var(--border-light); background: transparent; color: var(--text-primary); font-size: 14px; font-weight: 600; font-family: var(--font); outline: none; }
        .quick-capture-body { width: 100%; min-height: 80px; max-height: 200px; padding: 8px 14px; border: none; background: transparent; color: var(--text-primary); font-size: 13px; font-family: var(--font-mono); outline: none; resize: none; line-height: 1.6; }
        .quick-capture-footer { padding: 8px 14px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border-light); }

        /* ── Emoji picker ───────────────────────────────────────── */
        .emoji-picker {
            position: fixed; z-index: 6000;
            background: var(--content-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
            padding: 8px; display: grid; grid-template-columns: repeat(10, 1fr);
            gap: 2px; max-width: 300px;
        }
        .emoji-btn {
            width: 26px; height: 26px; font-size: 15px;
            border: none; background: transparent; cursor: pointer;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .emoji-btn:hover { background: var(--accent-dim); }

        /* ── Context menu ───────────────────────────────────────── */
        .ctx-menu {
            position: fixed; z-index: 6000;
            background: var(--content-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
            min-width: 168px; padding: 4px 0; overflow: hidden;
        }
        .ctx-item {
            padding: 7px 16px; font-size: 13px; cursor: pointer;
            color: var(--text-primary); white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .ctx-item:hover { background: var(--accent-dim); color: var(--accent); }
        .ctx-item.danger:hover { background: rgba(229,83,75,0.1); color: var(--danger); }
        .ctx-separator { height: 1px; background: var(--border); margin: 4px 0; }

        /* ── Note color labels ───────────────────────────────────── */
        .note-color-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 5px; flex-shrink: 0;
            cursor: pointer; vertical-align: middle;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
        }
        .color-picker-popup {
            position: fixed; z-index: 5000;
            display: flex; gap: 5px; padding: 8px 10px;
            background: var(--content-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
        }
        .color-swatch {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent;
            cursor: pointer; transition: transform 0.1s;
        }
        .color-swatch:hover { transform: scale(1.2); }
        .color-swatch.active { border-color: white; }
        .color-swatch.clear { background: var(--border); font-size: 10px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }

        /* ── Editor find & replace ───────────────────────────────── */
        .editor-find-replace {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--sidebar-bg);
            flex-shrink: 0;
        }
        .editor-find-replace input {
            flex: 1; min-width: 0; padding: 4px 8px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--content-bg); color: var(--text-primary);
            font-size: 13px; font-family: var(--font);
        }
        .editor-find-replace input:focus { outline: none; border-color: var(--accent); }
        .editor-find-replace .btn { font-size: 11.5px; padding: 3px 8px; flex-shrink: 0; }

        /* ── Note embeds ![[Title]] ──────────────────────────────── */
        .note-embed {
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-md);
            margin: 12px 0; overflow: hidden;
        }
        .note-embed-title {
            padding: 6px 12px; font-size: 12px; font-weight: 600;
            background: var(--accent-dim); color: var(--accent);
            border-bottom: 1px solid var(--border);
        }
        .note-embed-body { padding: 12px 16px; font-size: 13.5px; }
        .note-embed.broken { border-color: var(--danger); color: var(--danger); padding: 8px 12px; font-size: 12.5px; }
        .note-embed-placeholder { color: var(--text-muted); font-size: 12px; font-style: italic; padding: 6px 0; }

        /* ── Wikilink autocomplete dropdown ─────────────────────── */
        .wikilink-dropdown {
            position: absolute; left: 0; bottom: 100%;
            width: 280px; max-height: 220px; overflow-y: auto;
            background: var(--content-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
        }
        .wl-item {
            padding: 7px 14px; font-size: 13px; cursor: pointer;
            color: var(--text-primary); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .wl-item:hover, .wl-item.selected { background: var(--accent-dim); color: var(--accent); }

        /* ── Bulk action bar ─────────────────────────────────────── */
        .bulk-action-bar {
            position: sticky; bottom: 0;
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px;
            background: var(--content-bg);
            border-top: 1px solid var(--border);
            font-size: 12px; color: var(--text-muted);
        }
        .bulk-action-bar .btn { font-size: 11.5px; padding: 3px 8px; }
        .bulk-action-bar .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
        .note-item.bulk-selected { background: var(--accent-dim); }
        .note-item.bulk-selected .note-item-title { color: var(--accent); }

        /* ── Pane drag-to-reorder ────────────────────────────────── */
        .note-pane.drag-over { outline: 2px solid var(--accent); outline-offset: -2px; }
        .note-pane.dragging-pane { opacity: 0.45; }

        /* ── Note lock ───────────────────────────────────────────── */
        .lock-btn { font-size: 13px; }
        .note-pane.locked .pane-body { cursor: default; }
        .locked-banner {
            padding: 4px 12px; background: rgba(245,166,35,0.12);
            border-bottom: 1px solid rgba(245,166,35,0.3);
            font-size: 11.5px; color: #f5a623; text-align: center; flex-shrink: 0;
        }

        /* ── Pane keyboard focus ─────────────────────────────────── */
        .note-pane.pane-focused { outline: 2px solid var(--accent); outline-offset: -2px; }

        /* ── Word/char count toggle ─────────────────────────────── */
        .wc-toggle { cursor: pointer; }
        .wc-toggle:hover { color: var(--accent); }

        /* ── Focus timer ─────────────────────────────────────────── */
        .focus-timer {
            font-size: 11px; color: var(--text-muted);
            font-family: var(--font-mono); letter-spacing: 0.5px;
        }

        /* ── Graph ──────────────────────────────────────────────── */
        .graph-container { flex: 1; display: flex; flex-direction: column; background: var(--content-bg); overflow: hidden; }

        .graph-header {
            padding: 12px 18px; background: var(--content-bg);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .graph-header h2 { font-size: 14px; font-weight: 600; }

        .graph-canvas { flex: 1; background: #0d0d1a; cursor: grab; }
        .graph-canvas:active { cursor: grabbing; }
        .graph-node { cursor: pointer; }
        .graph-node circle { fill: var(--accent); stroke: rgba(255,255,255,0.15); stroke-width: 2px; transition: all 0.2s; }
        .graph-node:hover circle { fill: #a89cff; }
        .graph-node text { font-size: 11px; fill: rgba(255,255,255,0.7); font-family: var(--font); }
        .graph-link { stroke: rgba(109,94,245,0.3); stroke-width: 1.5px; }

        /* ── Notifications ──────────────────────────────────────── */
        @keyframes slideInRight { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }

        /* ── Resize handles ─────────────────────────────────────── */
        .pane-resize-handle {
            flex: 0 0 5px;
            width: 5px;
            background: transparent;
            cursor: col-resize;
            position: relative;
            z-index: 10;
            transition: background 0.15s;
        }

        .pane-resize-handle:hover,
        .pane-resize-handle.dragging {
            background: var(--accent);
        }

        .pane-resize-handle::after {
            content: '';
            position: absolute;
            inset: 0 -4px;  /* widen hit area */
        }

        .editor-resize-handle {
            width: 5px;
            flex-shrink: 0;
            background: var(--border);
            cursor: col-resize;
            position: relative;
            z-index: 10;
            transition: background 0.15s;
        }

        .editor-resize-handle:hover,
        .editor-resize-handle.dragging {
            background: var(--accent);
        }

        .editor-resize-handle::after {
            content: '';
            position: absolute;
            inset: 0 -4px;
        }

        .sidebar-resize-handle {
            width: 4px;
            flex-shrink: 0;
            background: transparent;
            cursor: col-resize;
            position: relative;
            z-index: 20;
            transition: background 0.15s;
        }

        .sidebar-resize-handle:hover,
        .sidebar-resize-handle.dragging {
            background: var(--accent);
        }

        .sidebar-resize-handle::after {
            content: '';
            position: absolute;
            inset: 0 -4px;
        }

        /* Prevent text selection while dragging */
        body.resizing { user-select: none; cursor: col-resize; }

        /* ── Minimized pane ─────────────────────────────────────── */
        .note-pane.minimized {
            flex: 0 0 40px !important;
            min-width: 40px !important;
            max-width: 40px !important;
        }

        .note-pane.minimized .pane-body { display: none; }

        .note-pane.minimized .pane-topbar {
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 0;
            height: 100%;
            overflow: hidden;
            gap: 10px;
            border-right: 1px solid var(--border);
        }

        .note-pane.minimized .pane-nav-btn,
        .note-pane.minimized .pane-topbar-actions > :not(.minimize-btn) {
            display: none;
        }

        .note-pane.minimized .pane-title-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            flex: 1;
            max-height: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11.5px;
            color: var(--text-secondary);
            min-width: unset;
        }

        .minimize-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            transition: all 0.1s;
            flex-shrink: 0;
        }

        .minimize-btn:hover { background: var(--border-light); color: var(--text-primary); }

        /* ── Stats modal ─────────────────────────────────────────── */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 18px;
        }
        .stat-card {
            background: var(--content-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 14px 16px;
        }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
        .stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
        .stat-top { margin-top: 14px; border-top: 1px solid var(--border-light); padding-top: 14px; }
        .stat-top-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-top-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 0; font-size: 12.5px; color: var(--text-secondary);
            border-bottom: 1px solid var(--border-light);
        }
        .stat-top-item:last-child { border-bottom: none; }
        .stat-top-item-val { font-weight: 600; color: var(--accent); }

        /* ── Version history ─────────────────────────────────────── */
        .history-panel {
            position: absolute; top: 0; right: 0; bottom: 0;
            width: 260px; background: var(--content-secondary);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            z-index: 10; animation: slideInRight 0.18s ease;
        }
        .history-header {
            padding: 10px 14px; border-bottom: 1px solid var(--border);
            font-size: 12px; font-weight: 600; color: var(--text-secondary);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .history-list { flex: 1; overflow-y: auto; }
        .history-item {
            padding: 10px 14px; border-bottom: 1px solid var(--border-light);
            cursor: pointer; transition: background 0.1s;
        }
        .history-item:hover, .history-item.selected { background: var(--accent-dim); }
        .history-item-time { font-size: 12px; font-weight: 500; color: var(--text-primary); }
        .history-item-preview { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-actions { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }

        /* ── Folder tree ─────────────────────────────────────────── */
        .folder-item {
            padding: 6px 8px; border-radius: var(--radius-sm);
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600; color: var(--sidebar-muted);
            transition: background 0.1s; user-select: none;
        }
        .folder-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text); }
        .folder-arrow { font-size: 9px; transition: transform 0.15s; }
        .folder-item.open .folder-arrow { transform: rotate(90deg); }
        .folder-notes { padding-left: 14px; }
        .folder-notes.closed { display: none; }

        /* ── Star button ────────────────────────────────────────── */
        .star-btn {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border: none; border-radius: 4px;
            background: transparent; cursor: pointer;
            font-size: 14px; transition: transform 0.12s, color 0.12s;
            color: var(--text-muted); line-height: 1;
        }
        .star-btn:hover { color: var(--text-primary); transform: scale(1.15); }
        .star-btn.starred { color: #f5a623; }

        /* ── Reading progress bar ───────────────────────────────── */
        .pane-progress {
            height: 2px;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s linear;
            flex-shrink: 0;
        }

        /* ── Find in note ────────────────────────────────────────── */
        .find-bar {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 12px;
            border-top: 1px solid var(--border);
            background: var(--content-secondary);
            flex-shrink: 0;
            animation: fadeIn 0.1s ease;
        }

        .find-input {
            flex: 1; padding: 4px 9px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--content-bg); color: var(--text-primary);
            font-size: 12.5px; font-family: var(--font); outline: none;
            transition: border-color 0.15s;
        }
        .find-input:focus { border-color: var(--accent); }
        .find-input.no-match { border-color: var(--danger); color: var(--danger); }

        .find-count { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; min-width: 50px; }

        mark.find-hl {
            background: rgba(245,166,35,0.4); color: inherit;
            border-radius: 2px;
        }
        mark.find-hl.current { background: #f5a623; color: #000; }

        /* ── Color picker ────────────────────────────────────────── */
        .color-picker-btn {
            width: 18px; height: 18px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer; flex-shrink: 0;
            background: var(--accent);
            padding: 0; position: relative; overflow: hidden;
        }
        .color-picker-btn input[type=color] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }

        /* ── Pane footer ─────────────────────────────────────────── */
        .pane-footer {
            padding: 6px 44px;
            border-top: 1px solid var(--border-light);
            font-size: 11px;
            color: var(--text-muted);
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0;
            background: var(--content-secondary);
        }

        /* ── Zen / focus mode ────────────────────────────────────── */
        body.zen .sidebar { flex: 0 0 0 !important; min-width: 0 !important; overflow: hidden !important; border: none !important; }
        body.zen #sidebarResizeHandle { display: none !important; }
        body.zen .pane-topbar { opacity: 0.08; transition: opacity 0.2s; }
        body.zen .note-pane:hover .pane-topbar { opacity: 1; }
        body.zen .pane-body { padding-left: 10%; padding-right: 10%; max-width: 900px; margin: 0 auto; }

        /* ── Shortcuts modal ─────────────────────────────────────── */
        .shortcuts-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.52); backdrop-filter: blur(8px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.12s ease;
        }
        .shortcuts-modal {
            background: var(--content-bg); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            width: 460px; max-width: 92vw; max-height: 80vh; overflow-y: auto;
            padding: 22px 26px;
        }
        .shortcuts-modal h2 { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary); }
        .shortcuts-group { margin-bottom: 16px; }
        .shortcuts-group-title {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.7px; color: var(--text-muted); margin-bottom: 7px;
        }
        .shortcut-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; border-bottom: 1px solid var(--border-light);
        }
        .shortcut-row:last-child { border-bottom: none; }
        .shortcut-desc { font-size: 12.5px; color: var(--text-secondary); }
        .shortcut-keys { display: flex; gap: 3px; align-items: center; }
        .shortcut-key {
            background: var(--border-light); border: 1px solid var(--border);
            border-radius: 3px; padding: 1px 6px; font-size: 11px;
            font-family: var(--font-mono); color: var(--text-secondary); white-space: nowrap;
        }

        /* ── Auto-save status ───────────────────────────────────── */
        .autosave-status {
            font-size: 11.5px; color: var(--text-muted);
            transition: color 0.2s;
            white-space: nowrap;
        }
        .autosave-status.saving { color: var(--accent); }
        .autosave-status.saved  { color: var(--success); }

        /* ── New note inline form ────────────────────────────────── */
        .new-note-form {
            padding: 8px 10px;
            border-bottom: 1px solid var(--sidebar-border);
            display: none;
            gap: 6px;
        }
        .new-note-form.open { display: flex; }
        .new-note-input {
            flex: 1; padding: 6px 9px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            color: var(--sidebar-text); font-size: 12.5px;
            font-family: var(--font); outline: none;
        }
        .new-note-input::placeholder { color: var(--sidebar-muted); }

        /* ── Template picker ─────────────────────────────────────── */
        .template-picker {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.12s ease;
        }
        .template-modal {
            background: var(--content-bg); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            width: 440px; max-width: 92vw; padding: 22px 24px;
        }
        .template-modal h2 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
        .template-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .template-card {
            padding: 12px 14px; border: 1px solid var(--border);
            border-radius: var(--radius-md); cursor: pointer;
            transition: all 0.12s; text-align: left;
            background: var(--content-bg);
        }
        .template-card:hover { border-color: var(--accent); background: var(--accent-dim); }
        .template-card-icon { font-size: 20px; margin-bottom: 6px; }
        .template-card-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .template-card-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

        /* ── Delete confirm inline ───────────────────────────────── */
        .delete-confirm {
            position: absolute; top: calc(100% + 4px); right: 0;
            background: var(--content-bg); border: 1px solid var(--danger);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md);
            padding: 10px 14px; z-index: 500; white-space: nowrap;
            display: flex; flex-direction: column; gap: 8px;
        }
        .delete-confirm p { font-size: 12.5px; color: var(--text-secondary); }
        .delete-confirm-actions { display: flex; gap: 6px; }

        /* ── Tag editor (pane) ───────────────────────────────────── */
        .tag-remove {
            margin-left: 4px; opacity: 0.5; cursor: pointer;
            font-size: 10px; line-height: 1;
        }
        .tag-remove:hover { opacity: 1; }
        .tag-add-btn {
            display: inline-flex; align-items: center;
            background: transparent; border: 1px dashed var(--border);
            color: var(--text-muted); padding: 2px 8px;
            border-radius: 20px; font-size: 11.5px; cursor: pointer;
            transition: all 0.12s;
        }
        .tag-add-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tag-inline-input {
            border: 1px solid var(--accent); border-radius: 20px;
            padding: 2px 8px; font-size: 11.5px; font-family: var(--font);
            background: var(--accent-light); color: var(--text-primary);
            outline: none; width: 90px;
        }

        /* ── Keyboard nav highlight ──────────────────────────────── */
        .note-item.keyboard-focus {
            background: var(--sidebar-hover);
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        /* ── Search highlight ────────────────────────────────────── */
        mark.sh { background: rgba(109,94,245,0.22); color: var(--accent); border-radius: 2px; font-weight: 500; font-style: normal; }

        /* ── Pane maximize ──────────────────────────────────────── */
        .note-pane.pane-maximized {
            position: absolute !important;
            inset: 0 !important;
            z-index: 60 !important;
            max-width: none !important;
            flex: none !important;
            width: 100% !important;
        }
        .panes-wrapper.has-maximized .note-pane:not(.pane-maximized) { display: none !important; }

        /* ── Word count goal ─────────────────────────────────────── */
        .wc-goal-bar-wrap {
            padding: 6px 14px 2px;
            flex-shrink: 0;
        }
        .wc-goal-bar-track {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .wc-goal-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .wc-goal-label {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 3px;
            display: flex;
            justify-content: space-between;
        }

        /* ── Print ──────────────────────────────────────────────── */
        @media print {
            .sidebar, .pane-topbar, .pane-backlinks-section, .pane-toc { display: none !important; }
            .panes-wrapper { display: block !important; overflow: visible !important; }
            .note-pane { border: none !important; min-width: 100% !important; max-width: 100% !important; display: block !important; }
            .pane-body { padding: 0 !important; overflow: visible !important; height: auto !important; }
        }

        /* ── Mobile: drawer overlay ─────────────────────────────── */
        .sidebar-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
        }

        .sidebar-overlay.open { display: block; }

        .hamburger-btn {
            display: none;
            width: 36px; height: 36px;
            align-items: center; justify-content: center;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--content-secondary);
            cursor: pointer; font-size: 16px; color: var(--text-secondary);
            flex-shrink: 0;
        }

        /* ── Mobile bottom bar ──────────────────────────────────── */
        .mobile-bottom-bar {
            display: none;
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 52px;
            background: var(--content-bg);
            border-top: 1px solid var(--border);
            padding: 0 12px;
            align-items: center; justify-content: space-between;
            z-index: 100;
            gap: 8px;
        }

        .mobile-bottom-bar .btn-icon { width: 36px; height: 36px; font-size: 16px; }

        .mobile-bar-title {
            flex: 1;
            font-size: 13px; font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-align: center;
        }

        /* ── Tablet: max 2 panes ────────────────────────────────── */
        @media (max-width: 1024px) and (min-width: 769px) {
            :root { --sidebar-width: 220px; }

            .note-pane:nth-child(n+4) { display: none !important; }
            .pane-resize-handle:nth-child(n+4) { display: none !important; }
        }

        /* ── Mobile: single pane, drawer sidebar ────────────────── */
        @media (max-width: 768px) {
            body { font-size: 15px; }

            .sidebar {
                position: fixed; top: 0; left: 0; bottom: 0;
                width: 85vw; max-width: 320px;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.24s ease;
            }

            .sidebar.open { transform: translateX(0); }

            #sidebarResizeHandle { display: none !important; }

            /* Show hamburger in pane topbar area */
            .hamburger-btn { display: flex; }

            /* Force single pane */
            .note-pane:not(:first-child) { display: none !important; }
            .pane-resize-handle { display: none !important; }

            /* Simpler pane topbar on mobile */
            .pane-topbar {
                padding: 8px 12px;
                gap: 6px;
            }

            .pane-topbar-actions > .export-wrap,
            .pane-topbar-actions > span,
            .pane-topbar-actions > .minimize-btn { display: none !important; }

            /* Hide pane close btn — use bottom bar instead */
            .pane-topbar-actions > .btn-icon:last-child { display: none !important; }

            /* Body padding accounts for bottom bar */
            .pane-body { padding: 20px 18px 80px; }
            .pane-footer { padding: 6px 18px; }



            /* Show bottom bar */
            .mobile-bottom-bar { display: flex; }

            /* TOC more compact */
            .pane-toc { padding: 8px 10px; }

            /* Wider note title */
            .pane-note-title { font-size: 22px; }

            /* Command palette full width */
            .cmd-palette { width: 94vw; }

            /* Modal full screen */
            .modal-editor { width: 100vw; height: 100vh; border-radius: 0; }

            /* Zen mode: no change on mobile */
            body.zen .sidebar { transform: translateX(-100%) !important; }
        }

    </style>
</head>
<body>

<!-- ── Sidebar overlay (mobile) ───────────────────────────── -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

<!-- ── Sidebar ─────────────────────────────────────────────── -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-top">
            <h1>Synote</h1>
            <div class="sidebar-header-btns">
                <button class="color-picker-btn" title="Theme color">
                    <input type="color" id="accentColorPicker" oninput="applyAccentColor(this.value)" title="Theme color">
                </button>
                <button class="icon-btn" onclick="showNewNoteForm()" title="New note (⌘N)" style="font-size:16px;font-weight:300;">+</button>
                <button class="icon-btn" onclick="showShortcutsModal()" title="Keyboard shortcuts (?)">⌨</button>
                <button class="icon-btn" id="zenToggle" onclick="toggleZenMode()" title="Zen mode (⌘.)">◎</button>
                <button class="icon-btn" id="darkToggle" onclick="toggleDarkMode()" title="Toggle dark mode (⌘D)">🌙</button>
                <button class="icon-btn" onclick="cycleFontSize()" id="fontSizeBtn" title="Font size">Aa</button>
                <button class="icon-btn" id="userMenuBtn" onclick="logout()" title="Sign out"
                    style="display:none;font-size:11px;font-weight:700;background:var(--accent);color:white;border-radius:50%;width:26px;height:26px;padding:0;line-height:1;"></button>
            </div>
        </div>
        <div class="sidebar-toolbar">
            <button class="graph-btn" onclick="showGraphView()">⬡ Graph</button>
            <button class="graph-btn" id="folderViewBtn" onclick="toggleFolderView()" style="flex:0 0 auto;padding:6px 8px;" title="Folder view">📁</button>
            <button class="graph-btn" onclick="showStatsModal()" style="flex:0 0 auto;padding:6px 8px;" title="Stats">📊</button>
            <button class="graph-btn" id="tagCloudBtn" onclick="toggleTagCloud()" style="flex:0 0 auto;padding:6px 8px;" title="Tag cloud">🏷</button>
            <button class="graph-btn" onclick="openDailyNote()" style="flex:0 0 auto;padding:6px 8px;" title="Today's daily note (⌘⌥D)">📅</button>
            <select class="sort-select" id="sortSelect" onchange="setSortOrder(this.value)" title="Sort notes">
                <option value="updated">Recent</option>
                <option value="title">A → Z</option>
                <option value="created">Created</option>
                <option value="viewed">Viewed</option>
            </select>
        </div>
    </div>
    <div class="new-note-form" id="newNoteForm">
        <input class="new-note-input" id="newNoteInput" placeholder="Note title…"
               onkeydown="handleNewNoteKey(event)">
        <button class="btn btn-primary" style="font-size:12px;padding:4px 10px;" onclick="createNewNote()">Create</button>
        <button class="btn" style="font-size:12px;padding:4px 8px;" onclick="showTemplatePicker()" title="From template">⊞</button>
        <button class="btn" style="font-size:12px;padding:4px 8px;" onclick="hideNewNoteForm()">✕</button>
    </div>
    <div class="search-box">
        <input type="text" class="search-input" id="searchInput"
               placeholder="Search notes…" oninput="handleSearch()">
    </div>
    <div class="tag-cloud-panel" id="tagCloudPanel" style="display:none;"></div>
    <div class="search-results-info" id="searchInfo" style="display:none;"></div>
    <div class="notes-list" id="notesList"></div>
    <div class="bulk-action-bar" id="bulkBar" style="display:none;">
        <span id="bulkCount">0 selected</span>
        <button class="btn" onclick="bulkPin()" title="Pin selected">⭐ Pin</button>
        <button class="btn btn-danger" onclick="bulkDelete()" title="Delete selected">🗑 Delete</button>
        <button class="btn" onclick="clearBulkSelect()">✕</button>
    </div>
    <div class="wc-goal-bar-wrap" id="wcGoalBar" style="display:none;" title="Daily writing goal — click to change" onclick="setWordCountGoal()">
        <div class="wc-goal-bar-track"><div class="wc-goal-bar-fill" id="wcGoalFill" style="width:0%"></div></div>
        <div class="wc-goal-label"><span id="wcGoalText">0 / 500 words today</span><span id="wcGoalPct">0%</span></div>
    </div>
</div>

<!-- ── Sidebar resize handle ──────────────────────────────── -->
<div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>

<!-- ── Panes ──────────────────────────────────────────────── -->
<div class="panes-wrapper" id="panesContainer">
    <div class="empty-state">
        <h2>Welcome to Synote</h2>
        <p>Click a note in the sidebar to open it<br>
        <span style="font-size:12px;opacity:0.7;">Press <kbd style="background:var(--border-light);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:monospace;">⌘K</kbd> for command palette</span></p>
    </div>
</div>

<!-- ── Mobile bottom bar ──────────────────────────────────── -->
<div class="mobile-bottom-bar" id="mobileBottomBar">
    <button class="btn-icon" id="mobileBackBtn"  onclick="mobileGoBack()"    title="Back">←</button>
    <button class="btn-icon" id="mobileFwdBtn"   onclick="mobileGoForward()" title="Forward">→</button>
    <span class="mobile-bar-title" id="mobileBarTitle"></span>
    <button class="btn-icon" onclick="openMobileEdit()"  title="Edit">✏</button>
    <button class="btn-icon" onclick="mobileClosePane()" title="Close">✕</button>
</div>

<!-- ── Quick capture FAB ──────────────────────────────────── -->
<button class="quick-capture-fab" onclick="showQuickCapture()" title="Quick capture (⌘⇧N)">⊕</button>

<!-- ── Wikilink hover preview (singleton) ─────────────────── -->
<div class="wikilink-preview" id="wikilinkPreview">
    <div class="wp-title" id="wpTitle"></div>
    <div class="wp-body preview-content" id="wpBody"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
const API_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:8080/api'
    : `${window.location.origin}/api`;

let openPanes    = [];   // [{ uid, note, history:[], historyIdx }]
let notes        = [];   // sidebar list
let currentNote  = null;
let authToken    = localStorage.getItem('synote_token');
let searchTimeout = null;
let isSearching  = false;
let sortOrder    = localStorage.getItem('synote_sort') || 'updated';
let darkMode     = localStorage.getItem('synote_dark') === 'true';
let fontSizeStep = parseInt(localStorage.getItem('synote_fontsize') || '0'); // -1, 0, 1
let recentlyViewed = JSON.parse(localStorage.getItem('synote_recent') || '[]'); // [{id,title}]
let starredNotes = new Set(JSON.parse(localStorage.getItem('synote_starred') || '[]'));
let lockedNotes  = new Set(JSON.parse(localStorage.getItem('synote_locked') || '[]'));
const noteColors = JSON.parse(localStorage.getItem('synote_colors') || '{}'); // noteId → color
let zenMode = false;
const focusTimers = {}; // uid → { startTs, elapsed, intervalId }
const noteCache  = new Map(); // noteId -> full note object
const MAX_PANES  = 5;

// ════════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════════
function init() {
    applyDarkMode();
    initAccentColor();
    document.getElementById('sortSelect').value = sortOrder;
    applyFontSize();
    initSidebarResize();
    initSwipeGesture();
    initReminders();
    initSidebarHover();
    initMarkdownImport();
    initWordCountGoal();
    updateUserDisplay();
    loadNotes().then(async () => {
        // Handle permalink: #note-<uuid> (takes precedence over saved state)
        const hash = location.hash;
        if (hash.startsWith('#note-')) {
            const noteId = hash.slice(6);
            const note = notes.find(n => n.id === noteId);
            if (note) { loadNote(noteId); return; }
        }
        // Restore previously open panes
        await restorePaneState();
    });
}

function initMarkdownImport() {
    // Allow dropping .md files onto the panes area to import them
    const panesArea = document.getElementById('panesContainer');
    if (!panesArea) return;
    panesArea.addEventListener('dragover', e => {
        if ([...e.dataTransfer.items].some(i => i.kind === 'file' && (i.type === 'text/markdown' || i.type === 'text/plain'))) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        }
    });
    panesArea.addEventListener('drop', async e => {
        const files = [...e.dataTransfer.files].filter(f => f.name.endsWith('.md') || f.type === 'text/markdown');
        if (!files.length) return;
        e.preventDefault();
        let imported = 0;
        for (const file of files) {
            const text = await file.text();
            const title = file.name.replace(/\.md$/, '');
            try {
                const res = await apiCall('/notes', { method: 'POST', body: JSON.stringify({ title, content: text }) });
                if (!res.ok) throw new Error();
                const note = await res.json();
                noteCache.set(note.id, note);
                imported++;
                if (imported === 1) { await loadNotes(); loadNote(note.id); }
            } catch { showNotification(`Failed to import ${file.name}`, 'error'); }
        }
        if (imported > 0) {
            await loadNotes();
            showNotification(`Imported ${imported} note${imported > 1 ? 's' : ''}`, 'success');
        }
    });
}

function initSidebarHover() {
    const list = document.getElementById('notesList');
    list.addEventListener('mouseover', e => {
        const item = e.target.closest('.note-item');
        if (!item) { hideWikilinkPreview(); return; }
        // Extract noteId from onclick attribute
        const m = item.getAttribute('onclick')?.match(/'([0-9a-f-]{36})'/);
        if (!m) return;
        const noteId = m[1];
        const note = notes.find(n => n.id === noteId);
        if (!note) return;
        showWikilinkPreview(e, note.title, note.id);
    });
    list.addEventListener('mouseout', e => {
        if (!e.relatedTarget?.closest('.note-item')) hideWikilinkPreview();
    });
    list.addEventListener('mousemove', e => {
        if (e.target.closest('.note-item')) moveWikilinkPreview(e);
    });
}

function initSwipeGesture() {
    let touchStartX = 0;
    document.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        // Swipe right from left edge → open sidebar
        if (touchStartX < 24 && dx > 60) openMobileSidebar();
        // Swipe left on open sidebar → close
        if (dx < -60 && document.getElementById('sidebar')?.classList.contains('open')) closeMobileSidebar();
    }, { passive: true });
}

function applyFontSize() {

    const labels = ['Aa', 'Aa', 'Aa'];
