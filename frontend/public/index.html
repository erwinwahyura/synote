    if (!pane || pane.historyIdx >= pane.history.length - 1) return;
    pane.historyIdx++;
    const noteId = pane.history[pane.historyIdx];
    let note = noteCache.get(noteId);
    if (!note) {
        try {
            const res = await apiCall(`/notes/${noteId}`);
            note = await res.json();
            noteCache.set(noteId, note);
        } catch { return; }
    }
    pane.note = note;
    currentNote = note;
    renderPaneContent(pane);
    renderNotesList();
}

function closePane(paneUid) {
    const idx = openPanes.findIndex(p => p.uid === paneUid);
    if (idx === -1) return;
    stopFocusTimer(paneUid);
    openPanes.splice(idx, 1);
    currentNote = openPanes[openPanes.length - 1]?.note || null;
    renderPanes();
    renderNotesList();
}

function toggleMinimizePane(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    pane.minimized = !pane.minimized;
    // Rebuild just this pane's shell in place
    const el = document.getElementById(`pane-${paneUid}`);
    if (!el) return;
    const newShell = document.createElement('div');
    newShell.innerHTML = buildPaneShell(pane);
    const newPane = newShell.firstElementChild;
    el.replaceWith(newPane);
    if (!pane.minimized) populatePaneBody(pane);
    // Re-attach resize handles after DOM change
    addPaneResizeHandles();
}

function renderPanes() {
    const container = document.getElementById('panesContainer');
    if (!container) return;
    const isMobile = window.innerWidth <= 768;
    if (openPanes.length === 0) {
        container.innerHTML = `<div class="empty-state">
            <h2>Welcome to Synote</h2>
            <p>${isMobile ? 'Swipe right to open notes' : 'Click a note in the sidebar to open it'}<br>
            <span style="font-size:12px;opacity:0.7;">${isMobile ? '' : 'Press <kbd style="background:var(--border-light);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:monospace;">⌘K</kbd> for command palette'}</span></p>
        </div>`;
        return;
    }
    container.innerHTML = openPanes.map(pane => buildPaneShell(pane)).join('');
    openPanes.forEach(pane => populatePaneBody(pane));
    addPaneResizeHandles();
    updateMobileBottomBar();
}

function buildPaneShell(pane) {
    const { uid, note, historyIdx, history, minimized } = pane;
    const canBack  = historyIdx > 0;
    const canFwd   = historyIdx < history.length - 1;
    const updated  = new Date(note.updated_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const minIcon  = minimized ? '⊡' : '⊟';
    const minTitle = minimized ? 'Restore pane' : 'Minimize pane';
    const isStarred = starredNotes.has(note.id);
    const isLocked  = lockedNotes.has(note.id);
    return `
    <div class="note-pane ${minimized ? 'minimized' : ''} ${isLocked ? 'locked' : ''}" id="pane-${uid}">
        <div class="pane-topbar" draggable="true"
             ondragstart="paneDragStart(event,'${uid}')"
             ondragover="paneDragOver(event,'${uid}')"
             ondragleave="paneDragLeave(event,'${uid}')"
             ondrop="paneDrop(event,'${uid}')">
            <button class="hamburger-btn" onclick="openMobileSidebar()" title="Open notes">☰</button>
            <button class="pane-nav-btn" onclick="goBack('${uid}')" ${canBack ? '' : 'disabled'} title="Go back">←</button>
            <button class="pane-nav-btn" onclick="goForward('${uid}')" ${canFwd ? '' : 'disabled'} title="Go forward">→</button>
            <span class="pane-title-label" title="${escapeHtml(note.title)}" ondblclick="startRenameInPane('${uid}')">${escapeHtml(note.title)}</span>
            <div class="pane-topbar-actions">
                <span style="font-size:11px;color:var(--text-muted);">${updated}</span>
                <button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar('${note.id}',event)" title="${isStarred ? 'Unstar' : 'Star note'}">${isStarred ? '⭐' : '☆'}</button>
                <button class="btn-icon" onclick="duplicateNote('${uid}')" title="Duplicate note">⧉</button>
                <button class="btn-icon" onclick="editReminder('${uid}')" title="Set reminder">⏰</button>
                <button class="btn-icon lock-btn" onclick="toggleLockNote('${note.id}')" title="${isLocked ? 'Unlock note' : 'Lock note'}">${isLocked ? '🔒' : '🔓'}</button>
                <button class="btn-icon" onclick="toggleFindBar('${uid}')" title="Find in note (⌘F)">🔍</button>
                <button class="btn btn-primary" style="font-size:11.5px;padding:3px 9px;${isLocked ? 'opacity:0.4;pointer-events:none;' : ''}" onclick="openEditorModal('${uid}')">Edit</button>
                <div style="position:relative;" id="delete-wrap-${uid}">
                    <button class="btn-icon" onclick="confirmDeleteNote('${uid}')" title="Delete note" style="color:var(--danger);">🗑</button>
                </div>
                <div class="export-wrap" id="export-${uid}">
                    <button class="btn-icon" onclick="toggleExportMenu('${uid}')" title="Export">⬇</button>
                    <div class="export-menu">
                        <button class="export-item" onclick="exportMarkdown('${uid}')">📄 Markdown</button>
                        <button class="export-item" onclick="exportHTML('${uid}')">🌐 HTML</button>
                        <button class="export-item" onclick="copyPermalink('${uid}')">🔗 Copy link</button>
                        <button class="export-item" onclick="exportPDF('${uid}')">🖨 Print / PDF</button>
                    </div>
                </div>
                <button class="minimize-btn" onclick="toggleMinimizePane('${uid}')" title="${minTitle}">${minIcon}</button>
                <button class="btn-icon" onclick="closePane('${uid}')" title="Close pane">✕</button>
            </div>
        </div>
        <div class="pane-progress" id="pane-progress-${uid}"></div>
        <div class="pane-body" id="pane-body-${uid}">
            <div style="color:var(--text-muted);font-size:13px;padding:40px 0;text-align:center;">Loading…</div>
        </div>
    </div>`;
}

function renderPaneContent(pane) {
    // Rebuild just this pane's shell (updates nav buttons) then populate
    const el = document.getElementById(`pane-${pane.uid}`);
    if (!el) return;
    el.outerHTML = buildPaneShell(pane);
    populatePaneBody(pane);
    updateMobileBottomBar();
}

function populatePaneBody(pane) {
    const { uid, note } = pane;
    const body = document.getElementById(`pane-body-${uid}`);
    if (!body) return;

    const toc = buildTOC(note.content, uid);
    const tocHtml = toc.length >= 3 ? renderTOCHtml(toc, uid) : '';
    const wc = getWordCount(note.content);
    const readMin = Math.max(1, Math.round(wc / 200));

    const reminder = getReminder(note.id);
    const reminderBadge = reminder
        ? `<span class="reminder-badge" onclick="editReminder('${uid}')" title="Reminder set">⏰ ${new Date(reminder).toLocaleDateString()}</span>`
        : '';

    body.innerHTML = `
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;">
            <div class="pane-note-title">${escapeHtml(note.title)}</div>
            ${reminderBadge}
        </div>
        <div class="tags-display" id="tags-${uid}"></div>
        ${tocHtml}
        <div class="preview-content" id="preview-${uid}"></div>
        <div class="pane-mini-graph" id="mini-graph-${uid}">
            <div class="pane-mini-graph-title">Connections</div>
            <svg id="mini-svg-${uid}"></svg>
        </div>
        <div class="pane-backlinks-section">
            <div class="pane-backlinks-title">Linked References</div>
            <div id="backlinks-${uid}"><div style="font-size:12.5px;color:var(--text-muted);">Loading…</div></div>
        </div>`;

    // Locked banner
    if (lockedNotes.has(note.id)) {
        const banner = document.createElement('div');
        banner.className = 'locked-banner';
        banner.textContent = '🔒 Read-only — unlock to edit';
        body.before(banner);
    }

    // Word count footer + focus timer
    const footer = document.createElement('div');
    footer.className = 'pane-footer';
    footer.innerHTML = `<span>${wc.toLocaleString()} words</span><span>·</span><span>${readMin} min read</span><span>·</span><span class="focus-timer" id="timer-${uid}">0:00</span>`;
    body.parentElement.appendChild(footer);

    // Start focus timer for this pane
    startFocusTimer(uid);

    renderMarkdownInto(`preview-${uid}`, note.content, uid);
    updateTagsDisplayFor(`tags-${uid}`, note.content, uid);
    loadAndRenderBacklinksFor(uid, note.id);
    loadMiniGraph(uid, note.id);
    applyTableEditor(`preview-${uid}`, uid);

    // Reading progress bar + scrollspy TOC
    const progressBar = document.getElementById(`pane-progress-${uid}`);
    body.addEventListener('scroll', () => {
        if (progressBar) {
            const pct = body.scrollHeight <= body.clientHeight ? 0
                : (body.scrollTop / (body.scrollHeight - body.clientHeight)) * 100;
            progressBar.style.width = pct + '%';
        }
        // Scrollspy: highlight active TOC item
        const headings = body.querySelectorAll('[id^="h-"]');
        if (headings.length === 0) return;
        let active = headings[0].id;
        headings.forEach(h => {
            if (h.offsetTop - body.scrollTop <= 60) active = h.id;
        });
        document.querySelectorAll(`#toc-${uid} .toc-item`).forEach(item => {
            const isActive = item.getAttribute('onclick')?.includes(`'${active}'`);
            item.classList.toggle('toc-active', !!isActive);
        });
    }, { passive: true });
}

// ════════════════════════════════════════════════════════════
// Table of Contents
// ════════════════════════════════════════════════════════════
function buildTOC(content, paneUid) {
    const regex = /^(#{1,4})\s+(.+)$/gm;
    const items = [];
    let m;
    while ((m = regex.exec(content)) !== null) {
        items.push({ level: m[1].length, text: m[2].trim(), id: 'h-' + paneUid + '-' + items.length });
    }
    return items;
}

function renderTOCHtml(items, paneUid) {
    const links = items.map(item =>
        `<span class="toc-item" data-level="${item.level}" onclick="scrollToHeading('${paneUid}','${item.id}')">${escapeHtml(item.text)}</span>`
    ).join('');
    return `<div class="pane-toc" id="toc-${paneUid}">
        <div class="pane-toc-header" onclick="toggleTOC('${paneUid}')">
            <span class="pane-toc-label">On this page</span>
            <span class="pane-toc-arrow">▾</span>
        </div>
        <div class="pane-toc-list">${links}</div>
    </div>`;
}

function toggleTOC(paneUid) {
    document.getElementById(`toc-${paneUid}`)?.classList.toggle('collapsed');
}

function scrollToHeading(paneUid, headingId) {
    const body = document.getElementById(`pane-body-${paneUid}`);
    const el = body?.querySelector(`#${headingId}`);
    if (el) {
        body.scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
    }
}

// ════════════════════════════════════════════════════════════
// Markdown rendering
// ════════════════════════════════════════════════════════════
function configureMarked(paneUid) {
    const renderer = new marked.Renderer();

    renderer.blockquote = function(quote) {
        // Check for callout syntax: > [!TYPE]
        const match = quote.match(/^\s*<p>\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\](.*?)<\/p>/si);
        if (match) {
            const type  = match[1].toLowerCase();
            const icons = { note:'💡', tip:'✅', warning:'⚠️', important:'🔴', caution:'🔥' };
            const labels = { note:'Note', tip:'Tip', warning:'Warning', important:'Important', caution:'Caution' };
            const body  = quote.replace(/^\s*<p>\[!(?:NOTE|TIP|WARNING|IMPORTANT|CAUTION)\].*?<\/p>/si, '').trim();
            return `<div class="callout ${type}">
                <div class="callout-title">${icons[type]} ${labels[type]}</div>
                ${body ? `<div class="callout-body">${body}</div>` : ''}
            </div>`;
        }
        return `<blockquote>${quote}</blockquote>`;
    };

    const headingCounts = {};
    renderer.heading = function(text, level) {
        const key = text.toLowerCase();
        headingCounts[key] = (headingCounts[key] || 0) + 1;
        const id = paneUid
            ? 'h-' + paneUid + '-' + (Object.keys(headingCounts).indexOf(key))
            : 'h-' + key.replace(/[^\w]+/g, '-');
        return `<h${level} id="${id}">${text}</h${level}>`;
    };
    marked.setOptions({
        breaks: true, gfm: true,
        renderer,
        highlight: (code, lang) => {
            if (lang && hljs.getLanguage(lang)) {
                try { return hljs.highlight(code, { language: lang }).value; } catch {}
            }
            return hljs.highlightAuto(code).value;
        }
    });
}

function renderMarkdownInto(elementId, content, paneUid) {
    const el = document.getElementById(elementId);
    if (!el) return;
    configureMarked(paneUid);
    // Process note embeds ![[Title]] before rendering
    const processed = processNoteEmbeds(content || '', paneUid);
    el.innerHTML = renderWikilinks(marked.parse(processed), paneUid);
    applyCallouts(el);
    applyFoldableHeadings(el);
    // Async: fill embed placeholders
    resolveEmbedPlaceholders(el, paneUid);
}

function processNoteEmbeds(content, paneUid) {
    // Replace ![[Title]] with a placeholder; actual content filled async
    return content.replace(/!\[\[([^\]]+)\]\]/g, (match, title) => {
        const safe = title.replace(/"/g, '&quot;');
        return `<div class="note-embed-placeholder" data-title="${safe}" data-pane="${paneUid||''}">⏳ Embedding: ${escapeHtml(title)}</div>`;
    });
}

async function resolveEmbedPlaceholders(container, paneUid) {
    const placeholders = container.querySelectorAll('.note-embed-placeholder');
    for (const ph of placeholders) {
        const title = ph.dataset.title;
        const note = notes.find(n => n.title === title);
        if (!note) {
            ph.innerHTML = `<div class="note-embed broken">⚠ Note not found: ${escapeHtml(title)}</div>`;
            continue;
        }
        try {
            let n = noteCache.get(note.id);
            if (!n) {
                const res = await apiCall(`/notes/${note.id}`);
                if (!res.ok) throw new Error();
                n = await res.json();
                noteCache.set(n.id, n);
            }
            configureMarked(paneUid);
            const html = marked.parse(n.content || '');
            ph.outerHTML = `<div class="note-embed">
                <div class="note-embed-title">📄 ${escapeHtml(n.title)}</div>
                <div class="note-embed-body">${html}</div>
            </div>`;
        } catch {
            ph.innerHTML = `<div class="note-embed broken">⚠ Failed to load: ${escapeHtml(title)}</div>`;
        }
    }
}

// ════════════════════════════════════════════════════════════
// Wikilinks
// ════════════════════════════════════════════════════════════
function parseWikilinks(text) {
    const re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
    const links = [];
    let m;
    while ((m = re.exec(text)) !== null) {
        const full = m[1].trim();
        const hi = full.indexOf('#');
        links.push({
            fullMatch: m[0],
            targetTitle: hi >= 0 ? full.slice(0, hi).trim() : full,
            displayText: m[2]?.trim() || (hi >= 0 ? full.slice(0, hi).trim() : full),
            start: m.index, end: m.index + m[0].length
        });
    }
    return links;
}

function findNoteByTitle(title) {
    return notes.find(n => n.title.toLowerCase() === title.toLowerCase());
}

function renderWikilinks(content, paneUid) {
    const links = parseWikilinks(content);
    let result = content;
    for (let i = links.length - 1; i >= 0; i--) {
        const link = links[i];
        const target = findNoteByTitle(link.targetTitle);
        let replacement;
        if (target) {
            const nav = paneUid
                ? `navigateInPane('${paneUid}','${target.id}')`
                : `loadNote('${target.id}')`;
            replacement = `<a href="#" class="wikilink"
                onmouseenter="showWikilinkPreview(event,'${escapeHtml(target.title).replace(/'/g,"\\'")}','${target.id}')"
                onmousemove="moveWikilinkPreview(event)"
                onmouseleave="hideWikilinkPreview()"
                onclick="${nav};return false;">${escapeHtml(link.displayText)}</a>`;
        } else {
            replacement = `<a href="#" class="wikilink broken"
                title="Note not found — click to create"
                onclick="createNoteFromLink('${link.targetTitle.replace(/'/g,"\\'")}');return false;">${escapeHtml(link.displayText)}</a>`;
        }
        result = result.slice(0, link.start) + replacement + result.slice(link.end);
    }
    return result;
}

async function createNoteFromLink(title) {
    try {
        const res = await apiCall('/notes', {
            method: 'POST',
            body: JSON.stringify({ title, content: '' })
        });
        const note = await res.json();
        notes.push(note);
        await loadNotes();
        loadNote(note.id);
        showNotification(`Created: ${title}`, 'success');
    } catch { showNotification('Failed to create note', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Hover Preview
// ════════════════════════════════════════════════════════════
let previewTimeout = null;

function showWikilinkPreview(event, title, noteId) {
    clearTimeout(previewTimeout);
    previewTimeout = setTimeout(async () => {
        const preview = document.getElementById('wikilinkPreview');
        document.getElementById('wpTitle').textContent = title;
        const body = document.getElementById('wpBody');

        let note = noteCache.get(noteId);
        if (!note) {
            body.textContent = 'Loading…';
            preview.classList.add('visible');
            positionPreview(preview, event);
            try {
                const res = await apiCall(`/notes/${noteId}`);
                if (res.ok) { note = await res.json(); noteCache.set(note.id, note); }
            } catch {}
        }

        if (note) {
            // Render first ~600 chars of content as markdown
            const excerpt = note.content.slice(0, 600) + (note.content.length > 600 ? '\n\n…' : '');
            configureMarked(null);
            body.innerHTML = marked.parse(excerpt);
        } else {
            body.textContent = 'Click to open';
        }
        positionPreview(preview, event);
        preview.classList.add('visible');
    }, 380);
}

function moveWikilinkPreview(event) {
    const preview = document.getElementById('wikilinkPreview');
    if (preview.classList.contains('visible')) positionPreview(preview, event);
}

function positionPreview(el, event) {
    const x = event.clientX + 14;
    const y = event.clientY + 14;
    const maxX = window.innerWidth - el.offsetWidth - 16;
    const maxY = window.innerHeight - el.offsetHeight - 16;
    el.style.left = Math.min(x, maxX) + 'px';
    el.style.top  = Math.min(y, maxY) + 'px';
}

function hideWikilinkPreview() {
    clearTimeout(previewTimeout);
    document.getElementById('wikilinkPreview').classList.remove('visible');
}

// ════════════════════════════════════════════════════════════
// Tags
// ════════════════════════════════════════════════════════════
function extractTags(content) {
    const re = /(?<![a-zA-Z0-9])#([a-zA-Z0-9_\-/]+)/g;
    const hex = /^#[a-fA-F0-9]{3,6}$/;
    const tags = new Set();
    let m;
    while ((m = re.exec(content)) !== null) {
        if (!hex.test('#' + m[1])) tags.add(m[1].toLowerCase());
    }
    return [...tags];
}

function updateTagsDisplayFor(elId, content, paneUid) {
    const el = document.getElementById(elId);
    if (!el) return;
    const tags = extractTags(content);
    el.innerHTML = tags.map(t =>
        `<span class="tag">#${escapeHtml(t)}<span class="tag-remove" onclick="removeTagFromPane('${paneUid}','${t.replace(/'/g,"\\'")}',event)" title="Remove tag">✕</span></span>`
    ).join('') + (paneUid ? `<button class="tag-add-btn" onclick="startAddTag('${paneUid}')">+ tag</button>` : '');
}

async function removeTagFromPane(paneUid, tag, e) {
    e?.stopPropagation();
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const re = new RegExp(`(?<![a-zA-Z0-9])#${escapeRegex(tag)}(?![a-zA-Z0-9_\\-/])`, 'g');
    const newContent = pane.note.content.replace(re, '').replace(/[ \t]+\n/g, '\n').trim();
    try {
        const res = await apiCall(`/notes/${pane.note.id}`, {
            method: 'PUT', body: JSON.stringify({ title: pane.note.title, content: newContent })
        });
        if (!res.ok) throw new Error();
        const updated = await res.json();
        noteCache.set(updated.id, updated); pane.note = updated; currentNote = updated;
        renderPaneContent(pane);
    } catch { showNotification('Failed to remove tag', 'error'); }
}

function startAddTag(paneUid) {
    const tagsEl = document.getElementById(`tags-${paneUid}`);
    if (!tagsEl) return;
    // Replace "+ tag" button with input
    const addBtn = tagsEl.querySelector('.tag-add-btn');
    if (!addBtn) return;
    const input = document.createElement('input');
    input.className = 'tag-inline-input';
    input.placeholder = 'tag name…';
    addBtn.replaceWith(input);
    input.focus();
    const finish = async () => {
        const tag = input.value.trim().replace(/^#/, '').replace(/\s+/g, '-');
        if (tag) {
            const pane = openPanes.find(p => p.uid === paneUid);
            if (pane) {
                const newContent = pane.note.content.trimEnd() + `\n\nTags: #${tag}`;
                try {
                    const res = await apiCall(`/notes/${pane.note.id}`, {
                        method: 'PUT', body: JSON.stringify({ title: pane.note.title, content: newContent })
                    });
                    if (!res.ok) throw new Error();
                    const updated = await res.json();
                    noteCache.set(updated.id, updated); pane.note = updated; currentNote = updated;
                    renderPaneContent(pane);
                } catch { showNotification('Failed to add tag', 'error'); }
            }
        } else {
            updateTagsDisplayFor(`tags-${paneUid}`, openPanes.find(p=>p.uid===paneUid)?.note.content || '', paneUid);
        }
    };
    input.onblur = finish;
    input.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = ''; input.blur(); }
    };
}

async function filterByTag(tag) {
    isSearching = true;
    try {
        const res = await apiCall(`/tags/${encodeURIComponent(tag)}/notes`);
        notes = await res.json();
        renderNotesList();
        showNotification(`#${tag}`, 'info');
    } catch { showNotification('Filter failed', 'error'); }
}

// Backlinks (per pane)
// ════════════════════════════════════════════════════════════
async function loadBacklinks(noteId) {
    try {
        const res = await apiCall(`/notes/${noteId}/links`);
        return res.ok ? await res.json() : null;
    } catch { return null; }
}

async function loadAndRenderBacklinksFor(paneUid, noteId) {
    const data = await loadBacklinks(noteId);
    const container = document.getElementById(`backlinks-${paneUid}`);
    if (!container) return;

    if (!data || (!data.outgoing?.length && !data.incoming?.length)) {
        container.innerHTML = '<div class="no-backlinks">No links to or from this note</div>';
        return;
    }

    let html = '';
    if (data.incoming?.length) {
        html += `<div class="backlinks-section"><div class="backlinks-section-title">Links to this note</div>`;
        html += data.incoming.map(l => {
            const cached = noteCache.get(l.target_id);
            const excerpt = cached ? getBacklinkExcerpt(cached.content, l.display_text) : '';
            return `<div class="backlink-item" onclick="navigateInPane('${paneUid}','${l.target_id}')">
                <div class="backlink-title">${escapeHtml(l.display_text)}</div>
                ${excerpt ? `<div class="note-item-snippet" style="padding-left:0;">${excerpt}</div>` : ''}
             </div>`;
        }).join('') + '</div>';
    }
    if (data.outgoing?.length) {
        html += `<div class="backlinks-section"><div class="backlinks-section-title">Links from this note</div>`;
        html += data.outgoing.map(l => l.exists
            ? `<div class="backlink-item" onclick="navigateInPane('${paneUid}','${l.target_id || ''}')">
                   <div class="backlink-title">${escapeHtml(l.display_text)}</div>
               </div>`
            : `<div class="backlink-item broken" onclick="createNoteFromLink('${l.target_title.replace(/'/g,"\\'")}')">
                   <div class="backlink-title">${escapeHtml(l.display_text)} <span style="color:var(--danger);font-size:10.5px;">+create</span></div>
               </div>`
        ).join('') + '</div>';
    }
    container.innerHTML = html;
}

function handleModalBg(e) { if (e.target.classList.contains('modal-overlay')) closeEditorModal(); }
function closeEditorModal() {

function updateModalPreview() {

async function saveFromModal(silent = false) {
    const modal = document.getElementById('editorModal');
    const paneUid = modal?.dataset.paneUid;
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;

    const title   = document.getElementById('modalTitle').value;
    const content = document.getElementById('modalContent').value;

    // Save a version snapshot before overwriting
    saveVersion(pane.note.id, pane.note.title, pane.note.content);

    const res = await fetch(`${API_URL}/notes/${pane.note.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
    });
    if (!res.ok) throw new Error('Save failed');
    const updated = await res.json();
    noteCache.set(updated.id, updated);
    pane.note = updated;
    currentNote = updated;
    renderPaneContent(pane);
    await loadNotes();
    if (!silent) {
        closeEditorModal();

// ════════════════════════════════════════════════════════════
// Image paste & drag-drop in editor
// ════════════════════════════════════════════════════════════
function handleImagePaste(event) {
    const items = event.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
        if (item.type.startsWith('image/')) {
            event.preventDefault();
            const file = item.getAsFile();
            insertImageFromFile(event.target, file);
            break;
        }
    }
}

function handleImageDrop(event) {
    event.preventDefault();
    const file = event.dataTransfer.files[0];
    if (file?.type.startsWith('image/')) {
        insertImageFromFile(document.getElementById('modalContent'), file);
    }
}

function insertImageFromFile(textarea, file) {
    const reader = new FileReader();
    reader.onload = e => {
        const markdown = `![${file.name}](${e.target.result})`;
        insertAtCursor(textarea, markdown);
        updateModalPreview();
    };
    reader.readAsDataURL(file);
}

function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
}

// ════════════════════════════════════════════════════════════
// Editor find & replace
// ════════════════════════════════════════════════════════════
function toggleEditorFindReplace() {
    const bar = document.getElementById('editorFindReplace');
    if (!bar) return;
    const visible = bar.style.display !== 'none';
    bar.style.display = visible ? 'none' : 'flex';
    if (!visible) document.getElementById('frFind')?.focus();
}

function editorFRHighlight() {
    const q = document.getElementById('frFind')?.value || '';
    const textarea = document.getElementById('modalContent');
    const counter = document.getElementById('frCount');
    if (!textarea || !q) { if (counter) counter.textContent = ''; return; }
    const matches = [...textarea.value.matchAll(new RegExp(escapeRegex(q), 'gi'))];
    if (counter) counter.textContent = `${matches.length} match${matches.length !== 1 ? 'es' : ''}`;
}

function editorFRReplace() {
    const q = document.getElementById('frFind')?.value || '';
    const r = document.getElementById('frReplace')?.value || '';
    const textarea = document.getElementById('modalContent');
    if (!textarea || !q) return;
    const pos = textarea.selectionStart;
    const val = textarea.value;
    const re = new RegExp(escapeRegex(q), 'i');
    // Find next from cursor
    const after = val.slice(pos);
    const match = re.exec(after);
    if (match) {
        const start = pos + match.index;
        textarea.value = val.slice(0, start) + r + val.slice(start + match[0].length);
        textarea.selectionStart = start;
        textarea.selectionEnd = start + r.length;
    }
    editorFRHighlight();
    updateModalPreview();
}

function editorFRReplaceAll() {
    const q = document.getElementById('frFind')?.value || '';
    const r = document.getElementById('frReplace')?.value || '';
    const textarea = document.getElementById('modalContent');
    if (!textarea || !q) return;
    textarea.value = textarea.value.replace(new RegExp(escapeRegex(q), 'gi'), r);
    editorFRHighlight();
    updateModalPreview();
    scheduleAutosave();
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// ════════════════════════════════════════════════════════════
// Wikilink autocomplete in editor
// ════════════════════════════════════════════════════════════
let _wlSelectedIdx = 0;
let _wlMatches = [];

function getWikilinkQuery(textarea) {
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const before = val.slice(0, pos);
    const m = before.match(/\[\[([^\][\n]*)$/);
    return m ? m[1] : null;
}

function handleWikilinkAutocomplete(event) {
    const textarea = event.target;
    const q = getWikilinkQuery(textarea);
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;

    if (q === null) { dropdown.style.display = 'none'; _wlMatches = []; return; }

    _wlMatches = notes
        .filter(n => n.title.toLowerCase().includes(q.toLowerCase()))
        .slice(0, 8);

    if (_wlMatches.length === 0) { dropdown.style.display = 'none'; return; }

    _wlSelectedIdx = 0;
    renderWikilinkDropdown();
    dropdown.style.display = 'block';
}

function renderWikilinkDropdown() {
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;
    dropdown.innerHTML = _wlMatches.map((n, i) => `
        <div class="wl-item ${i === _wlSelectedIdx ? 'selected' : ''}" onmousedown="applyWikilinkCompletion('${n.title.replace(/'/g, "\\'")}')">
            📄 ${escapeHtml(n.title)}
        </div>`).join('');
}

function handleWikilinkKey(event) {
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown || dropdown.style.display === 'none') return;
    if (event.key === 'ArrowDown') {
        event.preventDefault();
        _wlSelectedIdx = Math.min(_wlSelectedIdx + 1, _wlMatches.length - 1);
        renderWikilinkDropdown();
    } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        _wlSelectedIdx = Math.max(_wlSelectedIdx - 1, 0);
        renderWikilinkDropdown();
    } else if (event.key === 'Enter' || event.key === 'Tab') {
        if (_wlMatches.length > 0) {
            event.preventDefault();
            applyWikilinkCompletion(_wlMatches[_wlSelectedIdx].title);
        }
    } else if (event.key === 'Escape') {
        dropdown.style.display = 'none';
    }
}

function applyWikilinkCompletion(title) {
    const textarea = document.getElementById('modalContent');
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!textarea) return;
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const before = val.slice(0, pos);
    const after = val.slice(pos);
    // Replace [[query with [[Title]]
    const replaced = before.replace(/\[\[([^\][\n]*)$/, `[[${title}]]`);
    textarea.value = replaced + after;
    textarea.selectionStart = textarea.selectionEnd = replaced.length;
    dropdown.style.display = 'none';
    _wlMatches = [];
    updateModalPreview();
}

function toggleExportMenu(paneUid) {
    const wrap = document.getElementById(`export-${paneUid}`);
    // Close all other open menus
    document.querySelectorAll('.export-wrap.open').forEach(el => {
        if (el !== wrap) el.classList.remove('open');
    });
    wrap?.classList.toggle('open');
    // Close on outside click
    setTimeout(() => {
        const close = e => { if (!wrap?.contains(e.target)) { wrap?.classList.remove('open'); document.removeEventListener('click', close); } };
        document.addEventListener('click', close);
    }, 0);
}

function exportMarkdown(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const { note } = pane;
    const blob = new Blob([`# ${note.title}\n\n${note.content}`], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${note.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.md`;
    a.click();
    URL.revokeObjectURL(a.href);
    document.getElementById(`export-${paneUid}`)?.classList.remove('open');
}

function exportPDF(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    // Hide all other panes, print, restore
    const allPanes = document.querySelectorAll('.note-pane');
    allPanes.forEach(el => {
        if (el.id !== `pane-${paneUid}`) el.style.display = 'none';
    });
    document.getElementById(`export-${paneUid}`)?.classList.remove('open');
    window.print();
    allPanes.forEach(el => el.style.display = '');
}

// Actions available in command palette (> prefix)
const CMD_ACTIONS = [
    { icon: '📝', label: 'New Note',        hint: '>new',    run: () => createNewNote() },
    { icon: '🌙', label: 'Toggle Dark Mode', hint: '>dark',   run: () => { darkMode=!darkMode; localStorage.setItem('synote_dark',darkMode); applyDarkMode(); } },
    { icon: '🧘', label: 'Toggle Zen Mode',  hint: '>zen',    run: () => toggleZenMode() },
    { icon: '🕸',  label: 'Open Graph',       hint: '>graph',  run: () => { closeCommandPalette(); openGraphView(); } },
    { icon: '⌨',  label: 'Shortcuts',        hint: '>keys',   run: () => { closeCommandPalette(); showShortcutsModal(); } },
    { icon: '📊', label: 'Note Stats',       hint: '>stats',  run: () => { const p=openPanes[0]; if(p) showNoteStats(p.uid); } },
    { icon: '🎨', label: 'Change Accent',    hint: '>accent', run: () => { closeCommandPalette(); document.getElementById('accentPicker')?.click(); } },
];

let cmdItems = []; // unified list: {type:'note'|'action', data}

function updateCmdResults() {
    const raw = document.getElementById('cmdInput')?.value || '';
    const q = raw.toLowerCase().trim();
    const isAction = raw.startsWith('>');

    if (isAction) {
        const aq = q.slice(1);
        const matched = CMD_ACTIONS.filter(a => a.label.toLowerCase().includes(aq) || a.hint.slice(1).includes(aq));
        cmdItems = matched.map(a => ({ type: 'action', data: a }));
    } else if (q) {
        const noteMatches = notes
            .filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q))
            .slice(0, 20);
        cmdItems = noteMatches.map(n => ({ type: 'note', data: n }));
    } else {
        // Default: recent notes + action hint
        const recentIds = recentlyViewed.map(r => r.id);
        const recentNotes = recentIds.map(id => notes.find(n => n.id === id)).filter(Boolean);
        const others = getSortedNotes(notes).filter(n => !recentIds.includes(n.id));
        const noteItems = [...recentNotes, ...others].slice(0, 12).map(n => ({ type: 'note', data: n }));
        const actionItems = CMD_ACTIONS.slice(0, 3).map(a => ({ type: 'action', data: a }));
        cmdItems = [...actionItems, ...noteItems];
    }

    cmdSelectedIdx = Math.min(cmdSelectedIdx, Math.max(0, cmdItems.length - 1));
    renderCmdResults();
}

function renderCmdResults() {
    const el = document.getElementById('cmdResults');
    if (!el) return;
    if (cmdItems.length === 0) {
        el.innerHTML = '<div class="cmd-empty">No results — try <kbd style="background:var(--border-light);padding:1px 5px;border-radius:3px;font-size:10px;">&gt;action</kbd> for commands</div>';
        return;
    }
    let html = '';
    let inNotes = false, inActions = false;
    cmdItems.forEach((item, i) => {
        const sel = i === cmdSelectedIdx ? 'selected' : '';
        if (item.type === 'action' && !inActions) {
            inActions = true;
            html += '<div class="cmd-section-label">Actions</div>';
        }
        if (item.type === 'note' && !inNotes) {
            inNotes = true;
            html += '<div class="cmd-section-label">Notes</div>';
        }
        if (item.type === 'action') {
            html += `<div class="cmd-item ${sel}" onclick="selectCmdItem(${i})">
                <span class="cmd-item-icon">${item.data.icon}</span>
                <span class="cmd-item-title">${item.data.label}</span>
                <span class="cmd-item-date" style="font-family:var(--font-mono);font-size:10px;opacity:0.5;">${item.data.hint}</span>
            </div>`;
        } else {
            const n = item.data;
            const excerpt = n.content.replace(/[#*`\[\]]/g, '').slice(0, 60);
            html += `<div class="cmd-item ${sel}" onclick="selectCmdItem(${i})">
                <span class="cmd-item-icon">📄</span>
                <div style="flex:1;min-width:0;">
                    <div class="cmd-item-title">${escapeHtml(n.title)}</div>
                    <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(excerpt)}</div>
                </div>
                <span class="cmd-item-date">${new Date(n.updated_at).toLocaleDateString()}</span>
            </div>`;
        }
    });
    el.innerHTML = html;
}

function selectCmdItem(idx) {
    const item = cmdItems[idx];
    if (!item) return;
    closeCommandPalette();
    if (item.type === 'action') {
        item.data.run();
    } else {
        loadNote(item.data.id);
    }
}

function handleCmdKey(e) {
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        cmdSelectedIdx = Math.min(cmdSelectedIdx + 1, cmdItems.length - 1);
        renderCmdResults();
        document.querySelectorAll('.cmd-item')[cmdSelectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        cmdSelectedIdx = Math.max(cmdSelectedIdx - 1, 0);
        renderCmdResults();
        document.querySelectorAll('.cmd-item')[cmdSelectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
        selectCmdItem(cmdSelectedIdx);
    } else if (e.key === 'Escape') {
        closeCommandPalette();
    }
}

// Graph View
// ════════════════════════════════════════════════════════════
let graphSimulation = null;

async function showGraphView() {
    const container = document.getElementById('panesContainer');
    container.innerHTML = `
        <div class="graph-container">
            <div class="graph-header">
                <h2>⬡ Note Graph</h2>
                <button class="btn" onclick="closeGraphView()">← Back</button>
            </div>
            <svg class="graph-canvas" id="graphCanvas"></svg>
        </div>`;
    try {
        const res = await apiCall('/graph');
        if (!res.ok) { showNotification('Failed to load graph', 'error'); return; }
        let data;
        try { data = await res.json(); } catch { data = { nodes: [], edges: [] }; }
        if (!data.nodes?.length) {
            document.getElementById('graphCanvas').innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="Inter,sans-serif">No notes yet. Create notes with [[links]] to see the graph!</text>`;
            return;
        }
        renderForceGraph(data);
    } catch { showNotification('Failed to load graph', 'error'); }
}

function closeGraphView() {
    openPanes = []; currentNote = null;
    renderPanes(); renderNotesList();
}

function renderForceGraph(data) {
    const svg = d3.select('#graphCanvas');
    const width = svg.node().parentElement.clientWidth;
    const height = svg.node().parentElement.clientHeight;
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('width', width).attr('height', height);
    svg.selectAll('*').remove();
    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.1,4]).on('zoom', e => g.attr('transform', e.transform)));
    // Size nodes by connection count
    const connCount = {};
    (data.edges||[]).forEach(e => {
        const s = e.source?.id ?? e.source, t = e.target?.id ?? e.target;
        connCount[s] = (connCount[s]||0)+1; connCount[t] = (connCount[t]||0)+1;
    });
    data.nodes.forEach(n => { n.size = Math.min(20, 7 + (connCount[n.id]||0) * 2); });

    const sim = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.edges).id(d=>d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-280))
        .force('center', d3.forceCenter(width/2, height/2))
        .force('collision', d3.forceCollide().radius(d=>d.size+10));
    graphSimulation = sim;
    const link = g.append('g').selectAll('line').data(data.edges).enter().append('line').attr('class','graph-link');
    const node = g.append('g').selectAll('g').data(data.nodes).enter().append('g').attr('class','graph-node')
        .call(d3.drag()
            .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
            .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
            .on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
        .on('click',(e,d)=>{ e.stopPropagation(); loadNote(d.id); });
    node.append('circle').attr('r',d=>d.size||8).attr('fill','#6d5ef5').attr('stroke','rgba(255,255,255,0.2)').attr('stroke-width',2);
    node.append('text').attr('dy',d=>(d.size||8)+14).attr('text-anchor','middle')
        .text(d=>d.title?.length>22?d.title.slice(0,22)+'…':d.title)
        .attr('font-size','11px').attr('fill','rgba(255,255,255,0.7)').attr('font-family','Inter,sans-serif');

    // Hover: highlight connected nodes, fade others
    node.on('mouseover', (e, d) => {
        const connected = new Set([d.id]);
        data.edges.forEach(l => {
            const src = l.source.id ?? l.source;
            const tgt = l.target.id ?? l.target;
            if (src === d.id) connected.add(tgt);
            if (tgt === d.id) connected.add(src);
        });
        node.style('opacity', n => connected.has(n.id) ? 1 : 0.15);
        link.style('opacity', l => {
            const src = l.source.id ?? l.source;
            const tgt = l.target.id ?? l.target;
            return (src === d.id || tgt === d.id) ? 1 : 0.05;
        });
    }).on('mouseout', () => {
        node.style('opacity', 1);
        link.style('opacity', 1);
    });

    sim.on('tick',()=>{
        link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

// ════════════════════════════════════════════════════════════
// Keyboard shortcuts
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
    const inInput = ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)
        || document.activeElement?.contentEditable === 'true';

    // Cmd/Ctrl+K → command palette
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('cmdOverlay') ? closeCommandPalette() : showCommandPalette();
    }
    // Cmd+S → save if modal open
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        if (document.getElementById('editorModal')) saveFromModal();
    }
    // Cmd+F → find in active pane
    if ((e.metaKey || e.ctrlKey) && e.key === 'f' && !document.getElementById('editorModal')) {
        e.preventDefault();
        const pane = openPanes[0];
        if (pane) toggleFindBar(pane.uid);
    }
    // Cmd+H → find & replace in editor
    if ((e.metaKey || e.ctrlKey) && e.key === 'h' && document.getElementById('editorModal')) {
        e.preventDefault();
        toggleEditorFindReplace();
    }
    // Cmd+N → new note
    if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        showNewNoteForm();
    }
    // Cmd+D → toggle dark mode
    if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
        e.preventDefault();
        toggleDarkMode();
    }
    // Cmd+. → toggle zen mode
    if ((e.metaKey || e.ctrlKey) && e.key === '.') {
        e.preventDefault();
        toggleZenMode();
    }
    // ? → shortcuts cheatsheet (not in input)
    if (e.key === '?' && !inInput) {
        e.preventDefault();
        document.getElementById('shortcutsOverlay') ? document.getElementById('shortcutsOverlay').remove() : showShortcutsModal();
    }
    // Esc → close topmost overlay
    if (e.key === 'Escape') {
        if (document.getElementById('shortcutsOverlay')) { document.getElementById('shortcutsOverlay').remove(); return; }
        if (document.getElementById('cmdOverlay')) { closeCommandPalette(); return; }
        if (document.getElementById('editorModal')) { closeEditorModal(); return; }
        if (zenMode) { toggleZenMode(); return; }
        // Close any open export menus
        document.querySelectorAll('.export-wrap.open').forEach(el => el.classList.remove('open'));
    }
});

// ════════════════════════════════════════════════════════════

// Generic horizontal drag resize between two elements
function makeResizable(handle, getLeft, getRight, minLeft = 200, minRight = 200) {
    handle.addEventListener('mousedown', e => {
        e.preventDefault();
        const leftEl  = getLeft();
        const rightEl = getRight();
        if (!leftEl || !rightEl) return;

        const startX      = e.clientX;
        const leftStart   = leftEl.getBoundingClientRect().width;
        const totalWidth  = leftEl.parentElement.getBoundingClientRect().width;
        const maxLeft     = totalWidth - minRight;

        // Right pane becomes fluid so its LEFT edge tracks the handle
        rightEl.style.flex = '1 1 0';

        handle.classList.add('dragging');
        document.body.classList.add('resizing');

        const onMove = e => {
            const dx      = e.clientX - startX;
            const newLeft = Math.max(minLeft, Math.min(maxLeft, leftStart + dx));
            leftEl.style.flex = `0 0 ${newLeft}px`;
        };

        const onUp = () => {
            handle.classList.remove('dragging');
            document.body.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });

    // Touch support
    handle.addEventListener('touchstart', e => {
        e.preventDefault();
        const leftEl  = getLeft();
        const rightEl = getRight();
        if (!leftEl || !rightEl) return;

        const startX     = e.touches[0].clientX;
        const leftStart  = leftEl.getBoundingClientRect().width;
        const totalWidth = leftEl.parentElement.getBoundingClientRect().width;
        const maxLeft    = totalWidth - minRight;

        handle.classList.add('dragging');
        rightEl.style.flex = '1 1 0';

        const onMove = e => {
            const dx      = e.touches[0].clientX - startX;
            const newLeft = Math.max(minLeft, Math.min(maxLeft, leftStart + dx));
            leftEl.style.flex = `0 0 ${newLeft}px`;
        };

        const onEnd = () => {
            handle.classList.remove('dragging');
            handle.removeEventListener('touchmove', onMove);
            handle.removeEventListener('touchend', onEnd);
        };

        handle.addEventListener('touchmove', onMove, { passive: false });
        handle.addEventListener('touchend', onEnd);
    }, { passive: false });
}

// Insert resize handles between all open panes
function addPaneResizeHandles() {
    const container = document.getElementById('panesContainer');
    if (!container) return;

    // Always purge stale handles first to prevent duplicates
    container.querySelectorAll('.pane-resize-handle').forEach(h => h.remove());

    const panes = [...container.querySelectorAll('.note-pane')];
    panes.forEach((pane, i) => {
        if (i === panes.length - 1) return;
        const handle = document.createElement('div');
        handle.className = 'pane-resize-handle';
        pane.after(handle);

        // Skip over any non-pane siblings (other handles etc.)
        const leftPane  = () => {
            let el = handle.previousElementSibling;
            while (el && !el.classList.contains('note-pane')) el = el.previousElementSibling;
            return el;
        };
        const rightPane = () => {
            let el = handle.nextElementSibling;
            while (el && !el.classList.contains('note-pane')) el = el.nextElementSibling;
            return el;
        };

        makeResizable(handle, leftPane, rightPane, 280, 280);
    });
}

// Add resize handle inside the editor modal split
function addEditorResizeHandle() {
    const editorPane  = document.querySelector('#editorModal .editor-pane');
    const previewPane = document.querySelector('#editorModal .preview-pane');
    const split       = document.querySelector('#editorModal .editor-split');
    if (!editorPane || !previewPane || !split) return;

    const handle = document.createElement('div');
    handle.className = 'editor-resize-handle';
    editorPane.after(handle);
    makeResizable(handle, () => editorPane, () => previewPane, 180, 180);
}

// Sidebar resize
function initSidebarResize() {
    const sidebar = document.querySelector('.sidebar');
    const handle  = document.getElementById('sidebarResizeHandle');
    if (!sidebar || !handle) return;

    makeResizable(
        handle,
        () => sidebar,
        () => document.getElementById('panesContainer'),
        180, 320
    );
}

// New note
// ════════════════════════════════════════════════════════════
function showNewNoteForm() {
    const form = document.getElementById('newNoteForm');
    form.classList.add('open');
    document.getElementById('newNoteInput').focus();
}

function hideNewNoteForm() {
    document.getElementById('newNoteForm').classList.remove('open');
    document.getElementById('newNoteInput').value = '';
}

function handleNewNoteKey(e) {
    if (e.key === 'Enter') createNewNote();
    if (e.key === 'Escape') hideNewNoteForm();
}

async function createNewNote() {
    const title = document.getElementById('newNoteInput').value.trim();
    if (!title) return;
    try {
        const res = await apiCall('/notes', {
            method: 'POST',
            body: JSON.stringify({ title, content: '' })
        });
        if (!res.ok) throw new Error();
        const note = await res.json();
        noteCache.set(note.id, note);
        hideNewNoteForm();
        await loadNotes();
        loadNote(note.id);
        showNotification(`Created "${title}"`, 'success');
    } catch { showNotification('Failed to create note', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Delete note
// ════════════════════════════════════════════════════════════
function confirmDeleteNote(paneUid) {
    const wrap = document.getElementById(`delete-wrap-${paneUid}`);
    if (!wrap) return;
    // Close if already open
    if (wrap.querySelector('.delete-confirm')) {
        wrap.querySelector('.delete-confirm').remove(); return;
    }
    // Close any other open confirms
    document.querySelectorAll('.delete-confirm').forEach(el => el.remove());

    const box = document.createElement('div');
    box.className = 'delete-confirm';
    box.innerHTML = `
        <p>Delete this note?<br><span style="font-size:11px;color:var(--text-muted);">This cannot be undone.</span></p>
        <div class="delete-confirm-actions">
            <button class="btn btn-danger" onclick="executeDelete('${paneUid}')">Delete</button>
            <button class="btn" onclick="this.closest('.delete-confirm').remove()">Cancel</button>
        </div>`;
    wrap.appendChild(box);

    // Close on outside click
    setTimeout(() => {
        const close = e => { if (!wrap.contains(e.target)) { box.remove(); document.removeEventListener('click', close); } };
        document.addEventListener('click', close);
    }, 0);
}

async function executeDelete(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    try {
        const res = await apiCall(`/notes/${pane.note.id}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error();
        noteCache.delete(pane.note.id);
        closePane(paneUid);
        await loadNotes();
        showNotification('Note deleted', 'info');
    } catch { showNotification('Delete failed', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Auto-save
// ════════════════════════════════════════════════════════════
let autosaveTimer = null;

function scheduleAutosave() {
    const status = document.getElementById('autosaveStatus');
    if (status) { status.textContent = 'Unsaved changes'; status.className = 'autosave-status'; }
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(async () => {
        if (status) { status.textContent = 'Saving…'; status.className = 'autosave-status saving'; }
        try {
            await saveFromModal(true); // silent = true
            if (status) { status.textContent = '✓ Saved'; status.className = 'autosave-status saved'; }
            setTimeout(() => { if (status) { status.textContent = ''; status.className = 'autosave-status'; } }, 2000);
        } catch {
            if (status) { status.textContent = 'Save failed'; status.className = 'autosave-status'; }
        }
    }, 1500);
}

// ════════════════════════════════════════════════════════════
// Note locking
// ════════════════════════════════════════════════════════════
function toggleLockNote(noteId) {
    if (lockedNotes.has(noteId)) lockedNotes.delete(noteId);
    else lockedNotes.add(noteId);
    localStorage.setItem('synote_locked', JSON.stringify([...lockedNotes]));
    // Re-render all panes showing this note
    openPanes.filter(p => p.note.id === noteId).forEach(p => renderPaneContent(p));
    showNotification(lockedNotes.has(noteId) ? '🔒 Note locked' : '🔓 Note unlocked', 'info');
}

// ════════════════════════════════════════════════════════════
// Focus time tracker
// ════════════════════════════════════════════════════════════
function startFocusTimer(paneUid) {
    stopFocusTimer(paneUid);
    const state = { elapsed: 0, intervalId: null };
    focusTimers[paneUid] = state;
    state.intervalId = setInterval(() => {
        state.elapsed++;
        const el = document.getElementById(`timer-${paneUid}`);
        if (!el) { stopFocusTimer(paneUid); return; }
        const m = Math.floor(state.elapsed / 60);
        const s = state.elapsed % 60;
        el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }, 1000);
}

function stopFocusTimer(paneUid) {
    if (focusTimers[paneUid]?.intervalId) {
        clearInterval(focusTimers[paneUid].intervalId);
        delete focusTimers[paneUid];
    }
}

// Stop timers when pane closes
const _origClosePane = closePane;

// ════════════════════════════════════════════════════════════
// Stars / pinned notes
// ════════════════════════════════════════════════════════════
function toggleStar(noteId, e) {
    if (e) e.stopPropagation();
    if (starredNotes.has(noteId)) {
        starredNotes.delete(noteId);
    } else {
        starredNotes.add(noteId);
    }
    localStorage.setItem('synote_starred', JSON.stringify([...starredNotes]));
    // Update star buttons across all open panes for this note
    openPanes.forEach(p => {
        if (p.note.id !== noteId) return;
        const btn = document.querySelector(`#pane-${p.uid} .star-btn`);
        if (btn) {
            const s = starredNotes.has(noteId);
            btn.classList.toggle('starred', s);
            btn.title = s ? 'Unstar' : 'Star note';
            btn.textContent = s ? '⭐' : '☆';
        }
    });
    renderNotesList();
}

// ════════════════════════════════════════════════════════════
// Word count
// ════════════════════════════════════════════════════════════
function getWordCount(content) {
    return (content || '')
        .replace(/```[\s\S]*?```/g, '')   // strip code blocks
        .replace(/`[^`]*`/g, '')           // strip inline code
        .replace(/[#*_~\[\]>]/g, '')       // strip markdown syntax
        .trim().split(/\s+/).filter(Boolean).length;
}

// ════════════════════════════════════════════════════════════
// Inline rename
// ════════════════════════════════════════════════════════════
function startRenameInPane(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const el = document.querySelector(`#pane-${paneUid} .pane-title-label`);
    if (!el || el.contentEditable === 'true') return;

    const original = pane.note.title;
    el.contentEditable = 'true';
    el.style.cssText += ';background:var(--accent-light);border-radius:3px;padding:1px 5px;outline:1px solid var(--accent);';
    el.focus();

    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);

    const finish = async () => {
        if (el.contentEditable !== 'true') return;
        el.contentEditable = 'false';
        el.style.background = '';
        el.style.outline = '';
        el.style.padding = '';
        el.style.borderRadius = '';
        const newTitle = el.textContent.trim();
        if (!newTitle || newTitle === original) { el.textContent = original; return; }
        try {
            const res = await apiCall(`/notes/${pane.note.id}`, {
                method: 'PUT',
                body: JSON.stringify({ title: newTitle, content: pane.note.content })
            });
            const updated = await res.json();
            noteCache.set(updated.id, updated);
            pane.note = updated;
            currentNote = updated;
            await loadNotes();
            renderPaneContent(pane);
            showNotification('Renamed!', 'success');
        } catch {
            el.textContent = original;
            showNotification('Rename failed', 'error');
        }
    };

    el.onblur = finish;
    el.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') { el.textContent = original; el.contentEditable = 'false'; el.onblur = null; el.style.cssText = ''; }
    };
}

// ════════════════════════════════════════════════════════════
// Find in note
// ════════════════════════════════════════════════════════════
const findState = {}; // paneUid → { matches, idx }

function toggleFindBar(paneUid) {
    const pane = document.getElementById(`pane-${paneUid}`);
    if (!pane) return;
    const existing = pane.querySelector('.find-bar');
    if (existing) { closeFindBar(paneUid); return; }

    const bar = document.createElement('div');
    bar.className = 'find-bar';
    bar.id = `find-bar-${paneUid}`;
    bar.innerHTML = `
        <input class="find-input" id="find-input-${paneUid}" placeholder="Find in note…"
               oninput="runFind('${paneUid}')" onkeydown="handleFindKey(event,'${paneUid}')">
        <span class="find-count" id="find-count-${paneUid}"></span>
        <button class="btn-icon" onclick="stepFind('${paneUid}',-1)" title="Previous">↑</button>
        <button class="btn-icon" onclick="stepFind('${paneUid}',1)"  title="Next">↓</button>
        <button class="btn-icon" onclick="closeFindBar('${paneUid}')">✕</button>`;

    // Insert before footer (or append to pane)
    const footer = pane.querySelector('.pane-footer');
    footer ? footer.before(bar) : pane.appendChild(bar);
    document.getElementById(`find-input-${paneUid}`)?.focus();
}

function closeFindBar(paneUid) {
    clearFindHighlights(paneUid);
    document.getElementById(`find-bar-${paneUid}`)?.remove();
    delete findState[paneUid];
}

function handleFindKey(e, paneUid) {
    if (e.key === 'Escape') { closeFindBar(paneUid); return; }
    if (e.key === 'Enter') stepFind(paneUid, e.shiftKey ? -1 : 1);
}

function runFind(paneUid) {
    const query = document.getElementById(`find-input-${paneUid}`)?.value || '';
    clearFindHighlights(paneUid);
    const input = document.getElementById(`find-input-${paneUid}`);
    const count = document.getElementById(`find-count-${paneUid}`);
    if (!query) { count.textContent = ''; input?.classList.remove('no-match'); return; }

    const preview = document.getElementById(`preview-${paneUid}`);
    if (!preview) return;

    // Walk text nodes and wrap matches
    const matches = [];
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
    const re = new RegExp(escapeRegex(query), 'gi');
    const nodesToReplace = [];
    let node;
    while ((node = walker.nextNode())) {
        if (re.test(node.nodeValue)) nodesToReplace.push(node);
        re.lastIndex = 0;
    }
    nodesToReplace.forEach(textNode => {
        const frag = document.createDocumentFragment();
        let last = 0, m;
        re.lastIndex = 0;
        while ((m = re.exec(textNode.nodeValue)) !== null) {
            frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last, m.index)));
            const mark = document.createElement('mark');
            mark.className = 'find-hl';
            mark.textContent = m[0];
            mark.dataset.findPaneUid = paneUid;
            frag.appendChild(mark);
            matches.push(mark);
            last = m.index + m[0].length;
        }
        frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last)));
        textNode.parentNode.replaceChild(frag, textNode);
    });

    findState[paneUid] = { matches, idx: -1 };

    if (matches.length === 0) {
        input?.classList.add('no-match');
        count.textContent = 'No matches';
    } else {
        input?.classList.remove('no-match');
        stepFind(paneUid, 1);
    }
}

function stepFind(paneUid, dir) {
    const state = findState[paneUid];
    if (!state || !state.matches.length) return;
    state.matches[state.idx]?.classList.remove('current');
    state.idx = (state.idx + dir + state.matches.length) % state.matches.length;
    const cur = state.matches[state.idx];
    cur.classList.add('current');
    cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    document.getElementById(`find-count-${paneUid}`).textContent =
        `${state.idx + 1} / ${state.matches.length}`;
}

function clearFindHighlights(paneUid) {
    document.querySelectorAll(`mark.find-hl[data-find-pane-uid="${paneUid}"]`).forEach(m => {
        m.replaceWith(document.createTextNode(m.textContent));
    });
}

// ════════════════════════════════════════════════════════════
// Accent color picker
// ════════════════════════════════════════════════════════════
function applyAccentColor(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const root = document.documentElement.style;
    root.setProperty('--accent', hex);
    root.setProperty('--accent-hover', shadeHex(hex, -20));
    root.setProperty('--accent-light', `rgba(${r},${g},${b},0.12)`);
    root.setProperty('--accent-dim',   `rgba(${r},${g},${b},0.08)`);
    document.getElementById('accentColorPicker').value = hex;
    document.querySelector('.color-picker-btn').style.background = hex;
    localStorage.setItem('synote_accent', hex);
}

function shadeHex(hex, amt) {
    const clamp = v => Math.max(0, Math.min(255, v));
    const r = clamp(parseInt(hex.slice(1,3),16) + amt);
    const g = clamp(parseInt(hex.slice(3,5),16) + amt);
    const b = clamp(parseInt(hex.slice(5,7),16) + amt);
    return `#${[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}`;
}

function initAccentColor() {
    const saved = localStorage.getItem('synote_accent');
    if (saved) applyAccentColor(saved);
    else document.getElementById('accentColorPicker').value = '#6d5ef5';
}

// ════════════════════════════════════════════════════════════
// Foldable headings
// ════════════════════════════════════════════════════════════
function applyFoldableHeadings(el) {
    const headings = [...el.querySelectorAll('h2, h3')];
    headings.forEach(h => {
        // Add arrow indicator
        const arrow = document.createElement('span');
        arrow.className = 'heading-fold-arrow';
        arrow.textContent = '▾';
        h.appendChild(arrow);

        // Collect all sibling elements until next same-or-higher heading
        const level = parseInt(h.tagName[1]);
        const section = [];
        let sib = h.nextElementSibling;
        while (sib) {
            const sibLevel = sib.tagName?.match(/^H([23])$/)?.[1];
            if (sibLevel && parseInt(sibLevel) <= level) break;
            section.push(sib);
            sib = sib.nextElementSibling;
        }

        if (!section.length) { arrow.style.display = 'none'; return; }

        // Wrap section siblings in a div
        const wrapper = document.createElement('div');
        wrapper.className = 'heading-section';
        h.after(wrapper);
        section.forEach(n => wrapper.appendChild(n));

        h.addEventListener('click', () => {
            const folded = wrapper.classList.toggle('folded');
            h.classList.toggle('heading-folded', folded);
        });
    });
}

// ════════════════════════════════════════════════════════════
// Search highlight helper
// ════════════════════════════════════════════════════════════
function getBacklinkExcerpt(content, linkedTitle) {
    // Find [[linkedTitle]] in content and return surrounding sentence
    const re = new RegExp(`\\[\\[${escapeRegex(linkedTitle)}(?:\\|[^\\]]+)?\\]\\]`, 'i');
    const m = re.exec(content);
    if (!m) return '';
    const start = Math.max(0, m.index - 60);
    const end   = Math.min(content.length, m.index + m[0].length + 60);
    let raw = (start > 0 ? '…' : '') + content.slice(start, end).replace(/\n/g, ' ') + (end < content.length ? '…' : '');
    // Highlight the wikilink text
    return escapeHtml(raw).replace(
        new RegExp(escapeRegex(escapeHtml(m[0])), 'gi'),
        `<mark class="sh">${escapeHtml(linkedTitle)}</mark>`
    );
}

function highlightMatch(text, query) {
    const escaped = escapeHtml(text);
    if (!query) return escaped;
    return escaped.replace(new RegExp(`(${escapeRegex(escapeHtml(query))})`, 'gi'), '<mark class="sh">$1</mark>');
}

function extractSnippet(content, query, contextBefore = 40, contextAfter = 90) {
    // Strip markdown syntax to get readable plain text
    const plain = content
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/`[^`]+`/g, ' ')
        .replace(/#{1,6}\s+/g, '')
        .replace(/[*_~]/g, '')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

    const idx = plain.toLowerCase().indexOf(query.toLowerCase());
    let raw;
    if (idx === -1) {
        raw = plain.slice(0, 120);
        return escapeHtml(raw) + (plain.length > 120 ? '…' : '');
    }

    const start = Math.max(0, idx - contextBefore);
    const end   = Math.min(plain.length, idx + query.length + contextAfter);
    raw = (start > 0 ? '…' : '') + plain.slice(start, end) + (end < plain.length ? '…' : '');

    const escaped = escapeHtml(raw);
    return escaped.replace(new RegExp(`(${escapeRegex(escapeHtml(query))})`, 'gi'), '<mark class="sh">$1</mark>');
}

async function showStatsModal() {

    // Gather data in parallel
    const [tagsRes, graphRes] = await Promise.all([
        apiCall('/tags').then(r => r.ok ? r.json() : []).catch(() => []),
        apiCall('/graph').then(r => r.ok ? r.json() : {nodes:[],edges:[]}).catch(() => ({nodes:[],edges:[]}))
    ]);

    const totalNotes = notes.length;
    const totalTags  = tagsRes.length || 0;
    const totalLinks = graphRes.edges?.length || 0;

    // Word count from cache
    let totalWords = 0;
    noteCache.forEach(n => { totalWords += getWordCount(n.content); });
    const avgWords = totalNotes ? Math.round(totalWords / totalNotes) : 0;

    // Most connected notes from graph
    const linkCount = {};
    (graphRes.edges || []).forEach(e => {
        const s = e.source?.id ?? e.source;

    // Top tags

    const overlay = document.createElement('div');

// ════════════════════════════════════════════════════════════
// Version history (localStorage-based)
// ════════════════════════════════════════════════════════════
const MAX_VERSIONS = 15;

function saveVersion(noteId, title, content) {
    const key = `synote_history_${noteId}`;
    const versions = JSON.parse(localStorage.getItem(key) || '[]');
    // Don't save if identical to last version
    if (versions[0]?.content === content && versions[0]?.title === title) return;
    versions.unshift({ ts: Date.now(), title, content });
    if (versions.length > MAX_VERSIONS) versions.splice(MAX_VERSIONS);
    localStorage.setItem(key, JSON.stringify(versions));
}

function getVersions(noteId) {
    return JSON.parse(localStorage.getItem(`synote_history_${noteId}`) || '[]');
}

let selectedVersionIdx = -1;

function toggleHistoryPanel() {
    const modal = document.getElementById('editorModal');
    if (!modal) return;
    const existing = modal.querySelector('.history-panel');
    if (existing) { existing.remove(); return; }

    const paneUid = modal.dataset.paneUid;
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;

    const versions = getVersions(pane.note.id);
    const panel = document.createElement('div');
    panel.className = 'history-panel';

    if (!versions.length) {
        panel.innerHTML = `
            <div class="history-header"><span>Version History</span><button class="btn-icon" onclick="this.closest('.history-panel').remove()">✕</button></div>
            <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No history yet.<br>Versions are saved automatically on each save.</div>`;
    } else {
        selectedVersionIdx = -1;
        panel.innerHTML = `
            <div class="history-header"><span>Version History</span><button class="btn-icon" onclick="this.closest('.history-panel').remove()">✕</button></div>
            <div class="history-list" id="historyList">
                ${versions.map((v,i) => `
                    <div class="history-item" data-idx="${i}" onclick="previewVersion(${i})">
                        <div class="history-item-time">${new Date(v.ts).toLocaleString()}</div>
                        <div class="history-item-preview">${escapeHtml(v.content.slice(0,60))}…</div>
                    </div>`).join('')}
            </div>
            <div class="history-actions">
                <button class="btn btn-primary" id="restoreBtn" onclick="restoreVersion()" disabled style="flex:1;">Restore</button>
                <button class="btn" onclick="this.closest('.history-panel').remove()">Cancel</button>
            </div>`;
    }

    modal.querySelector('.modal-body').appendChild(panel);
}

function previewVersion(idx) {
    selectedVersionIdx = idx;
    const modal = document.getElementById('editorModal');
    const paneUid = modal?.dataset.paneUid;
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;

    const versions = getVersions(pane.note.id);
    const v = versions[idx];
    if (!v) return;

    // Highlight selected
    modal.querySelectorAll('.history-item').forEach((el,i) => el.classList.toggle('selected', i===idx));

    // Show version content in editor (preview only)
    document.getElementById('modalContent').value = v.content;
    document.getElementById('modalTitle').value   = v.title;
    updateModalPreview();
    document.getElementById('restoreBtn').disabled = false;

    const status = document.getElementById('autosaveStatus');
    if (status) { status.textContent = `Viewing ${new Date(v.ts).toLocaleString()}`; status.className = 'autosave-status'; }
}

function restoreVersion() {
    // Content is already in the editor from preview — just close the panel
    document.querySelector('.history-panel')?.remove();
    showNotification('Version restored — save to confirm', 'info');
    const status = document.getElementById('autosaveStatus');
    if (status) { status.textContent = 'Unsaved changes'; status.className = 'autosave-status'; }
}
