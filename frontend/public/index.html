<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Synote</h1>
            <div class="sidebar-actions">
                <!-- READ-ONLY: button class="new-note-btn" onclick="createNewNote()">+ New Note</button -->
                <button class="graph-btn" onclick="showGraphView()">🕸️ Graph</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput"
                   placeholder="Search notes... (Ctrl+K)" oninput="handleSearch()">
            <!-- READ-ONLY: button class="search-clear" id="searchClear" onclick="clearSearch()">&times;</button -->
        </div>
        <div class="search-results-info" id="searchInfo" style="display: none;"></div>
        <div class="notes-list" id="notesList"></div>
    </div>

    <div class="editor-container" id="editorContainer">
        <div class="empty-state">
            <h2>Welcome to Synote</h2>
            <p>Create a new note to get started</p>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:8080/api' 
            : `${window.location.origin}/api`;
        let currentNote = null;
        let notes = [];
        let autoSaveTimeout = null;
        let searchTimeout = null;
        let isSearching = false;
        let authToken = localStorage.getItem('synote_token');
        let expandedCategories = new Set(); // Track which categories are expanded

        // Category definitions for auto-tagging based on title patterns
        const CATEGORY_PATTERNS = {
            'Medical': [/medical|health|cancer|hospital|patient|symptom|diagnosis|treatment/i, /ibu|bunga|mukaromah/i],
            'Allah\'s Medicines': [/allah.*medicine|tibb.*nabawi|honey|madu/i],
            'Herbal Medicine': [/herbal|jamu|temulawak|kencur|kunyit|jahe|lengkuas|temu.*kunci|kumis.*kucing|tempuyung|meniran|sambiloto|mahkota.*dewa|sirih|benalu/i],
            'Agriculture': [/agriculture|hydroponics|cultivation|vegetable|fruit|corn|beans|squash|eggplant|okra|root.*vegetable|strawberry|tomato|cucumber|pepper|watermelon/i],
            'Islamic Studies': [/islamic|quran|hadith|fiqh|kalam|sufi|sharia|ulama|scholar/i],
            'Research': [/research|study|analysis|meta.*synthesis|method|keloid|immunotherapy/i],
            'Science & Tech': [/science|technology|ai|quantum|biotech|crispr|dna|rna|microbiome/i]
        };

        // Extract tags from note content (YAML frontmatter)
        function extractTagsFromContent(content) {
            if (!content) return [];
            
            const tags = [];
            
            // Parse YAML frontmatter
            const frontmatterMatch = content.match(/^---\n([\s\S]*?)\n---/);
            if (frontmatterMatch) {
                const yaml = frontmatterMatch[1];
                
                // Look for tags: field
                const tagsMatch = yaml.match(/tags:\s*\n((?:\s+-\s*[^\n]+\n?)+)/);
                if (tagsMatch) {
                    const tagLines = tagsMatch[1].split('\n');
                    for (const line of tagLines) {
                        const tagMatch = line.match(/\s+-\s*(.+)/);
                        if (tagMatch) {
                            tags.push(tagMatch[1].trim());
                        }
                    }
                }
                
                // Also check for tags: [tag1, tag2] format
                const inlineTagsMatch = yaml.match(/tags:\s*\[([^\]]+)\]/);
                if (inlineTagsMatch) {
                    const inlineTags = inlineTagsMatch[1].split(',').map(t => t.trim().replace(/['"]/g, ''));
                    tags.push(...inlineTags);
                }
            }
            
            return tags;
        }

        // Auto-categorize note based on title and content
        function getNoteCategory(note) {
            const title = note.title || '';
            const content = note.content || '';
            const tags = extractTagsFromContent(content);
            
            // First check explicit tags
            for (const tag of tags) {
                const lowerTag = tag.toLowerCase();
                if (lowerTag.includes('medical') || lowerTag.includes('health')) return 'Medical';
                if (lowerTag.includes('allah') || lowerTag.includes('tibb')) return 'Allah\'s Medicines';
                if (lowerTag.includes('herbal') || lowerTag.includes('jamu')) return 'Herbal Medicine';
                if (lowerTag.includes('agriculture') || lowerTag.includes('farm')) return 'Agriculture';
                if (lowerTag.includes('islamic') || lowerTag.includes('quran')) return 'Islamic Studies';
                if (lowerTag.includes('research')) return 'Research';
            }
            
            // Then check title patterns
            for (const [category, patterns] of Object.entries(CATEGORY_PATTERNS)) {
                for (const pattern of patterns) {
                    if (pattern.test(title)) {
                        return category;
                    }
                }
            }
            
            // Check content patterns if no title match
            for (const [category, patterns] of Object.entries(CATEGORY_PATTERNS)) {
                for (const pattern of patterns) {
                    if (pattern.test(content.substring(0, 500))) {
                        return category;
                    }
                }
            }
            
            return 'Uncategorized';
        }

        // Toggle category expansion
        function toggleCategory(category) {
            if (expandedCategories.has(category)) {
                expandedCategories.delete(category);
            } else {
                expandedCategories.add(category);
            }
            renderNotesList();
        }

        // API helper with auth
        async function apiCall(endpoint, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }

            const response = await fetch(`${API_URL}${endpoint}`, {
                ...options,
                headers
            });

            if (response.status === 401) {
                // Auth required - show login
                showLoginModal();
                throw new Error('Authentication required');
            }

            return response;
        }

        function showLoginModal() {
            // Check if modal already exists
            if (document.getElementById('loginModal')) return;

            const modal = document.createElement('div');
            modal.id = 'loginModal';
            modal.innerHTML = `
                <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000;">
                    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 400px; max-width: 90%;">
                        <h2 style="margin-bottom: 20px; font-size: 20px;">Authentication Required</h2>
                        <p style="margin-bottom: 20px; color: #666; font-size: 14px;">Please enter your Synote access token to continue.</p>
                        <input type="password" id="tokenInput" placeholder="Enter token..." style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 14px;">
                        <div style="display: flex; gap: 10px;">
                            <!-- READ-ONLY: button onclick="submitToken()" style="flex: 1; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">Login</button -->
                            <!-- READ-ONLY: button onclick="closeLoginModal()" style="flex: 1; padding: 12px; background: #e0e0e0; color: #333; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">Cancel</button -->
                        </div>
                        <p id="loginError" style="margin-top: 15px; color: #dc3545; font-size: 14px; display: none;"></p>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            // Focus input and handle Enter key
            document.getElementById('tokenInput').focus();
            document.getElementById('tokenInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitToken();
            });
        }

        function closeLoginModal() {
            const modal = document.getElementById('loginModal');
            if (modal) modal.remove();
        }

        async function submitToken() {
            const input = document.getElementById('tokenInput');
            const errorDisplay = document.getElementById('loginError');
            const token = input.value.trim();

            if (!token) {
                errorDisplay.textContent = 'Please enter a token';
                errorDisplay.style.display = 'block';
                return;
            }

            // Test the token with a health check
            try {
                const response = await fetch(`${API_URL}/health`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    authToken = token;
                    localStorage.setItem('synote_token', token);
                    closeLoginModal();
                    showNotification('Logged in successfully!', 'success');
                    loadNotes(); // Reload with auth
                } else {
                    errorDisplay.textContent = 'Invalid token. Please try again.';
                    errorDisplay.style.display = 'block';
                }
            } catch (err) {
                errorDisplay.textContent = 'Connection failed. Check server status.';
                errorDisplay.style.display = 'block';
            }
        }

        function logout() {
            authToken = null;
            localStorage.removeItem('synote_token');
            notes = [];
            currentNote = null;
            renderNotesList();
            document.getElementById('editorContainer').innerHTML = `
                <div class="empty-state">
                    <h2>Logged out</h2>
                    <p>Refresh the page to log in again</p>
                </div>
            `;
            showNotification('Logged out', 'info');
        }

        async function loadNotes() {
            try {
                const response = await apiCall('/notes');
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        showLoginModal();
                        return;
                    }
                    throw new Error('Failed to load notes: ' + response.status);
                }
                notes = await response.json();
                renderNotesList();
            } catch (error) {
                console.error('Failed to load notes:', error);
                showLoginModal();
            }
        }

        function renderNotesList() {
            const notesList = document.getElementById('notesList');
            const searchInfo = document.getElementById('searchInfo');

            if (notes.length === 0 && isSearching) {
                notesList.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No notes found</div>';
                return;
            }

            // Group notes by category
            const notesByCategory = {};
            for (const note of notes) {
                const category = getNoteCategory(note);
                if (!notesByCategory[category]) {
                    notesByCategory[category] = [];
                }
                notesByCategory[category].push(note);
            }

            // Sort categories: Uncategorized last, others alphabetically
            const sortedCategories = Object.keys(notesByCategory).sort((a, b) => {
                if (a === 'Uncategorized') return 1;
                if (b === 'Uncategorized') return -1;
                return a.localeCompare(b);
            });

            // Build HTML with categories
            let html = '';
            for (const category of sortedCategories) {
                const categoryNotes = notesByCategory[category];
                const isExpanded = expandedCategories.has(category) || isSearching;
                const count = categoryNotes.length;

                html += `
                    <div class="category-section">
                        <div class="category-header ${isExpanded ? 'expanded' : ''}" onclick="toggleCategory('${category.replace(/'/g, "\\'")}')">
                            <span class="category-toggle ${isExpanded ? 'expanded' : ''}">▶</span>
                            <span>${escapeHtml(category)}</span>
                            <span class="category-count">${count}</span>
                        </div>
                        <div class="category-notes ${isExpanded ? 'expanded' : ''}" onclick="event.stopPropagation()">
                            ${categoryNotes.map(note => `
                                <div class="note-item ${currentNote?.id === note.id ? 'active' : ''}" onclick="event.stopPropagation(); loadNote('${note.id}')">
                                    <div class="note-item-title">${escapeHtml(note.title || 'Untitled')}</div>
                                    <div class="note-item-date">${new Date(note.updated_at).toLocaleDateString()}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            notesList.innerHTML = html;

            // Update search info
            if (isSearching) {
                searchInfo.style.display = 'block';
                searchInfo.textContent = `Found ${notes.length} note${notes.length !== 1 ? 's' : ''}`;
            } else {
                searchInfo.style.display = 'none';
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function handleSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            const query = searchInput.value.trim();

            // Show/hide clear button
            if (searchInput.value) {
                searchClear.classList.add('visible');
            } else {
                searchClear.classList.remove('visible');
            }

            // Clear previous timeout
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }

            // Debounce search
            searchTimeout = setTimeout(async () => {
                if (query === '') {
                    isSearching = false;
                    await loadNotes();
                } else {
                    isSearching = true;
                    await performSearch(query);
                }
            }, 300);
        }

        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            searchInput.value = '';
            searchClear.classList.remove('visible');
            isSearching = false;
            loadNotes();
        }

        async function performSearch(query) {
            try {
                const response = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
                notes = await response.json();
                renderNotesList();
            } catch (error) {
                console.error('Search failed:', error);
                showNotification('Search failed', 'error');
            }
        }

                // Update backlinks display
        async function updateBacklinks(content) {
            const backlinksDisplay = document.getElementById('backlinksDisplay');
            if (!backlinksDisplay) return;
            
            // Extract wikilinks from content
            const wikilinkRegex = /\[\[([^\]]+)\]\]/g;
            const links = [];
            let match;
            while ((match = wikilinkRegex.exec(content)) !== null) {
                links.push(match[1]);
            }
            
            if (links.length === 0) {
                backlinksDisplay.innerHTML = '';
                return;
            }
            
            backlinksDisplay.innerHTML = '<div style="color: #666; font-size: 12px; margin-bottom: 5px;">Links to:</div>' + 
                links.map(link => `<div class="backlink-tag">${escapeHtml(link)}</div>`).join('');
        }

        async function loadNote(id) {
            console.log('Loading note:', id);
            try {
                const response = await apiCall(`/notes/${id}`);
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        showLoginModal();
                        return;
                    }
                    throw new Error('Failed to load note: ' + response.status);
                }
                currentNote = await response.json();
                currentNoteId = currentNote.id;
                renderEditor();
                renderNotesList();
                updateBacklinks(currentNote.content || '');
            } catch (error) {
                console.error('Failed to load note:', error);
                alert('Failed to load note: ' + error.message);
            }
        }

        function renderEditor() {
            const container = document.getElementById('editorContainer');
            container.innerHTML = `
                <div class="editor-header">
                    <div class="editor-actions">
                        <!-- READ-ONLY: button class="btn" onclick="saveNote()">Save</button -->
                        <!-- READ-ONLY: button class="btn btn-danger" onclick="deleteNote()">Delete</button -->
                        <!-- READ-ONLY: button class="btn" onclick="downloadNote()">Download</button -->
                    </div>
                </div>
                <div class="editor-content">
                    <input type="text" class="editor-title" id="noteTitle"
                           value="${escapeHtml(currentNote.title)}"
                           placeholder="Note title"
                           oninput="updatePreview()">
                    <div class="tags-display" id="tagsDisplay"></div>
                    <div class="editor-with-sidebar">
                        <div class="editor-split">
                            <div class="editor-pane">
                                <div class="editor-pane-header">Markdown</div>
                                <textarea class="editor-body" id="noteContent"
                                          placeholder="Write your note in markdown..."
                                          oninput="updatePreview()">${escapeHtml(currentNote.content)}</textarea>
                            </div>
                            <div class="preview-pane">
                                <div class="editor-pane-header">Preview</div>
                                <div class="preview-content" id="previewContent"></div>
                            </div>
                        </div>
                        <div class="backlinks-sidebar" id="backlinksSidebar">
                            <div class="backlinks-header">Linked References</div>
                            <div class="backlinks-content" id="backlinksContent">
                                <div class="loading">Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            updatePreview();
            loadAndRenderBacklinks(currentNote.id);
        }

        async function loadAndRenderBacklinks(noteId) {
            const linksData = await loadBacklinks(noteId);
            renderBacklinks(linksData);
        }

        function renderBacklinks(linksData) {
            const container = document.getElementById('backlinksContent');
            if (!container) return;

            if (!linksData || (!linksData.outgoing?.length && !linksData.incoming?.length)) {
                container.innerHTML = '<div class="no-backlinks">No links to or from this note</div>';
                return;
            }

            let html = '';
            
            // Incoming links (backlinks) - most important
            if (linksData.incoming?.length > 0) {
                html += '<div class="backlinks-section"><div class="backlinks-section-title">Links to this note</div>';
                html += linksData.incoming.map(link => `
                    <div class="backlink-item" onclick="loadNote('${link.target_id}')">
                        <div class="backlink-title">${escapeHtml(link.display_text)}</div>
                    </div>
                `).join('');
                html += '</div>';
            }

            // Outgoing links
            if (linksData.outgoing?.length > 0) {
                html += '<div class="backlinks-section"><div class="backlinks-section-title">Links from this note</div>';
                html += linksData.outgoing.map(link => {
                    if (link.exists) {
                        return `<div class="backlink-item ${link.target_id ? '' : 'broken'}" onclick="${link.target_id ? `loadNote('${link.target_id}')` : `createNoteFromLink('${link.target_title.replace(/'/g, "\\'")}')`}">
                            <div class="backlink-title">${escapeHtml(link.display_text)}</div>
                        </div>`;
                    } else {
                        return `<div class="backlink-item broken" onclick="createNoteFromLink('${link.target_title.replace(/'/g, "\\'")}')">
                            <div class="backlink-title">${escapeHtml(link.display_text)} <span class="create-note">+</span></div>
                        </div>`;
                    }
                }).join('');
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Parse wikilinks [[...]] and return metadata
        function parseWikilinks(text) {
            const wikilinkRegex = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
            const links = [];
            let match;
            while ((match = wikilinkRegex.exec(text)) !== null) {
                const fullTarget = match[1].trim();
                const alias = match[2]?.trim();
                
                // Split target and heading
                const hashIndex = fullTarget.indexOf('#');
                const targetTitle = hashIndex >= 0 ? fullTarget.substring(0, hashIndex).trim() : fullTarget;
                const heading = hashIndex >= 0 ? fullTarget.substring(hashIndex + 1).trim() : null;
                
                links.push({
                    fullMatch: match[0],
                    targetTitle,
                    displayText: alias || targetTitle,
                    heading,
                    start: match.index,
                    end: match.index + match[0].length
                });
            }
            return links;
        }

        // Find note by title (case-insensitive)
        function findNoteByTitle(title) {
            return notes.find(n => n.title.toLowerCase() === title.toLowerCase());
        }

        // Render wikilinks as clickable links
        function renderWikilinks(content) {
            const links = parseWikilinks(content);
            let result = content;
            
            // Replace from end to start to preserve indices
            for (let i = links.length - 1; i >= 0; i--) {
                const link = links[i];
                const targetNote = findNoteByTitle(link.targetTitle);
                
                if (targetNote) {
                    // Existing note - link to it
                    const replacement = `<a href="#" onclick="loadNote('${targetNote.id}'); return false;" class="wikilink">${link.displayText}</a>`;
                    result = result.substring(0, link.start) + replacement + result.substring(link.end);
                } else {
                    // Broken link - offer to create
                    const replacement = `<a href="#" onclick="createNoteFromLink('${link.targetTitle.replace(/'/g, "\\'")}'); return false;" class="wikilink broken" title="Click to create note">${link.displayText}</a>`;
                    result = result.substring(0, link.start) + replacement + result.substring(link.end);
                }
            }
            
            return result;
        }

        // Create new note from wikilink click
        async function createNoteFromLink(title) {
            try {
                const response = await apiCall('/notes', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: title,
                        content: ''
                    })
                });
                const newNote = await response.json();
                notes.push(newNote);
                await loadNotes();
                loadNote(newNote.id);
                showNotification(`Created note: ${title}`, 'success');
            } catch (error) {
                console.error('Failed to create note:', error);
                showNotification('Failed to create note', 'error');
            }
        }

        // Extract tags from content
        function extractTags(content) {
            // Match #tag but not hex colors (#fff, #123456)
            const tagRegex = /(?<![a-zA-Z0-9])#([a-zA-Z0-9_\-/]+)/g;
            const hexColorRegex = /^#[a-fA-F0-9]{6}$|^#[a-fA-F0-9]{3}$/;
            const tags = new Set();
            
            let match;
            while ((match = tagRegex.exec(content)) !== null) {
                const tag = match[1].toLowerCase();
                // Skip hex colors
                if (!hexColorRegex.test('#' + tag)) {
                    tags.add(tag);
                }
            }
            
            return Array.from(tags);
        }

        // Load and display backlinks
        async function loadBacklinks(noteId) {
            try {
                const response = await apiCall(`/notes/${noteId}/links`);
                if (!response.ok) return null;
                return await response.json();
            } catch (error) {
                console.error('Failed to load backlinks:', error);
                return null;
            }
        }

        function updatePreview() {
            const content = document.getElementById('noteContent')?.value || '';
            const previewElement = document.getElementById('previewContent');

            if (!previewElement) return;

            // Configure marked for GitHub Flavored Markdown
            marked.setOptions({
                breaks: true,
                gfm: true,
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (e) {
                            console.error('Highlight error:', e);
                        }
                    }
                    return hljs.highlightAuto(code).value;
                }
            });

            // Render markdown
            let html = marked.parse(content);
            
            // Render wikilinks
            html = renderWikilinks(html);
            
            previewElement.innerHTML = html;

            // Update tags display
            updateTagsDisplay(content);

            // Trigger auto-save
            scheduleAutoSave();
        }

        function updateTagsDisplay(content) {
            const tagsContainer = document.getElementById('tagsDisplay');
            if (!tagsContainer) return;
            
            const tags = extractTags(content);
            if (tags.length === 0) {
                tagsContainer.innerHTML = '';
                return;
            }
            
            tagsContainer.innerHTML = tags.map(tag => 
                `<span class="tag" onclick="filterByTag('${tag.replace(/'/g, "\\'")}')">#${tag}</span>`
            ).join(' ');
        }

        async function filterByTag(tag) {
            isSearching = true;
            try {
                const response = await apiCall(`/tags/${encodeURIComponent(tag)}/notes`);
                notes = await response.json();
                renderNotesList();
                showNotification(`Showing notes with #${tag}`, 'info');
            } catch (error) {
                console.error('Failed to filter by tag:', error);
                showNotification('Failed to filter', 'error');
            }
        }

        function scheduleAutoSave() {
            if (autoSaveTimeout) {
                clearTimeout(autoSaveTimeout);
            }
            autoSaveTimeout = setTimeout(() => {
                saveNote(true); // Auto-save silently
            }, 2000); // Save after 2 seconds of inactivity
        }

        async function createNewNote() {
            try {
                const response = await fetch(`${API_URL}/notes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: 'Untitled Note',
                        content: ''
                    })
                });
                currentNote = await response.json();
                await loadNotes();
                renderEditor();
            } catch (error) {
                console.error('Failed to create note:', error);
            }
        }

        async function saveNote(silent = false) {
            if (!currentNote) return;

            const title = document.getElementById('noteTitle')?.value || currentNote.title;
            const content = document.getElementById('noteContent')?.value || currentNote.content;

            try {
                const response = await fetch(`${API_URL}/notes/${currentNote.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                currentNote = await response.json();
                await loadNotes();

                if (!silent) {
                    showNotification('Note saved!', 'success');
                }
            } catch (error) {
                console.error('Failed to save note:', error);
                if (!silent) {
                    showNotification('Failed to save note', 'error');
                }
            }
        }

        function showNotification(message, type = 'info') {
            // Simple notification - can be improved later
            const existingNotif = document.querySelector('.notification');
            if (existingNotif) existingNotif.remove();

            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = message;
            notif.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 24px;
                background: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#007bff'};
                color: white;
                border-radius: 4px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;

            document.body.appendChild(notif);

            setTimeout(() => {
                notif.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notif.remove(), 300);
            }, 2000);
        }

        async function deleteNote() {
            if (!currentNote) return;
            if (!confirm('Are you sure you want to delete this note?')) return;

            try {
                await fetch(`${API_URL}/notes/${currentNote.id}`, {
                    method: 'DELETE'
                });
                currentNote = null;
                await loadNotes();
                document.getElementById('editorContainer').innerHTML = `
                    <div class="empty-state">
                        <h2>Note deleted</h2>
                        <p>Create a new note to get started</p>
                    </div>
                `;
            } catch (error) {
                console.error('Failed to delete note:', error);
                alert('Failed to delete note');
            }
        }

        // Load notes on page load
        loadNotes();

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Cmd+S or Ctrl+S to save
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                saveNote();
            }

            // Cmd+K or Ctrl+K to focus search
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }

            // Escape to clear search
            if (e.key === 'Escape' && document.activeElement.id === 'searchInput') {
                clearSearch();
                document.getElementById('searchInput').blur();
            }
        });

        // ==================== GRAPH VISUALIZATION ====================
        
        let graphSimulation = null;

        async function showGraphView() {
            const container = document.getElementById('editorContainer');
            container.innerHTML = `
                <div class="graph-container">
                    <div class="graph-header">
                        <h2>🕸️ Note Graph</h2>
                        <!-- READ-ONLY: button class="btn" onclick="closeGraphView()">Close</button -->
                    </div>
                    <svg class="graph-canvas" id="graphCanvas"></svg>
                </div>
            `;
            
            await loadAndRenderGraph();
        }

        function closeGraphView() {
            document.getElementById('editorContainer').innerHTML = `
                <div class="empty-state">
                    <h2>Synote</h2>
                    <p>Create a new note to get started</p>
                </div>
            `;
            currentNote = null;
        }

        async function loadAndRenderGraph() {
            try {
                const response = await apiCall('/graph');
                if (!response.ok) {
                    showNotification('Failed to load graph data', 'error');
                    return;
                }
                
                let data; try { data = await response.json(); } catch (e) { data = { error: "Unauthorized", message: "Please login" }; }
                if (data.nodes.length === 0) {
                    document.getElementById('graphCanvas').innerHTML = `
                        <text x="50%" y="50%" text-anchor="middle" fill="#666" font-size="14">
                            No notes yet. Create some notes with [[links]] to see connections!
                        </text>
                    `;
                    return;
                }
                
                renderForceGraph(data);
            } catch (error) {
                console.error('Failed to load graph:', error);
                showNotification('Failed to load graph', 'error');
            }
        }

        function renderForceGraph(data) {
            const svg = d3.select('#graphCanvas');
            const width = svg.node().parentElement.clientWidth;
            const height = svg.node().parentElement.clientHeight;
            
            svg.attr('viewBox', `0 0 ${width} ${height}`)
               .attr('width', width)
               .attr('height', height);
            
            // Clear previous
            svg.selectAll('*').remove();
            
            // Add zoom behavior
            const g = svg.append('g');
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => g.attr('transform', event.transform));
            svg.call(zoom);
            
            // Simulation
            const simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.edges).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => d.size + 10));
            
            graphSimulation = simulation;
            
            // Links
            const link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(data.edges)
                .enter().append('line')
                .attr('class', 'graph-link');
            
            // Nodes
            const node = g.append('g')
                .attr('class', 'nodes')
                .selectAll('g')
                .data(data.nodes)
                .enter().append('g')
                .attr('class', 'graph-node')
                .call(d3.drag()
                    .on('start', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    })
                    .on('drag', (event, d) => {
                        d.fx = event.x;
                        d.fy = event.y;
                    })
                    .on('end', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    }))
                .on('click', (event, d) => {
                    event.stopPropagation();
                    loadNote(d.id);
                });
            
            // Node circles
            node.append('circle')
                .attr('r', d => d.size || 8)
                .attr('fill', '#007bff')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            // Node labels
            node.append('text')
                .attr('dy', d => (d.size || 8) + 15)
                .attr('text-anchor', 'middle')
                .text(d => d.title && d.title.length > 20 ? d.title.substring(0, 20) + '...' : d.title)
                .attr('font-size', '11px')
                .attr('fill', '#333');
            
            // Update positions on tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }
    </script>
