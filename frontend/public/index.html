    const allPanes = document.querySelectorAll('.note-pane');
    allPanes.forEach(el => {
        if (el.id !== `pane-${paneUid}`) el.style.display = 'none';
    });
    document.getElementById(`export-${paneUid}`)?.classList.remove('open');
    window.print();
    allPanes.forEach(el => el.style.display = '');
}

// ════════════════════════════════════════════════════════════
// Command Palette
// ════════════════════════════════════════════════════════════
let cmdSelectedIdx = 0;
let cmdFilteredNotes = [];

function showCommandPalette() {
    if (document.getElementById('cmdOverlay')) return;
    const overlay = document.createElement('div');
    overlay.id = 'cmdOverlay';
    overlay.className = 'cmd-overlay';
    overlay.innerHTML = `
        <div class="cmd-palette">
            <div class="cmd-input-wrap">
                <span class="cmd-icon">⌘</span>
                <input class="cmd-input" id="cmdInput" placeholder="Search notes…" autocomplete="off">
            </div>
            <div class="cmd-results" id="cmdResults"></div>
            <div class="cmd-footer">
                <span class="cmd-hint"><kbd class="cmd-key">↑↓</kbd> Navigate</span>
                <span class="cmd-hint"><kbd class="cmd-key">↵</kbd> Open</span>
                <span class="cmd-hint"><kbd class="cmd-key">Esc</kbd> Close</span>
            </div>
        </div>`;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', e => { if (e.target === overlay) closeCommandPalette(); });
    const input = document.getElementById('cmdInput');
    input.focus();
    input.addEventListener('input', updateCmdResults);
    input.addEventListener('keydown', handleCmdKey);
    cmdSelectedIdx = 0;
    updateCmdResults();
}

function closeCommandPalette() {
    document.getElementById('cmdOverlay')?.remove();
}

function updateCmdResults() {
    const q = document.getElementById('cmdInput')?.value.toLowerCase() || '';
    if (q) {
        cmdFilteredNotes = notes.filter(n => n.title.toLowerCase().includes(q));
    } else {
        // Recent notes first, then rest sorted
        const recentIds = recentlyViewed.map(r => r.id);
        const recentNotes = recentIds.map(id => notes.find(n => n.id === id)).filter(Boolean);
        const others = getSortedNotes(notes).filter(n => !recentIds.includes(n.id));
        cmdFilteredNotes = [...recentNotes, ...others].slice(0, 14);
    }
    cmdSelectedIdx = Math.min(cmdSelectedIdx, Math.max(0, cmdFilteredNotes.length - 1));
    renderCmdResults();
}

function renderCmdResults() {
    const el = document.getElementById('cmdResults');
    if (!el) return;
    if (cmdFilteredNotes.length === 0) {
        el.innerHTML = '<div class="cmd-empty">No notes found</div>';
        return;
    }
    el.innerHTML = cmdFilteredNotes.map((n, i) => `
        <div class="cmd-item ${i === cmdSelectedIdx ? 'selected' : ''}" onclick="selectCmdItem(${i})">
            <span class="cmd-item-icon">📄</span>
            <span class="cmd-item-title">${escapeHtml(n.title)}</span>
            <span class="cmd-item-date">${new Date(n.updated_at).toLocaleDateString()}</span>
        </div>`
    ).join('');
}

function selectCmdItem(idx) {
    const note = cmdFilteredNotes[idx];
    if (note) { loadNote(note.id); closeCommandPalette(); }
}

function handleCmdKey(e) {
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        cmdSelectedIdx = Math.min(cmdSelectedIdx + 1, cmdFilteredNotes.length - 1);
        renderCmdResults();
        document.querySelectorAll('.cmd-item')[cmdSelectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        cmdSelectedIdx = Math.max(cmdSelectedIdx - 1, 0);
        renderCmdResults();
        document.querySelectorAll('.cmd-item')[cmdSelectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
        selectCmdItem(cmdSelectedIdx);
    } else if (e.key === 'Escape') {
        closeCommandPalette();
    }
}

// Graph View
// ════════════════════════════════════════════════════════════
let graphSimulation = null;

async function showGraphView() {
    const container = document.getElementById('panesContainer');
    container.innerHTML = `
        <div class="graph-container">
            <div class="graph-header">
                <h2>⬡ Note Graph</h2>
                <button class="btn" onclick="closeGraphView()">← Back</button>
            </div>
            <svg class="graph-canvas" id="graphCanvas"></svg>
        </div>`;
    try {
        const res = await apiCall('/graph');
        if (!res.ok) { showNotification('Failed to load graph', 'error'); return; }
        let data;
        try { data = await res.json(); } catch { data = { nodes: [], edges: [] }; }
        if (!data.nodes?.length) {
            document.getElementById('graphCanvas').innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="Inter,sans-serif">No notes yet. Create notes with [[links]] to see the graph!</text>`;
            return;
        }
        renderForceGraph(data);
    } catch { showNotification('Failed to load graph', 'error'); }
}

function closeGraphView() {
    openPanes = []; currentNote = null;
    renderPanes(); renderNotesList();
}

function renderForceGraph(data) {
    const svg = d3.select('#graphCanvas');
    const width = svg.node().parentElement.clientWidth;
    const height = svg.node().parentElement.clientHeight;
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('width', width).attr('height', height);
    svg.selectAll('*').remove();
    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.1,4]).on('zoom', e => g.attr('transform', e.transform)));
    const sim = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.edges).id(d=>d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-280))
        .force('center', d3.forceCenter(width/2, height/2))
        .force('collision', d3.forceCollide().radius(d=>(d.size||8)+10));
    graphSimulation = sim;
    const link = g.append('g').selectAll('line').data(data.edges).enter().append('line').attr('class','graph-link');
    const node = g.append('g').selectAll('g').data(data.nodes).enter().append('g').attr('class','graph-node')
        .call(d3.drag()
            .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
            .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
            .on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
        .on('click',(e,d)=>{ e.stopPropagation(); loadNote(d.id); });
    node.append('circle').attr('r',d=>d.size||8).attr('fill','#6d5ef5').attr('stroke','rgba(255,255,255,0.2)').attr('stroke-width',2);
    node.append('text').attr('dy',d=>(d.size||8)+14).attr('text-anchor','middle')
        .text(d=>d.title?.length>22?d.title.slice(0,22)+'…':d.title)
        .attr('font-size','11px').attr('fill','rgba(255,255,255,0.7)').attr('font-family','Inter,sans-serif');
    sim.on('tick',()=>{
        link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

// ════════════════════════════════════════════════════════════
// Keyboard shortcuts
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
    const inInput = ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)
        || document.activeElement?.contentEditable === 'true';

    // Cmd/Ctrl+K → command palette
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('cmdOverlay') ? closeCommandPalette() : showCommandPalette();
    }
    // Cmd+S → save if modal open
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        if (document.getElementById('editorModal')) saveFromModal();
    }
    // Cmd+D → toggle dark mode
    if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
        e.preventDefault();
        toggleDarkMode();
    }
    // Cmd+. → toggle zen mode
    if ((e.metaKey || e.ctrlKey) && e.key === '.') {
        e.preventDefault();
        toggleZenMode();
    }
    // ? → shortcuts cheatsheet (not in input)
    if (e.key === '?' && !inInput) {
        e.preventDefault();
        document.getElementById('shortcutsOverlay') ? document.getElementById('shortcutsOverlay').remove() : showShortcutsModal();
    }
    // Esc → close topmost overlay
    if (e.key === 'Escape') {
        if (document.getElementById('shortcutsOverlay')) { document.getElementById('shortcutsOverlay').remove(); return; }
        if (document.getElementById('cmdOverlay')) { closeCommandPalette(); return; }
        if (document.getElementById('editorModal')) { closeEditorModal(); return; }
        if (zenMode) { toggleZenMode(); return; }
        // Close any open export menus
        document.querySelectorAll('.export-wrap.open').forEach(el => el.classList.remove('open'));
    }
});

// ════════════════════════════════════════════════════════════

// Generic horizontal drag resize between two elements
function makeResizable(handle, getLeft, getRight, minLeft = 200, minRight = 200) {
    handle.addEventListener('mousedown', e => {
        e.preventDefault();
        const leftEl  = getLeft();
        const rightEl = getRight();
        if (!leftEl || !rightEl) return;

        const startX      = e.clientX;
        const leftStart   = leftEl.getBoundingClientRect().width;
        const totalWidth  = leftEl.parentElement.getBoundingClientRect().width;
        const maxLeft     = totalWidth - minRight;

        // Right pane becomes fluid so its LEFT edge tracks the handle
        rightEl.style.flex = '1 1 0';

        handle.classList.add('dragging');
        document.body.classList.add('resizing');

        const onMove = e => {
            const dx      = e.clientX - startX;
            const newLeft = Math.max(minLeft, Math.min(maxLeft, leftStart + dx));
            leftEl.style.flex = `0 0 ${newLeft}px`;
        };

        const onUp = () => {
            handle.classList.remove('dragging');
            document.body.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });

    // Touch support
    handle.addEventListener('touchstart', e => {
        e.preventDefault();
        const leftEl  = getLeft();
        const rightEl = getRight();
        if (!leftEl || !rightEl) return;

        const startX     = e.touches[0].clientX;
        const leftStart  = leftEl.getBoundingClientRect().width;
        const totalWidth = leftEl.parentElement.getBoundingClientRect().width;
        const maxLeft    = totalWidth - minRight;

        handle.classList.add('dragging');
        rightEl.style.flex = '1 1 0';

        const onMove = e => {
            const dx      = e.touches[0].clientX - startX;
            const newLeft = Math.max(minLeft, Math.min(maxLeft, leftStart + dx));
            leftEl.style.flex = `0 0 ${newLeft}px`;
        };

        const onEnd = () => {
            handle.classList.remove('dragging');
            handle.removeEventListener('touchmove', onMove);
            handle.removeEventListener('touchend', onEnd);
        };

        handle.addEventListener('touchmove', onMove, { passive: false });
        handle.addEventListener('touchend', onEnd);
    }, { passive: false });
}

// Insert resize handles between all open panes
function addPaneResizeHandles() {
    const container = document.getElementById('panesContainer');
    if (!container) return;

    // Always purge stale handles first to prevent duplicates
    container.querySelectorAll('.pane-resize-handle').forEach(h => h.remove());

    const panes = [...container.querySelectorAll('.note-pane')];
    panes.forEach((pane, i) => {
        if (i === panes.length - 1) return;
        const handle = document.createElement('div');
        handle.className = 'pane-resize-handle';
        pane.after(handle);

        // Skip over any non-pane siblings (other handles etc.)
        const leftPane  = () => {
            let el = handle.previousElementSibling;
            while (el && !el.classList.contains('note-pane')) el = el.previousElementSibling;
            return el;
        };
        const rightPane = () => {
            let el = handle.nextElementSibling;
            while (el && !el.classList.contains('note-pane')) el = el.nextElementSibling;
            return el;
        };

        makeResizable(handle, leftPane, rightPane, 280, 280);
    });
}

// Add resize handle inside the editor modal split
function addEditorResizeHandle() {
    const editorPane  = document.querySelector('#editorModal .editor-pane');
    const previewPane = document.querySelector('#editorModal .preview-pane');
    const split       = document.querySelector('#editorModal .editor-split');
    if (!editorPane || !previewPane || !split) return;

    const handle = document.createElement('div');
    handle.className = 'editor-resize-handle';
    editorPane.after(handle);
    makeResizable(handle, () => editorPane, () => previewPane, 180, 180);
}

    if (!sidebar || !handle) return;

        () => sidebar,
        () => document.getElementById('panesContainer'),
        180, 320
    );
}

// Stars / pinned notes
// ════════════════════════════════════════════════════════════
function toggleStar(noteId, e) {
    if (e) e.stopPropagation();
    if (starredNotes.has(noteId)) {
        starredNotes.delete(noteId);
    } else {
        starredNotes.add(noteId);
    }
    localStorage.setItem('synote_starred', JSON.stringify([...starredNotes]));
    // Update star buttons across all open panes for this note
    openPanes.forEach(p => {
        if (p.note.id !== noteId) return;
        const btn = document.querySelector(`#pane-${p.uid} .star-btn`);
        if (btn) {
            const s = starredNotes.has(noteId);
            btn.classList.toggle('starred', s);
            btn.title = s ? 'Unstar' : 'Star note';
            btn.textContent = s ? '⭐' : '☆';
        }
    });
    renderNotesList();
}

// ════════════════════════════════════════════════════════════
// Word count
// ════════════════════════════════════════════════════════════
function getWordCount(content) {
    return (content || '')
        .replace(/```[\s\S]*?```/g, '')   // strip code blocks
        .replace(/`[^`]*`/g, '')           // strip inline code
        .replace(/[#*_~\[\]>]/g, '')       // strip markdown syntax
        .trim().split(/\s+/).filter(Boolean).length;
}

// ════════════════════════════════════════════════════════════
// Inline rename
// ════════════════════════════════════════════════════════════
function startRenameInPane(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const el = document.querySelector(`#pane-${paneUid} .pane-title-label`);
    if (!el || el.contentEditable === 'true') return;

    const original = pane.note.title;
    el.contentEditable = 'true';
    el.style.cssText += ';background:var(--accent-light);border-radius:3px;padding:1px 5px;outline:1px solid var(--accent);';
    el.focus();

    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);

    const finish = async () => {
        if (el.contentEditable !== 'true') return;
        el.contentEditable = 'false';
        el.style.background = '';
        el.style.outline = '';
        el.style.padding = '';
        el.style.borderRadius = '';
        const newTitle = el.textContent.trim();
        if (!newTitle || newTitle === original) { el.textContent = original; return; }
        try {
            const res = await apiCall(`/notes/${pane.note.id}`, {
                method: 'PUT',
                body: JSON.stringify({ title: newTitle, content: pane.note.content })
            });
            const updated = await res.json();
            noteCache.set(updated.id, updated);
            pane.note = updated;
            currentNote = updated;
            await loadNotes();
            renderPaneContent(pane);
            showNotification('Renamed!', 'success');
        } catch {
            el.textContent = original;
            showNotification('Rename failed', 'error');
        }
    };

    el.onblur = finish;
    el.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') { el.textContent = original; el.contentEditable = 'false'; el.onblur = null; el.style.cssText = ''; }
    };
}

// ════════════════════════════════════════════════════════════
// Zen / focus mode
// ════════════════════════════════════════════════════════════
function toggleZenMode() {
    zenMode = !zenMode;
    document.body.classList.toggle('zen', zenMode);
    document.getElementById('zenToggle').style.opacity = zenMode ? '1' : '';
    document.getElementById('zenToggle').style.color = zenMode ? 'var(--accent)' : '';
    showNotification(zenMode ? 'Zen mode — hover pane for controls' : 'Zen mode off', 'info');
}

// ════════════════════════════════════════════════════════════
// Shortcuts cheatsheet
// ════════════════════════════════════════════════════════════
function showShortcutsModal() {
    if (document.getElementById('shortcutsOverlay')) return;
    const overlay = document.createElement('div');
    overlay.id = 'shortcutsOverlay';
    overlay.className = 'shortcuts-overlay';
    const row = (desc, ...keys) =>
        `<div class="shortcut-row"><span class="shortcut-desc">${desc}</span><div class="shortcut-keys">${keys.map(k=>`<kbd class="shortcut-key">${k}</kbd>`).join('')}</div></div>`;
    overlay.innerHTML = `
        <div class="shortcuts-modal">
            <h2>⌨ Keyboard Shortcuts</h2>
            <div class="shortcuts-group">
                <div class="shortcuts-group-title">Navigation</div>
                ${row('Command palette','⌘','K')}
                ${row('Show shortcuts','?')}
                ${row('Close overlay / exit zen','Esc')}
            </div>
            <div class="shortcuts-group">
                <div class="shortcuts-group-title">Editing</div>
                ${row('Save note','⌘','S')}
                ${row('Rename pane title','dbl-click title')}
            </div>
            <div class="shortcuts-group">
                <div class="shortcuts-group-title">View</div>
                ${row('Toggle dark mode','⌘','D')}
                ${row('Zen / focus mode','⌘','.')}
            </div>
            <div style="text-align:center;margin-top:12px;">
                <button class="btn" onclick="document.getElementById('shortcutsOverlay').remove()">Close</button>
            </div>
        </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
}

// ════════════════════════════════════════════════════════════
// Search highlight helper
// ════════════════════════════════════════════════════════════
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightMatch(text, query) {
    const escaped = escapeHtml(text);
    if (!query) return escaped;
    return escaped.replace(new RegExp(`(${escapeRegex(escapeHtml(query))})`, 'gi'), '<mark class="sh">$1</mark>');
}

function extractSnippet(content, query, contextBefore = 40, contextAfter = 90) {
    // Strip markdown syntax to get readable plain text
    const plain = content
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/`[^`]+`/g, ' ')
        .replace(/#{1,6}\s+/g, '')
        .replace(/[*_~]/g, '')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

    const idx = plain.toLowerCase().indexOf(query.toLowerCase());
    let raw;
    if (idx === -1) {
        raw = plain.slice(0, 120);
        return escapeHtml(raw) + (plain.length > 120 ? '…' : '');
    }

    const start = Math.max(0, idx - contextBefore);
    const end   = Math.min(plain.length, idx + query.length + contextAfter);
    raw = (start > 0 ? '…' : '') + plain.slice(start, end) + (end < plain.length ? '…' : '');

    const escaped = escapeHtml(raw);
    return escaped.replace(new RegExp(`(${escapeRegex(escapeHtml(query))})`, 'gi'), '<mark class="sh">$1</mark>');
}
