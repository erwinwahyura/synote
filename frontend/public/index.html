            <div class="cmd-results" id="cmdResults"></div>
            <div class="cmd-footer">
                <span class="cmd-hint"><kbd class="cmd-key">↑↓</kbd> Navigate</span>
                <span class="cmd-hint"><kbd class="cmd-key">↵</kbd> Open</span>
                <span class="cmd-hint"><kbd class="cmd-key">Esc</kbd> Close</span>
            </div>
        </div>`;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', e => { if (e.target === overlay) closeCommandPalette(); });
    const input = document.getElementById('cmdInput');
    input.focus();
    input.addEventListener('input', updateCmdResults);
    input.addEventListener('keydown', handleCmdKey);
    cmdSelectedIdx = 0;
    updateCmdResults();
}

function closeCommandPalette() {
    document.getElementById('cmdOverlay')?.remove();
}

// Actions available in command palette (> prefix)
const CMD_ACTIONS = [
    { icon: '📝', label: 'New Note',        hint: '>new',    run: () => createNewNote() },
    { icon: '🌙', label: 'Toggle Dark Mode', hint: '>dark',   run: () => { darkMode=!darkMode; localStorage.setItem('synote_dark',darkMode); applyDarkMode(); } },
    { icon: '🧘', label: 'Toggle Zen Mode',  hint: '>zen',    run: () => toggleZenMode() },
    { icon: '🕸',  label: 'Open Graph',       hint: '>graph',  run: () => { closeCommandPalette(); openGraphView(); } },
    { icon: '⌨',  label: 'Shortcuts',        hint: '>keys',   run: () => { closeCommandPalette(); showShortcutsModal(); } },
    { icon: '📊', label: 'Note Stats',       hint: '>stats',  run: () => { const p=openPanes[0]; if(p) showNoteStats(p.uid); } },
    { icon: '🎨', label: 'Change Accent',    hint: '>accent', run: () => { closeCommandPalette(); document.getElementById('accentPicker')?.click(); } },
    { icon: '🎯', label: 'Set Writing Goal', hint: '>goal',   run: () => { closeCommandPalette(); setWordCountGoal(); } },
    { icon: '⤢',  label: 'Maximize Pane',    hint: '>max',    run: () => { closeCommandPalette(); const p=openPanes[0]; if(p) toggleMaximizePane(p.uid); } },
];

let cmdItems = []; // unified list: {type:'note'|'action', data}

function updateCmdResults() {
    const raw = document.getElementById('cmdInput')?.value || '';
    const q = raw.toLowerCase().trim();
    const isAction = raw.startsWith('>');

    if (isAction) {
        const aq = q.slice(1);
        const matched = CMD_ACTIONS.filter(a => a.label.toLowerCase().includes(aq) || a.hint.slice(1).includes(aq));
        cmdItems = matched.map(a => ({ type: 'action', data: a }));
    } else if (q) {
        const noteMatches = notes
            .filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q))
            .slice(0, 20);
        cmdItems = noteMatches.map(n => ({ type: 'note', data: n }));
    } else {
        // Default: recent notes + action hint
        const recentIds = recentlyViewed.map(r => r.id);
        const recentNotes = recentIds.map(id => notes.find(n => n.id === id)).filter(Boolean);
        const others = getSortedNotes(notes).filter(n => !recentIds.includes(n.id));
        const noteItems = [...recentNotes, ...others].slice(0, 12).map(n => ({ type: 'note', data: n }));
        const actionItems = CMD_ACTIONS.slice(0, 3).map(a => ({ type: 'action', data: a }));
        cmdItems = [...actionItems, ...noteItems];
    }

    cmdSelectedIdx = Math.min(cmdSelectedIdx, Math.max(0, cmdItems.length - 1));
    renderCmdResults();
}

function renderCmdResults() {
    const el = document.getElementById('cmdResults');
    if (!el) return;
    if (cmdItems.length === 0) {
        el.innerHTML = '<div class="cmd-empty">No results — try <kbd style="background:var(--border-light);padding:1px 5px;border-radius:3px;font-size:10px;">&gt;action</kbd> for commands</div>';
        return;
    }
    let html = '';
    let inNotes = false, inActions = false;
    cmdItems.forEach((item, i) => {
        const sel = i === cmdSelectedIdx ? 'selected' : '';
        if (item.type === 'action' && !inActions) {
            inActions = true;
            html += '<div class="cmd-section-label">Actions</div>';
        }
        if (item.type === 'note' && !inNotes) {
            inNotes = true;
            html += '<div class="cmd-section-label">Notes</div>';
        }
        if (item.type === 'action') {
            html += `<div class="cmd-item ${sel}" onclick="selectCmdItem(${i})">
                <span class="cmd-item-icon">${item.data.icon}</span>
                <span class="cmd-item-title">${item.data.label}</span>
                <span class="cmd-item-date" style="font-family:var(--font-mono);font-size:10px;opacity:0.5;">${item.data.hint}</span>
            </div>`;
        } else {
            const n = item.data;
            const excerpt = n.content.replace(/[#*`\[\]]/g, '').slice(0, 60);
            html += `<div class="cmd-item ${sel}" onclick="selectCmdItem(${i})">
                <span class="cmd-item-icon">📄</span>
                <div style="flex:1;min-width:0;">
                    <div class="cmd-item-title">${escapeHtml(n.title)}</div>
                    <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(excerpt)}</div>
                </div>
                <span class="cmd-item-date">${new Date(n.updated_at).toLocaleDateString()}</span>
            </div>`;
        }
    });
    el.innerHTML = html;
}

function selectCmdItem(idx) {
    const item = cmdItems[idx];
    if (!item) return;
    closeCommandPalette();
    if (item.type === 'action') {
        item.data.run();
    } else {
        loadNote(item.data.id);
    }
}

function handleCmdKey(e) {
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        cmdSelectedIdx = Math.min(cmdSelectedIdx + 1, cmdItems.length - 1);
        renderCmdResults();
        document.querySelectorAll('.cmd-item')[cmdSelectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        cmdSelectedIdx = Math.max(cmdSelectedIdx - 1, 0);
        renderCmdResults();
        document.querySelectorAll('.cmd-item')[cmdSelectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
        selectCmdItem(cmdSelectedIdx);
    } else if (e.key === 'Escape') {
        closeCommandPalette();
    }
}

function showNotification(msg, type = 'info') {
    document.querySelector('.notification')?.remove();
    const colors = { success: '#3fb950', error: '#e5534b', info: '#6d5ef5' };
    const n = document.createElement('div');
    n.className = 'notification';
    n.textContent = msg;
    n.style.cssText = `position:fixed;top:20px;right:20px;padding:9px 18px;
        background:${colors[type]||colors.info};color:white;border-radius:8px;
        box-shadow:var(--shadow-md);z-index:5000;font-size:13px;font-weight:500;
        font-family:var(--font);animation:slideInRight 0.22s ease;`;
    document.body.appendChild(n);
    setTimeout(() => {
        n.style.animation = 'slideOutRight 0.22s ease forwards';
        setTimeout(() => n.remove(), 220);
    }, 2200);
}

    const d = document.createElement('div');
    d.textContent = text || '';
    return d.innerHTML;
}

let graphSimulation = null;

async function showGraphView() {
    const container = document.getElementById('panesContainer');
    container.innerHTML = `
        <div class="graph-container">
            <div class="graph-header">
                <h2>⬡ Note Graph</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <input id="graphSearch" placeholder="Search notes…" oninput="filterGraph(this.value)"
                        style="padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--sidebar-bg);color:var(--text-primary);font-size:12px;width:180px;">
                    <span id="graphNodeCount" style="font-size:11px;color:var(--text-muted);"></span>
                    <button class="btn" onclick="resetGraphZoom()">Reset</button>
                    <button class="btn" onclick="closeGraphView()">← Back</button>
                </div>
            </div>
            <svg class="graph-canvas" id="graphCanvas"></svg>
        </div>`;
    try {
        const res = await apiCall('/graph');
        if (!res.ok) { showNotification('Failed to load graph', 'error'); return; }
        let data;
        try { data = await res.json(); } catch { data = { nodes: [], edges: [] }; }
        if (!data.nodes?.length) {
            document.getElementById('graphCanvas').innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="14" font-family="Inter,sans-serif">No notes yet. Create notes with [[links]] to see the graph!</text>`;
            return;
        }
        renderForceGraph(data);
    } catch { showNotification('Failed to load graph', 'error'); }
}

function closeGraphView() {
    openPanes = []; currentNote = null;
    renderPanes(); renderNotesList();
}

function renderForceGraph(data) {
    const svg = d3.select('#graphCanvas');
    const width = svg.node().parentElement.clientWidth;
    const height = svg.node().parentElement.clientHeight;
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('width', width).attr('height', height);
    svg.selectAll('*').remove();
    const g = svg.append('g');
    graphZoom = d3.zoom().scaleExtent([0.1,4]).on('zoom', e => g.attr('transform', e.transform));
    svg.call(graphZoom);
    const nodeCount = document.getElementById('graphNodeCount');
    if (nodeCount) nodeCount.textContent = `${data.nodes.length} notes · ${data.edges.length} links`;
    // Size nodes by connection count
    const connCount = {};
    (data.edges||[]).forEach(e => {
        const s = e.source?.id ?? e.source, t = e.target?.id ?? e.target;
        connCount[s] = (connCount[s]||0)+1; connCount[t] = (connCount[t]||0)+1;
    });
    data.nodes.forEach(n => { n.size = Math.min(20, 7 + (connCount[n.id]||0) * 2); });

    // Color nodes by primary tag
    const TAG_COLORS = ['#6d5ef5','#2ea043','#f5a623','#e5534b','#58a6ff','#db61a2','#f78166','#3fb950'];
    const tagColorMap = {};
    let tagColorIdx = 1;
    const noteTagMap = {};
    notes.forEach(n => {
        const tags = (n.content.match(/#[a-zA-Z0-9_-]+/g) || []).map(t => t.slice(1));
        if (tags.length) {
            noteTagMap[n.id] = tags[0]; // primary tag
            if (!tagColorMap[tags[0]]) tagColorMap[tags[0]] = TAG_COLORS[tagColorIdx++ % TAG_COLORS.length];
        }
    });

    const sim = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.edges).id(d=>d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-280))
        .force('center', d3.forceCenter(width/2, height/2))
        .force('collision', d3.forceCollide().radius(d=>d.size+10));
    graphSimulation = sim;
    const link = g.append('g').selectAll('line').data(data.edges).enter().append('line').attr('class','graph-link');
    const node = g.append('g').selectAll('g').data(data.nodes).enter().append('g').attr('class','graph-node')
        .call(d3.drag()
            .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
            .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
            .on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
        .on('click',(e,d)=>{ e.stopPropagation(); loadNote(d.id); })
        .on('dblclick',(e,d)=>{ e.stopPropagation(); if(d.fx!=null){d.fx=null;d.fy=null;d3.select(e.currentTarget).select('circle').attr('stroke','rgba(255,255,255,0.2)');} else {d.fx=d.x;d.fy=d.y;d3.select(e.currentTarget).select('circle').attr('stroke','#f5a623');} graphSimulation.alphaTarget(0.1).restart(); });
    node.append('circle').attr('r',d=>d.size||8)
        .attr('fill', d => tagColorMap[noteTagMap[d.id]] || TAG_COLORS[0])
        .attr('stroke','rgba(255,255,255,0.2)').attr('stroke-width',2);
    node.append('text').attr('dy',d=>(d.size||8)+14).attr('text-anchor','middle')
        .text(d=>d.title?.length>22?d.title.slice(0,22)+'…':d.title)
        .attr('font-size','11px').attr('fill','rgba(255,255,255,0.7)').attr('font-family','Inter,sans-serif');

    // Hover: highlight connected nodes, fade others
    node.on('mouseover', (e, d) => {
        const connected = new Set([d.id]);
        data.edges.forEach(l => {
            const src = l.source.id ?? l.source;
            const tgt = l.target.id ?? l.target;
            if (src === d.id) connected.add(tgt);
            if (tgt === d.id) connected.add(src);
        });
        node.style('opacity', n => connected.has(n.id) ? 1 : 0.15);
        link.style('opacity', l => {
            const src = l.source.id ?? l.source;
            const tgt = l.target.id ?? l.target;
            return (src === d.id || tgt === d.id) ? 1 : 0.05;
        });
    }).on('mouseout', () => {
        node.style('opacity', 1);
        link.style('opacity', 1);
    });

    sim.on('tick',()=>{
        link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });

    // Tag legend (top-left of SVG)
    const legendTags = Object.entries(tagColorMap).slice(0, 8);
    if (legendTags.length > 0) {
        const legend = svg.append('g').attr('transform', 'translate(12, 12)');
        legendTags.forEach(([tag, color], i) => {
            legend.append('circle').attr('cx', 6).attr('cy', i*16+6).attr('r', 5).attr('fill', color);
            legend.append('text').attr('x', 14).attr('y', i*16+10)
                .text('#' + tag).attr('font-size','10px').attr('fill','rgba(255,255,255,0.55)').attr('font-family','Inter,sans-serif');
        });
    }
}

let graphZoom = null; // d3 zoom behavior reference

function filterGraph(q) {
    const svg = d3.select('#graphCanvas');
    const count = document.getElementById('graphNodeCount');
    if (!q) {
        svg.selectAll('.graph-node').style('opacity', 1).style('pointer-events', 'all');
        svg.selectAll('.graph-link').style('opacity', 1);
        if (count) count.textContent = '';
        return;
    }
    const lower = q.toLowerCase();
    let visible = 0;
    svg.selectAll('.graph-node').each(function(d) {
        const match = d.title?.toLowerCase().includes(lower);
        d3.select(this).style('opacity', match ? 1 : 0.08).style('pointer-events', match ? 'all' : 'none');
        if (match) visible++;
    });
    svg.selectAll('.graph-link').each(function(d) {
        const srcTitle = (d.source.title || '').toLowerCase();
        const tgtTitle = (d.target.title || '').toLowerCase();
        const show = srcTitle.includes(lower) || tgtTitle.includes(lower);
        d3.select(this).style('opacity', show ? 0.8 : 0.03);
    });
    if (count) count.textContent = `${visible} match${visible !== 1 ? 'es' : ''}`;
}

function resetGraphZoom() {
    const svg = d3.select('#graphCanvas');
    if (graphZoom) svg.transition().duration(400).call(graphZoom.transform, d3.zoomIdentity);
}

// ════════════════════════════════════════════════════════════
// Keyboard shortcuts
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
    const inInput = ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)
        || document.activeElement?.contentEditable === 'true';

    // Cmd/Ctrl+K → command palette
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('cmdOverlay') ? closeCommandPalette() : showCommandPalette();
    }
    // Cmd+S → save if modal open
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        if (document.getElementById('editorModal')) saveFromModal();
    }
    // Cmd+F → find in active pane
    if ((e.metaKey || e.ctrlKey) && e.key === 'f' && !document.getElementById('editorModal')) {
        e.preventDefault();
        const pane = openPanes[0];
        if (pane) toggleFindBar(pane.uid);
    }
    // Cmd+H → find & replace in editor
    if ((e.metaKey || e.ctrlKey) && e.key === 'h' && document.getElementById('editorModal')) {
        e.preventDefault();
        toggleEditorFindReplace();
    }
    // Cmd+N → new note
    if ((e.metaKey || e.ctrlKey) && e.key === 'n' && !e.shiftKey) {
        e.preventDefault();
        showNewNoteForm();
    }
    // Cmd+Shift+N → quick capture
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'N') {
        e.preventDefault();
        showQuickCapture();
    }
    // Cmd+Alt+D → today's daily note
    if ((e.metaKey || e.ctrlKey) && e.altKey && e.key === 'd') {
        e.preventDefault();
        openDailyNote();
    }
    // Cmd+D → toggle dark mode
    if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
        e.preventDefault();
        toggleDarkMode();
    }
    // Cmd+. → toggle zen mode
    if ((e.metaKey || e.ctrlKey) && e.key === '.') {
        e.preventDefault();
        toggleZenMode();
    }
    // Cmd+[ / Cmd+] → switch focus between panes
    if ((e.metaKey || e.ctrlKey) && (e.key === '[' || e.key === ']') && openPanes.length > 1 && !inInput) {
        e.preventDefault();
        const visiblePanes = openPanes.filter(p => !p.minimized);
        if (visiblePanes.length < 2) return;
        let focusedIdx = visiblePanes.findIndex(p => document.getElementById(`pane-${p.uid}`)?.classList.contains('pane-focused'));
        if (focusedIdx === -1) focusedIdx = 0;
        const nextIdx = e.key === ']' ? (focusedIdx + 1) % visiblePanes.length : (focusedIdx - 1 + visiblePanes.length) % visiblePanes.length;
        document.querySelectorAll('.note-pane').forEach(el => el.classList.remove('pane-focused'));
        document.getElementById(`pane-${visiblePanes[nextIdx].uid}`)?.classList.add('pane-focused');
    }
    // Cmd+M → maximize/restore focused pane
    if ((e.metaKey || e.ctrlKey) && e.key === 'm' && !document.getElementById('editorModal') && openPanes.length > 0) {
        e.preventDefault();
        const focused = openPanes.find(p => document.getElementById(`pane-${p.uid}`)?.classList.contains('pane-focused'))
            || openPanes[0];
        if (focused) toggleMaximizePane(focused.uid);
    }
    // Cmd+W → close focused pane (not in modal)
    if ((e.metaKey || e.ctrlKey) && e.key === 'w' && !document.getElementById('editorModal') && openPanes.length > 0) {
        e.preventDefault();
        const focused = openPanes.find(p => document.getElementById(`pane-${p.uid}`)?.classList.contains('pane-focused'));
        const target = focused || openPanes[openPanes.length - 1];
        if (target) closePane(target.uid);
    }
    // Cmd+Alt+← / → → navigate back/forward in focused pane
    if ((e.metaKey || e.ctrlKey) && e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !inInput) {
        e.preventDefault();
        const focused = openPanes.find(p => document.getElementById(`pane-${p.uid}`)?.classList.contains('pane-focused'))
            || openPanes[0];
        if (!focused) return;
        if (e.key === 'ArrowLeft') goBack(focused.uid);
        else goForward(focused.uid);
    }
    // ? → shortcuts cheatsheet (not in input)
    if (e.key === '?' && !inInput) {
        e.preventDefault();
        document.getElementById('shortcutsOverlay') ? document.getElementById('shortcutsOverlay').remove() : showShortcutsModal();
    }
    // Esc → close topmost overlay
    if (e.key === 'Escape') {
        if (document.getElementById('shortcutsOverlay')) { document.getElementById('shortcutsOverlay').remove(); return; }
        if (document.getElementById('cmdOverlay')) { closeCommandPalette(); return; }
        if (document.getElementById('editorModal')) { closeEditorModal(); return; }
        if (maximizedPaneUid) { toggleMaximizePane(maximizedPaneUid); return; }
        if (zenMode) { toggleZenMode(); return; }
        // Close any open export menus
        document.querySelectorAll('.export-wrap.open').forEach(el => el.classList.remove('open'));
    }
});

// ════════════════════════════════════════════════════════════

// Generic horizontal drag resize between two elements
function makeResizable(handle, getLeft, getRight, minLeft = 200, minRight = 200) {
    handle.addEventListener('mousedown', e => {
        e.preventDefault();
        const leftEl  = getLeft();
        const rightEl = getRight();
        if (!leftEl || !rightEl) return;

        const startX      = e.clientX;
        const leftStart   = leftEl.getBoundingClientRect().width;
        const totalWidth  = leftEl.parentElement.getBoundingClientRect().width;
        const maxLeft     = totalWidth - minRight;

        // Right pane becomes fluid so its LEFT edge tracks the handle
        rightEl.style.flex = '1 1 0';

        handle.classList.add('dragging');
        document.body.classList.add('resizing');

        const onMove = e => {
            const dx      = e.clientX - startX;
            const newLeft = Math.max(minLeft, Math.min(maxLeft, leftStart + dx));
            leftEl.style.flex = `0 0 ${newLeft}px`;
        };

        const onUp = () => {
            handle.classList.remove('dragging');
            document.body.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });

    // Touch support
    handle.addEventListener('touchstart', e => {
        e.preventDefault();
        const leftEl  = getLeft();
        const rightEl = getRight();
        if (!leftEl || !rightEl) return;

        const startX     = e.touches[0].clientX;
        const leftStart  = leftEl.getBoundingClientRect().width;
        const totalWidth = leftEl.parentElement.getBoundingClientRect().width;
        const maxLeft    = totalWidth - minRight;

        handle.classList.add('dragging');
        rightEl.style.flex = '1 1 0';

        const onMove = e => {
            const dx      = e.touches[0].clientX - startX;
            const newLeft = Math.max(minLeft, Math.min(maxLeft, leftStart + dx));
            leftEl.style.flex = `0 0 ${newLeft}px`;
        };

        const onEnd = () => {
            handle.classList.remove('dragging');
            handle.removeEventListener('touchmove', onMove);
            handle.removeEventListener('touchend', onEnd);
        };

        handle.addEventListener('touchmove', onMove, { passive: false });
        handle.addEventListener('touchend', onEnd);
    }, { passive: false });
}

// Insert resize handles between all open panes
function addPaneResizeHandles() {
    const container = document.getElementById('panesContainer');
    if (!container) return;

    // Always purge stale handles first to prevent duplicates
    container.querySelectorAll('.pane-resize-handle').forEach(h => h.remove());

    const panes = [...container.querySelectorAll('.note-pane')];
    panes.forEach((pane, i) => {
        if (i === panes.length - 1) return;
        const handle = document.createElement('div');
        handle.className = 'pane-resize-handle';
        pane.after(handle);

        // Skip over any non-pane siblings (other handles etc.)
        const leftPane  = () => {
            let el = handle.previousElementSibling;
            while (el && !el.classList.contains('note-pane')) el = el.previousElementSibling;
            return el;
        };
        const rightPane = () => {
            let el = handle.nextElementSibling;
            while (el && !el.classList.contains('note-pane')) el = el.nextElementSibling;
            return el;
        };

        makeResizable(handle, leftPane, rightPane, 280, 280);
    });
}

async function createNewNote() {
    const title = document.getElementById('newNoteInput').value.trim();
    if (!title) return;
    try {
        const res = await apiCall('/notes', {
            method: 'POST',
            body: JSON.stringify({ title, content: '' })
        });

        const note = await res.json();
        noteCache.set(note.id, note);

// Delete note
// ════════════════════════════════════════════════════════════
function confirmDeleteNote(paneUid) {
    const wrap = document.getElementById(`delete-wrap-${paneUid}`);
    if (!wrap) return;
    // Close if already open
    if (wrap.querySelector('.delete-confirm')) {
        wrap.querySelector('.delete-confirm').remove(); return;
    }
    // Close any other open confirms
    document.querySelectorAll('.delete-confirm').forEach(el => el.remove());

    const box = document.createElement('div');
    box.className = 'delete-confirm';
    box.innerHTML = `
        <p>Delete this note?<br><span style="font-size:11px;color:var(--text-muted);">This cannot be undone.</span></p>
        <div class="delete-confirm-actions">
            <button class="btn btn-danger" onclick="executeDelete('${paneUid}')">Delete</button>
            <button class="btn" onclick="this.closest('.delete-confirm').remove()">Cancel</button>
        </div>`;
    wrap.appendChild(box);

    // Close on outside click
    setTimeout(() => {
        const close = e => { if (!wrap.contains(e.target)) { box.remove(); document.removeEventListener('click', close); } };
        document.addEventListener('click', close);
    }, 0);
}

async function executeDelete(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    try {
        const res = await apiCall(`/notes/${pane.note.id}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error();
        noteCache.delete(pane.note.id);
        closePane(paneUid);
        await loadNotes();
        showNotification('Note deleted', 'info');
    } catch { showNotification('Delete failed', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Auto-save
// ════════════════════════════════════════════════════════════
let autosaveTimer = null;

function scheduleAutosave() {
    const status = document.getElementById('autosaveStatus');
    if (status) { status.textContent = 'Unsaved changes'; status.className = 'autosave-status'; }
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(async () => {
        if (status) { status.textContent = 'Saving…'; status.className = 'autosave-status saving'; }
        try {
            await saveFromModal(true); // silent = true
            const now = new Date();
            const ts = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            if (status) { status.textContent = `✓ Saved at ${ts}`; status.className = 'autosave-status saved'; }
            setTimeout(() => { if (status) { status.textContent = ''; status.className = 'autosave-status'; } }, 3000);
        } catch {
            if (status) { status.textContent = 'Save failed'; status.className = 'autosave-status'; }
        }
    }, 1500);
}

    stopFocusTimer(paneUid);
    const state = { elapsed: 0, intervalId: null };
    focusTimers[paneUid] = state;
    state.intervalId = setInterval(() => {
        state.elapsed++;
        const el = document.getElementById(`timer-${paneUid}`);
        if (!el) { stopFocusTimer(paneUid); return; }
        const m = Math.floor(state.elapsed / 60);
        const s = state.elapsed % 60;
        el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }, 1000);
}

function stopFocusTimer(paneUid) {
    if (focusTimers[paneUid]?.intervalId) {
        clearInterval(focusTimers[paneUid].intervalId);
        delete focusTimers[paneUid];
    }
}

// ════════════════════════════════════════════════════════════
// Daily word count goal
// ════════════════════════════════════════════════════════════
const WC_GOAL_KEY  = 'synote_wc_goal';   // target words/day
const WC_TODAY_KEY = 'synote_wc_today';  // {date, words}

function getTodayKey() {
    return new Date().toISOString().slice(0, 10);
}

function initWordCountGoal() {
    const goal = parseInt(localStorage.getItem(WC_GOAL_KEY) || '0');
    if (!goal) return; // hidden until user sets goal
    renderWordCountGoalBar();
}

function renderWordCountGoalBar() {
    const goal = parseInt(localStorage.getItem(WC_GOAL_KEY) || '0');
    const bar = document.getElementById('wcGoalBar');
    if (!bar) return;
    if (!goal) { bar.style.display = 'none'; return; }

    const stored = JSON.parse(localStorage.getItem(WC_TODAY_KEY) || '{}');
    const todayKey = getTodayKey();
    const words = stored.date === todayKey ? (stored.words || 0) : 0;

    const pct = Math.min(100, Math.round((words / goal) * 100));
    bar.style.display = '';
    document.getElementById('wcGoalFill').style.width = pct + '%';
    document.getElementById('wcGoalText').textContent = `${words.toLocaleString()} / ${goal.toLocaleString()} words today`;
    document.getElementById('wcGoalPct').textContent = pct + '%';
    // Accent changes to green when goal hit
    document.getElementById('wcGoalFill').style.background = pct >= 100 ? 'var(--success)' : 'var(--accent)';
}

function recordWordCountSaved(noteContent) {
    const goal = parseInt(localStorage.getItem(WC_GOAL_KEY) || '0');
    if (!goal) return;
    const wc = (noteContent.match(/\b\w+\b/g) || []).length;
    const todayKey = getTodayKey();
    const stored = JSON.parse(localStorage.getItem(WC_TODAY_KEY) || '{}');
    const prev = stored.date === todayKey ? (stored.words || 0) : 0;
    // Only accumulate if writing more (don't deduct on deletion)
    const newTotal = Math.max(prev, wc);
    localStorage.setItem(WC_TODAY_KEY, JSON.stringify({ date: todayKey, words: newTotal }));
    renderWordCountGoalBar();
}

function setWordCountGoal() {
    const current = localStorage.getItem(WC_GOAL_KEY) || '500';
    const val = prompt('Daily writing goal (words). Set to 0 to hide:', current);
    if (val === null) return;
    const num = parseInt(val) || 0;
    if (num < 0) return;
    localStorage.setItem(WC_GOAL_KEY, String(num));
    renderWordCountGoalBar();
    if (num > 0) showNotification(`Goal set: ${num} words/day`, 'success');
}

// Word count
// ════════════════════════════════════════════════════════════
function getWordCount(content) {
    return (content || '')
        .replace(/```[\s\S]*?```/g, '')   // strip code blocks
        .replace(/`[^`]*`/g, '')           // strip inline code
        .replace(/[#*_~\[\]>]/g, '')       // strip markdown syntax
        .trim().split(/\s+/).filter(Boolean).length;
}

// ════════════════════════════════════════════════════════════
// Inline rename
// ════════════════════════════════════════════════════════════
function startRenameInPane(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const el = document.querySelector(`#pane-${paneUid} .pane-title-label`);
    if (!el || el.contentEditable === 'true') return;

    const original = pane.note.title;
    el.contentEditable = 'true';
    el.style.cssText += ';background:var(--accent-light);border-radius:3px;padding:1px 5px;outline:1px solid var(--accent);';
    el.focus();

    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);

    const finish = async () => {
        if (el.contentEditable !== 'true') return;
        el.contentEditable = 'false';
        el.style.background = '';
        el.style.outline = '';
        el.style.padding = '';
        el.style.borderRadius = '';
        const newTitle = el.textContent.trim();
        if (!newTitle || newTitle === original) { el.textContent = original; return; }
        try {
            const res = await apiCall(`/notes/${pane.note.id}`, {
                method: 'PUT',
                body: JSON.stringify({ title: newTitle, content: pane.note.content })
            });
            const updated = await res.json();
            noteCache.set(updated.id, updated);
            pane.note = updated;
            currentNote = updated;
            await loadNotes();
            renderPaneContent(pane);
            showNotification('Renamed!', 'success');
        } catch {
            el.textContent = original;
            showNotification('Rename failed', 'error');
        }
    };

    el.onblur = finish;
    el.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') { el.textContent = original; el.contentEditable = 'false'; el.onblur = null; el.style.cssText = ''; }
    };
}

// ════════════════════════════════════════════════════════════
// Find in note
// ════════════════════════════════════════════════════════════
const findState = {}; // paneUid → { matches, idx }

function toggleFindBar(paneUid) {
    const pane = document.getElementById(`pane-${paneUid}`);
    if (!pane) return;
    const existing = pane.querySelector('.find-bar');
    if (existing) { closeFindBar(paneUid); return; }

    const bar = document.createElement('div');
    bar.className = 'find-bar';
    bar.id = `find-bar-${paneUid}`;
    bar.innerHTML = `
        <input class="find-input" id="find-input-${paneUid}" placeholder="Find in note…"
               oninput="runFind('${paneUid}')" onkeydown="handleFindKey(event,'${paneUid}')">
        <span class="find-count" id="find-count-${paneUid}"></span>
        <button class="btn-icon" onclick="stepFind('${paneUid}',-1)" title="Previous">↑</button>
        <button class="btn-icon" onclick="stepFind('${paneUid}',1)"  title="Next">↓</button>
        <button class="btn-icon" onclick="closeFindBar('${paneUid}')">✕</button>`;

    // Insert before footer (or append to pane)
    const footer = pane.querySelector('.pane-footer');
    footer ? footer.before(bar) : pane.appendChild(bar);
    document.getElementById(`find-input-${paneUid}`)?.focus();
}

function closeFindBar(paneUid) {
    clearFindHighlights(paneUid);
    document.getElementById(`find-bar-${paneUid}`)?.remove();
    delete findState[paneUid];
}

function handleFindKey(e, paneUid) {
    if (e.key === 'Escape') { closeFindBar(paneUid); return; }
    if (e.key === 'Enter') stepFind(paneUid, e.shiftKey ? -1 : 1);
}

function runFind(paneUid) {
    const query = document.getElementById(`find-input-${paneUid}`)?.value || '';
    clearFindHighlights(paneUid);
    const input = document.getElementById(`find-input-${paneUid}`);
    const count = document.getElementById(`find-count-${paneUid}`);
    if (!query) { count.textContent = ''; input?.classList.remove('no-match'); return; }

    const preview = document.getElementById(`preview-${paneUid}`);
    if (!preview) return;

    // Walk text nodes and wrap matches
    const matches = [];
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
    const re = new RegExp(escapeRegex(query), 'gi');
    const nodesToReplace = [];
    let node;
    while ((node = walker.nextNode())) {
        if (re.test(node.nodeValue)) nodesToReplace.push(node);
        re.lastIndex = 0;
    }
    nodesToReplace.forEach(textNode => {
        const frag = document.createDocumentFragment();
        let last = 0, m;
        re.lastIndex = 0;
        while ((m = re.exec(textNode.nodeValue)) !== null) {
            frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last, m.index)));
            const mark = document.createElement('mark');
            mark.className = 'find-hl';
            mark.textContent = m[0];
            mark.dataset.findPaneUid = paneUid;
            frag.appendChild(mark);
            matches.push(mark);
            last = m.index + m[0].length;
        }
        frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last)));
        textNode.parentNode.replaceChild(frag, textNode);
    });

    findState[paneUid] = { matches, idx: -1 };

    if (matches.length === 0) {
        input?.classList.add('no-match');
        count.textContent = 'No matches';
    } else {
        input?.classList.remove('no-match');
        stepFind(paneUid, 1);
    }
}

function stepFind(paneUid, dir) {
    const state = findState[paneUid];
    if (!state || !state.matches.length) return;
    state.matches[state.idx]?.classList.remove('current');
    state.idx = (state.idx + dir + state.matches.length) % state.matches.length;
    const cur = state.matches[state.idx];
    cur.classList.add('current');
    cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    document.getElementById(`find-count-${paneUid}`).textContent =
        `${state.idx + 1} / ${state.matches.length}`;
}

function clearFindHighlights(paneUid) {
    document.querySelectorAll(`mark.find-hl[data-find-pane-uid="${paneUid}"]`).forEach(m => {
        m.replaceWith(document.createTextNode(m.textContent));
    });
}

// ════════════════════════════════════════════════════════════
// Accent color picker
// ════════════════════════════════════════════════════════════
function applyAccentColor(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const root = document.documentElement.style;
    root.setProperty('--accent', hex);
    root.setProperty('--accent-hover', shadeHex(hex, -20));
    root.setProperty('--accent-light', `rgba(${r},${g},${b},0.12)`);
    root.setProperty('--accent-dim',   `rgba(${r},${g},${b},0.08)`);
    document.getElementById('accentColorPicker').value = hex;
    document.querySelector('.color-picker-btn').style.background = hex;
    localStorage.setItem('synote_accent', hex);
}

function shadeHex(hex, amt) {
    const clamp = v => Math.max(0, Math.min(255, v));
    const r = clamp(parseInt(hex.slice(1,3),16) + amt);
    const g = clamp(parseInt(hex.slice(3,5),16) + amt);
    const b = clamp(parseInt(hex.slice(5,7),16) + amt);
    return `#${[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}`;
}

function initAccentColor() {
    const saved = localStorage.getItem('synote_accent');
    if (saved) applyAccentColor(saved);
    else document.getElementById('accentColorPicker').value = '#6d5ef5';
}

// ════════════════════════════════════════════════════════════
// Foldable headings
// ════════════════════════════════════════════════════════════
function applyFoldableHeadings(el) {
    const headings = [...el.querySelectorAll('h2, h3')];
    headings.forEach(h => {
        // Add arrow indicator
        const arrow = document.createElement('span');
        arrow.className = 'heading-fold-arrow';
        arrow.textContent = '▾';
        h.appendChild(arrow);

        // Collect all sibling elements until next same-or-higher heading
        const level = parseInt(h.tagName[1]);
        const section = [];
        let sib = h.nextElementSibling;
        while (sib) {
            const sibLevel = sib.tagName?.match(/^H([23])$/)?.[1];
            if (sibLevel && parseInt(sibLevel) <= level) break;
            section.push(sib);
            sib = sib.nextElementSibling;
        }

        if (!section.length) { arrow.style.display = 'none'; return; }

        // Wrap section siblings in a div
        const wrapper = document.createElement('div');
        wrapper.className = 'heading-section';
        h.after(wrapper);
        section.forEach(n => wrapper.appendChild(n));

        h.addEventListener('click', () => {
            const folded = wrapper.classList.toggle('folded');
            h.classList.toggle('heading-folded', folded);
        });
    });
}

// Interactive checkboxes in preview

function applyCheckboxToggle(container, paneUid) {
    if (!paneUid) return; // don't wire in modal preview or hover previews
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;

    container.querySelectorAll('input[type="checkbox"]').forEach((cb, idx) => {
        cb.removeAttribute('disabled');
        cb.style.cursor = 'pointer';
        cb.addEventListener('change', async () => {
            // Toggle the Nth `- [ ]` or `- [x]` in note content
            let count = 0;
            const newContent = pane.note.content.replace(/^(\s*[-*+]\s+)\[([ x])\]/gm, (m, prefix, state) => {
                if (count++ === idx) {
                    return `${prefix}[${state === ' ' ? 'x' : ' '}]`;
                }
                return m;
            });
            if (newContent === pane.note.content) return;
            try {
                const res = await apiCall(`/notes/${pane.note.id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ title: pane.note.title, content: newContent })
                });
                if (!res.ok) throw new Error();
                const saved = await res.json();
                noteCache.set(saved.id, saved);
                pane.note = saved; currentNote = saved;
                // Re-render without full rebuild to avoid scroll jump
                const el = document.getElementById(`preview-${paneUid}`);
                if (el) {
                    configureMarked(paneUid);
                    const processed = processNoteEmbeds(saved.content, paneUid);
                    el.innerHTML = renderWikilinks(marked.parse(processed), paneUid);
                    applyCallouts(el); applyFoldableHeadings(el); applyCheckboxToggle(el, paneUid);
                }
            } catch { showNotification('Failed to save', 'error'); }
        });
    });
}

// Search highlight helper
// ════════════════════════════════════════════════════════════
function getBacklinkExcerpt(content, linkedTitle) {
    // Find [[linkedTitle]] in content and return surrounding sentence
    const re = new RegExp(`\\[\\[${escapeRegex(linkedTitle)}(?:\\|[^\\]]+)?\\]\\]`, 'i');
    const m = re.exec(content);
    if (!m) return '';
    const start = Math.max(0, m.index - 60);
    const end   = Math.min(content.length, m.index + m[0].length + 60);
    let raw = (start > 0 ? '…' : '') + content.slice(start, end).replace(/\n/g, ' ') + (end < content.length ? '…' : '');
    // Highlight the wikilink text
    return escapeHtml(raw).replace(
        new RegExp(escapeRegex(escapeHtml(m[0])), 'gi'),
        `<mark class="sh">${escapeHtml(linkedTitle)}</mark>`
    );
}

function highlightMatch(text, query) {
    const escaped = escapeHtml(text);
    if (!query) return escaped;
    return escaped.replace(new RegExp(`(${escapeRegex(escapeHtml(query))})`, 'gi'), '<mark class="sh">$1</mark>');
}

function extractSnippet(content, query, contextBefore = 40, contextAfter = 90) {
    // Strip markdown syntax to get readable plain text
    const plain = content
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/`[^`]+`/g, ' ')
        .replace(/#{1,6}\s+/g, '')
        .replace(/[*_~]/g, '')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

    const idx = plain.toLowerCase().indexOf(query.toLowerCase());
    let raw;
    if (idx === -1) {
        raw = plain.slice(0, 120);
        return escapeHtml(raw) + (plain.length > 120 ? '…' : '');
    }

    const start = Math.max(0, idx - contextBefore);
    const end   = Math.min(plain.length, idx + query.length + contextAfter);
    raw = (start > 0 ? '…' : '') + plain.slice(start, end) + (end < plain.length ? '…' : '');

    const escaped = escapeHtml(raw);
    return escaped.replace(new RegExp(`(${escapeRegex(escapeHtml(query))})`, 'gi'), '<mark class="sh">$1</mark>');
}

function renderActivityHeatmap() {
    const container = document.getElementById('activityHeatmap');
    if (!container) return;
    // Count notes created per day for last 52 weeks
    const now = new Date();
    const weeks = 52;
    const days = weeks * 7;
    const counts = {};
    notes.forEach(n => {
        const d = new Date(n.created_at).toISOString().slice(0, 10);
        counts[d] = (counts[d] || 0) + 1;
    });
    const maxCount = Math.max(1, ...Object.values(counts));

    // Build grid: columns=weeks, rows=7 days (Mon-Sun)
    const startDate = new Date(now);
    startDate.setDate(startDate.getDate() - days + 1);
    // Align to Monday
    const dayOfWeek = (startDate.getDay() + 6) % 7; // 0=Mon
    startDate.setDate(startDate.getDate() - dayOfWeek);

    let html = '<div style="display:flex;gap:2px;align-items:flex-start;">';
    for (let w = 0; w < weeks; w++) {
        html += '<div style="display:flex;flex-direction:column;gap:2px;">';
        for (let d = 0; d < 7; d++) {
            const date = new Date(startDate);
            date.setDate(date.getDate() + w * 7 + d);
            const key = date.toISOString().slice(0, 10);
            const count = counts[key] || 0;
            const intensity = count === 0 ? 0 : Math.max(0.15, count / maxCount);
            const bg = count === 0 ? 'var(--border-light)' : `rgba(109,94,245,${intensity})`;
            html += `<div title="${key}: ${count} note${count!==1?'s':''}" style="width:10px;height:10px;border-radius:2px;background:${bg};"></div>`;
        }
        html += '</div>';
    }
    html += '</div><div style="margin-top:4px;font-size:10px;color:var(--text-muted);">Less → More</div>';
    container.innerHTML = html;
}

// Version history (localStorage-based)
// ════════════════════════════════════════════════════════════
const MAX_VERSIONS = 15;

function saveVersion(noteId, title, content) {
    const key = `synote_history_${noteId}`;
    const versions = JSON.parse(localStorage.getItem(key) || '[]');
    // Don't save if identical to last version
    if (versions[0]?.content === content && versions[0]?.title === title) return;
    versions.unshift({ ts: Date.now(), title, content });
    if (versions.length > MAX_VERSIONS) versions.splice(MAX_VERSIONS);
    localStorage.setItem(key, JSON.stringify(versions));
}

function getVersions(noteId) {
    return JSON.parse(localStorage.getItem(`synote_history_${noteId}`) || '[]');
}

let selectedVersionIdx = -1;

function toggleHistoryPanel() {
    const modal = document.getElementById('editorModal');
    if (!modal) return;
    const existing = modal.querySelector('.history-panel');
    if (existing) { existing.remove(); return; }

    const paneUid = modal.dataset.paneUid;
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;

    const versions = getVersions(pane.note.id);
    const panel = document.createElement('div');
    panel.className = 'history-panel';

    if (!versions.length) {
        panel.innerHTML = `
            <div class="history-header"><span>Version History</span><button class="btn-icon" onclick="this.closest('.history-panel').remove()">✕</button></div>
            <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No history yet.<br>Versions are saved automatically on each save.</div>`;
    } else {
        selectedVersionIdx = -1;
        panel.innerHTML = `
            <div class="history-header"><span>Version History</span><button class="btn-icon" onclick="this.closest('.history-panel').remove()">✕</button></div>
            <div class="history-list" id="historyList">
                ${versions.map((v,i) => `
                    <div class="history-item" data-idx="${i}" onclick="previewVersion(${i})">
                        <div class="history-item-time">${new Date(v.ts).toLocaleString()}</div>
                        <div class="history-item-preview">${escapeHtml(v.content.slice(0,60))}…</div>
                    </div>`).join('')}
            </div>
            <div class="history-actions">
                <button class="btn btn-primary" id="restoreBtn" onclick="restoreVersion()" disabled style="flex:1;">Restore</button>
                <button class="btn" onclick="this.closest('.history-panel').remove()">Cancel</button>
            </div>`;
    }

    modal.querySelector('.modal-body').appendChild(panel);
}

function previewVersion(idx) {
    selectedVersionIdx = idx;
    const modal = document.getElementById('editorModal');
    const paneUid = modal?.dataset.paneUid;
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;

    const versions = getVersions(pane.note.id);
    const v = versions[idx];
    if (!v) return;

    // Highlight selected
    modal.querySelectorAll('.history-item').forEach((el,i) => el.classList.toggle('selected', i===idx));

    // Show version content in editor (preview only)
    document.getElementById('modalContent').value = v.content;
    document.getElementById('modalTitle').value   = v.title;
    updateModalPreview();
    document.getElementById('restoreBtn').disabled = false;

    const status = document.getElementById('autosaveStatus');
    if (status) { status.textContent = `Viewing ${new Date(v.ts).toLocaleString()}`; status.className = 'autosave-status'; }
}

function restoreVersion() {
    // Content is already in the editor from preview — just close the panel
    document.querySelector('.history-panel')?.remove();
    showNotification('Version restored — save to confirm', 'info');
    const status = document.getElementById('autosaveStatus');
    if (status) { status.textContent = 'Unsaved changes'; status.className = 'autosave-status'; }
}

// ════════════════════════════════════════════════════════════
let sidebarNavIdx = -1;

function getSidebarItems() {
    return [...document.querySelectorAll('#notesList .note-item')];
}

function moveSidebarFocus(dir) {
    const items = getSidebarItems();
    if (!items.length) return;
    items[sidebarNavIdx]?.classList.remove('keyboard-focus');
    sidebarNavIdx = Math.max(0, Math.min(items.length - 1, sidebarNavIdx + dir));
    items[sidebarNavIdx].classList.add('keyboard-focus');
    items[sidebarNavIdx].scrollIntoView({ block: 'nearest' });
}

function openSidebarFocused() {
    const items = getSidebarItems();
    const focused = items[sidebarNavIdx];
    focused?.click();
}

// Wire arrow keys to sidebar when search is focused or sidebar is hovered
document.addEventListener('keydown', e => {
    const inSearch = document.activeElement?.id === 'searchInput';
    const sidebarHovered = document.querySelector('.sidebar:hover');
    if (!inSearch && !sidebarHovered) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSidebarFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSidebarFocus(-1); }
    else if (e.key === 'Enter' && sidebarNavIdx >= 0) { e.preventDefault(); openSidebarFocused(); }
});

let folderViewOpen = false;

function renderFolderView() {
    // Group notes by top-level folder from note.path
    const folders = {};
    const root = [];
    notes.forEach(note => {
        const parts = (note.path || '').split('/');
        if (parts.length <= 1) {
            root.push(note);
        } else {
            const folder = parts.slice(0, -1).join('/');
            if (!folders[folder]) folders[folder] = [];
            folders[folder].push(note);
        }
    });

    const openIds = new Set(openPanes.map(p => p.note.id));
    let html = '';

    // Folders first
    Object.entries(folders).sort(([a],[b]) => a.localeCompare(b)).forEach(([folder, folderNotes]) => {
        const folderId = 'folder-' + folder.replace(/[^a-z0-9]/gi, '-');
        html += `<div class="folder-item" id="${folderId}-btn" onclick="toggleFolder('${folderId}')">
            <span class="folder-arrow">▶</span> 📁 ${escapeHtml(folder)}
            <span style="margin-left:auto;font-size:10px;opacity:0.6;">${folderNotes.length}</span>
        </div>
        <div class="folder-notes closed" id="${folderId}-notes">`;
        folderNotes.forEach(note => {
            html += makeNoteItemHtml(note, openIds.has(note.id), '', false);
        });
        html += `</div>`;
    });

    // Root notes
    if (root.length) {
        if (Object.keys(folders).length) html += `<div class="list-section-label">Ungrouped</div>`;
        root.forEach(note => {
            html += makeNoteItemHtml(note, openIds.has(note.id));
        });
    }

    document.getElementById('notesList').innerHTML = html;
}

function toggleFolder(folderId) {
    const btn   = document.getElementById(`${folderId}-btn`);
    const notes = document.getElementById(`${folderId}-notes`);
    if (!btn || !notes) return;
    const isOpen = !notes.classList.contains('closed');
    notes.classList.toggle('closed', isOpen);
    btn.classList.toggle('open', !isOpen);
}

// Hook folder view into the graph button area
function toggleFolderView() {
    folderViewOpen = !folderViewOpen;
    const btn = document.getElementById('folderViewBtn');
    if (btn) { btn.style.opacity = folderViewOpen ? '1' : ''; btn.style.color = folderViewOpen ? 'var(--accent)' : ''; }
    if (folderViewOpen) renderFolderView();
    else renderNotesList();
}

// ════════════════════════════════════════════════════════════
// Mini-graph per pane
// ════════════════════════════════════════════════════════════
async function loadMiniGraph(paneUid, noteId) {
    try {
        const res = await apiCall('/graph');
        if (!res.ok) return;
        const data = await res.json();
        renderMiniGraph(paneUid, noteId, data);
    } catch {}
}

function renderMiniGraph(paneUid, noteId, data) {
    const svgEl = document.getElementById(`mini-svg-${paneUid}`);
    if (!svgEl || !data.nodes?.length) {
        document.getElementById(`mini-graph-${paneUid}`)?.style.setProperty('display','none');
        return;
    }

    // Find connected nodes
    const connected = new Set([noteId]);
    (data.edges||[]).forEach(e => {
        const s = e.source?.id ?? e.source, t = e.target?.id ?? e.target;
        if (s === noteId) connected.add(t);
        if (t === noteId) connected.add(s);
    });

    if (connected.size <= 1) { document.getElementById(`mini-graph-${paneUid}`)?.style.setProperty('display','none'); return; }

    const subNodes = data.nodes.filter(n => connected.has(n.id));
    const subEdges = (data.edges||[]).filter(e => {
        const s = e.source?.id ?? e.source, t = e.target?.id ?? e.target;
        return connected.has(s) && connected.has(t);
    });

    const svg = d3.select(svgEl);
    svg.selectAll('*').remove();
    const w = svgEl.getBoundingClientRect().width || 300, h = 160;
    svg.attr('viewBox', `0 0 ${w} ${h}`);

    const sim = d3.forceSimulation(subNodes)
        .force('link', d3.forceLink(subEdges).id(d=>d.id).distance(55))
        .force('charge', d3.forceManyBody().strength(-120))
        .force('center', d3.forceCenter(w/2, h/2))
        .force('collision', d3.forceCollide(18));

    const link = svg.append('g').selectAll('line').data(subEdges).enter().append('line')
        .attr('stroke','rgba(109,94,245,0.4)').attr('stroke-width',1.5);

    const node = svg.append('g').selectAll('g').data(subNodes).enter().append('g')
        .style('cursor','pointer')
        .on('click', (e,d) => { if (d.id !== noteId) navigateInPane(paneUid, d.id); });

    node.append('circle')
        .attr('r', d => d.id === noteId ? 10 : 6)
        .attr('fill', d => d.id === noteId ? 'var(--accent)' : '#888')
        .attr('stroke','rgba(255,255,255,0.2)').attr('stroke-width',1.5);

    node.append('text')
        .attr('dy', d => (d.id===noteId?10:6)+11).attr('text-anchor','middle')
        .text(d => d.title?.length>14 ? d.title.slice(0,14)+'…' : d.title)
        .attr('font-size','9px').attr('fill','rgba(255,255,255,0.65)').attr('font-family','Inter,sans-serif');

    sim.on('tick', () => {
        link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

// ════════════════════════════════════════════════════════════
// Reminders
// ════════════════════════════════════════════════════════════
function getReminder(noteId) {
    const r = localStorage.getItem(`synote_reminder_${noteId}`);
    return r ? parseInt(r) : null;
}

function editReminder(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const existing = getReminder(pane.note.id);
    const existingStr = existing ? new Date(existing).toISOString().slice(0,16) : '';

    const dialog = document.createElement('div');
    dialog.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:3000;display:flex;align-items:center;justify-content:center;';
    dialog.innerHTML = `
        <div style="background:var(--content-bg);border:1px solid var(--border);border-radius:12px;padding:22px 24px;width:320px;box-shadow:var(--shadow-lg);">
            <h3 style="font-size:14px;font-weight:700;margin-bottom:14px;">⏰ Set reminder</h3>
            <input type="datetime-local" id="reminderInput" value="${existingStr}"
                style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--content-bg);color:var(--text-primary);margin-bottom:12px;font-family:var(--font);outline:none;">
            <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" style="flex:1;" onclick="saveReminder('${paneUid}')">Set</button>
                ${existing ? `<button class="btn btn-danger" onclick="clearReminder('${paneUid}')">Clear</button>` : ''}
                <button class="btn" onclick="this.closest('[style]').remove()">Cancel</button>
            </div>
        </div>`;
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.remove(); });
    document.body.appendChild(dialog);
    document.getElementById('reminderInput').focus();
}

function saveReminder(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const val = document.getElementById('reminderInput').value;
    if (!val) return;
    const ts = new Date(val).getTime();
    localStorage.setItem(`synote_reminder_${pane.note.id}`, ts);
    document.querySelector('[style*="inset:0"]')?.remove();
    renderPaneContent(pane);
    scheduleReminderNotification(pane.note.id, pane.note.title, ts);
    showNotification('Reminder set', 'success');
}

function clearReminder(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    localStorage.removeItem(`synote_reminder_${pane.note.id}`);
    document.querySelector('[style*="inset:0"]')?.remove();
    renderPaneContent(pane);
    showNotification('Reminder cleared', 'info');
}

function scheduleReminderNotification(noteId, title, ts) {
    const delay = ts - Date.now();
    if (delay <= 0) return;
    setTimeout(async () => {
        if (Notification.permission === 'granted') {
            new Notification(`⏰ Reminder: ${title}`, { body: 'Your Synote reminder is due.', icon: '' });
        } else {
            showNotification(`⏰ Reminder: ${title}`, 'info');
        }
    }, delay);
}

function initReminders() {
    // Request notification permission
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
    // Re-schedule any pending reminders
    notes.forEach(note => {
        const ts = getReminder(note.id);
        if (ts && ts > Date.now()) scheduleReminderNotification(note.id, note.title, ts);
    });
}

// ════════════════════════════════════════════════════════════
// Inline table editor
// ════════════════════════════════════════════════════════════
function applyTableEditor(previewId, paneUid) {
    const preview = document.getElementById(previewId);
    if (!preview) return;
    preview.querySelectorAll('table td, table th').forEach(cell => {
        cell.style.cursor = 'text';
        cell.addEventListener('dblclick', e => {
            if (cell.classList.contains('editing')) return;
            const original = cell.textContent;
            cell.classList.add('editing');
            const input = document.createElement('input');
            input.type = 'text';
            input.value = original;
            cell.textContent = '';
            cell.appendChild(input);
            input.focus();
            input.select();

            const finish = async () => {
                const newVal = input.value;
                cell.classList.remove('editing');
                cell.textContent = newVal;
                if (newVal === original) return;
                // Update markdown source
                const pane = openPanes.find(p => p.uid === paneUid);
                if (!pane) return;
                const updated = pane.note.content.replace(
                    new RegExp(`(\\|[^|\\n]*\\|[^|\\n]*\\|[^\\n]*)${escapeRegex(original)}([^|\\n]*)`, 'g'),
                    `$1${newVal}$2`
                );
                if (updated === pane.note.content) return;
                try {
                    const res = await apiCall(`/notes/${pane.note.id}`, {
                        method: 'PUT', body: JSON.stringify({ title: pane.note.title, content: updated })
                    });
                    if (!res.ok) throw new Error();
                    const saved = await res.json();
                    noteCache.set(saved.id, saved); pane.note = saved; currentNote = saved;
                } catch { showNotification('Table save failed', 'error'); }
            };

            input.onblur = finish;
            input.onkeydown = e => {
                if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { input.value = original; input.blur(); }
            };
        });
    });
}

// ════════════════════════════════════════════════════════════
// Note duplication
// ════════════════════════════════════════════════════════════
async function duplicateNote(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const { note } = pane;
    try {
        const res = await apiCall('/notes', {
            method: 'POST',
            body: JSON.stringify({ title: `${note.title} (copy)`, content: note.content })
        });
        if (!res.ok) throw new Error();
        const dup = await res.json();
        noteCache.set(dup.id, dup);
        await loadNotes();
        loadNote(dup.id);
        showNotification('Note duplicated', 'success');
    } catch { showNotification('Failed to duplicate', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Drag-to-reorder panes
// ════════════════════════════════════════════════════════════
let dragPaneUid = null;

function paneDragStart(e, uid) {
    dragPaneUid = uid;
    e.dataTransfer.effectAllowed = 'move';
    document.getElementById(`pane-${uid}`)?.classList.add('dragging-pane');
}

function paneDragOver(e, uid) {
    if (!dragPaneUid || dragPaneUid === uid) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.getElementById(`pane-${uid}`)?.classList.add('drag-over');
}

function paneDragLeave(e, uid) {
    document.getElementById(`pane-${uid}`)?.classList.remove('drag-over');
}

function paneDrop(e, targetUid) {
    e.preventDefault();
    document.querySelectorAll('.note-pane').forEach(el => el.classList.remove('drag-over', 'dragging-pane'));
    if (!dragPaneUid || dragPaneUid === targetUid) { dragPaneUid = null; return; }

    const fromIdx = openPanes.findIndex(p => p.uid === dragPaneUid);
    const toIdx   = openPanes.findIndex(p => p.uid === targetUid);
    if (fromIdx === -1 || toIdx === -1) { dragPaneUid = null; return; }

    const [moved] = openPanes.splice(fromIdx, 1);
    openPanes.splice(toIdx, 0, moved);
    dragPaneUid = null;
    renderPanes();
}

// ════════════════════════════════════════════════════════════
// Smart URL paste in editor
// ════════════════════════════════════════════════════════════
function handleSmartPaste(event) {
    // First check for image paste
    const items = event.clipboardData?.items;
    if (items) {
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                event.preventDefault();
                insertImageFromFile(event.target, item.getAsFile());
                return;
            }
        }
    }

    // Smart URL paste: if clipboard text is a URL and there's selected text, wrap it
    const text = event.clipboardData?.getData('text') || '';
    const isUrl = /^https?:\/\/[^\s]+$/.test(text.trim());
    if (!isUrl) return; // let default paste handle it

    const textarea = event.target;
    const sel = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
    if (sel) {
        // Wrap selected text as [selected](url)
        event.preventDefault();
        insertAtCursor(textarea, `[${sel}](${text.trim()})`);
        updateModalPreview();
    } else {
        // No selection: paste as <url> (auto-linked)
        event.preventDefault();
        insertAtCursor(textarea, `<${text.trim()}>`);
        updateModalPreview();
    }
}
