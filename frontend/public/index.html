}

function cycleFontSize() {
    fontSizeStep = fontSizeStep >= 1 ? -1 : fontSizeStep + 1;
    localStorage.setItem('synote_fontsize', fontSizeStep);
    applyFontSize();
    showNotification(['Small', 'Default', 'Large'][fontSizeStep + 1] + ' font', 'info');
}

function applyDarkMode() {
    document.documentElement.classList.toggle('dark', darkMode);
    document.getElementById('darkToggle').textContent = darkMode ? '☀️' : '🌙';
}

function toggleDarkMode() {
    darkMode = !darkMode;
    localStorage.setItem('synote_dark', darkMode);
    applyDarkMode();
}

// ════════════════════════════════════════════════════════════
// API
// ════════════════════════════════════════════════════════════
async function apiCall(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
    if (res.status === 401) { showLoginModal(); throw new Error('Auth required'); }
    return res;
}

// ════════════════════════════════════════════════════════════
// Auth — login / register
// ════════════════════════════════════════════════════════════
let currentUser = JSON.parse(localStorage.getItem('synote_user') || 'null');

async function showLoginModal(forceTab) {
    if (document.getElementById('loginModal')) return;

    // Check if any users exist so we can default to the right tab
    let hasUsers = true;
    try {
        const st = await fetch(`${API_URL}/auth/status`);
        if (st.ok) hasUsers = (await st.json()).has_users;
    } catch { /* offline — assume users exist */ }

    const defaultTab = forceTab || (hasUsers ? 'login' : 'register');

    const inputStyle = 'width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;outline:none;font-family:inherit;color:var(--text-primary);background:var(--content-bg);margin-bottom:10px;';
    const modal = document.createElement('div');
    modal.id = 'loginModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:9000;backdrop-filter:blur(8px);';
    modal.innerHTML = `
        <div style="background:var(--content-bg);padding:32px 28px 28px;border-radius:14px;box-shadow:var(--shadow-lg);width:400px;max-width:92%;border:1px solid var(--border);">
            <div style="text-align:center;margin-bottom:22px;">
                <div style="font-size:26px;margin-bottom:4px;">📝</div>
                <h2 style="font-size:18px;font-weight:700;color:var(--text-primary);margin:0;">Synote</h2>
                <p style="font-size:12.5px;color:var(--text-muted);margin:4px 0 0;">Your personal knowledge base</p>
            </div>

            <!-- Tabs -->
            <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;">
                <button id="tabLogin" onclick="switchAuthTab('login')"
                    style="flex:1;padding:8px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;border-bottom:2px solid ${defaultTab==='login'?'var(--accent)':'transparent'};color:${defaultTab==='login'?'var(--accent)':'var(--text-muted)'};">
                    Sign In
                </button>
                <button id="tabRegister" onclick="switchAuthTab('register')"
                    style="flex:1;padding:8px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;border-bottom:2px solid ${defaultTab==='register'?'var(--accent)':'transparent'};color:${defaultTab==='register'?'var(--accent)':'var(--text-muted)'};">
                    Create Account
                </button>
            </div>

            <!-- Login form -->
            <div id="formLogin" style="display:${defaultTab==='login'?'block':'none'};">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" style="${inputStyle}">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" style="${inputStyle}">
                <button onclick="submitLogin()" style="width:100%;padding:11px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;margin-top:4px;">
                    Sign In
                </button>
            </div>

            <!-- Register form -->
            <div id="formRegister" style="display:${defaultTab==='register'?'block':'none'};">
                ${!hasUsers ? '<p style="font-size:12px;color:var(--accent);margin-bottom:10px;text-align:center;">No accounts yet — create the first one.</p>' : ''}
                <input type="text" id="regUsername" placeholder="Username" autocomplete="username" style="${inputStyle}">
                <input type="password" id="regPassword" placeholder="Password (min 6 chars)" autocomplete="new-password" style="${inputStyle}">
                <input type="password" id="regConfirm" placeholder="Confirm password" autocomplete="new-password" style="${inputStyle}">
                <button onclick="submitRegister()" style="width:100%;padding:11px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;margin-top:4px;">
                    Create Account
                </button>
            </div>

            <p id="authError" style="margin-top:12px;color:var(--danger);font-size:12.5px;text-align:center;display:none;"></p>
        </div>`;
    document.body.appendChild(modal);

    // Focus first input of active tab
    const firstInput = defaultTab === 'login'
        ? document.getElementById('loginUsername')
        : document.getElementById('regUsername');
    firstInput?.focus();

    // Enter key submits
    modal.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const loginVisible = document.getElementById('formLogin').style.display !== 'none';
        loginVisible ? submitLogin() : submitRegister();
    });
}

function switchAuthTab(tab) {
    document.getElementById('formLogin').style.display   = tab === 'login'    ? 'block' : 'none';
    document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tabLogin').style.borderBottomColor    = tab === 'login'    ? 'var(--accent)' : 'transparent';
    document.getElementById('tabRegister').style.borderBottomColor = tab === 'register' ? 'var(--accent)' : 'transparent';
    document.getElementById('tabLogin').style.color    = tab === 'login'    ? 'var(--accent)' : 'var(--text-muted)';
    document.getElementById('tabRegister').style.color = tab === 'register' ? 'var(--accent)' : 'var(--text-muted)';
    document.getElementById('authError').style.display = 'none';
    (tab === 'login' ? document.getElementById('loginUsername') : document.getElementById('regUsername'))?.focus();
}

function setAuthError(msg) {
    const el = document.getElementById('authError');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}

async function submitLogin() {
    const username = document.getElementById('loginUsername')?.value.trim();
    const password = document.getElementById('loginPassword')?.value;
    if (!username || !password) { setAuthError('Please fill in all fields.'); return; }
    try {
        const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
            const data = await res.json();
            onAuthSuccess(data.token, data.username);
        } else {
            const text = await res.text();
            setAuthError(text || 'Invalid username or password.');
        }
    } catch { setAuthError('Connection failed. Is the server running?'); }
}

async function submitRegister() {
    const username = document.getElementById('regUsername')?.value.trim();
    const password = document.getElementById('regPassword')?.value;
    const confirm  = document.getElementById('regConfirm')?.value;
    if (!username || !password) { setAuthError('Please fill in all fields.'); return; }
    if (password !== confirm) { setAuthError('Passwords do not match.'); return; }
    if (password.length < 6)  { setAuthError('Password must be at least 6 characters.'); return; }
    try {
        const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
            const data = await res.json();
            onAuthSuccess(data.token, data.username);
        } else if (res.status === 409) {
            setAuthError('Username already taken.');
        } else {
            const text = await res.text();
            setAuthError(text || 'Registration failed.');
        }
    } catch { setAuthError('Connection failed. Is the server running?'); }
}

function onAuthSuccess(token, username) {
    authToken = token;
    currentUser = { username };
    localStorage.setItem('synote_token', token);
    localStorage.setItem('synote_user', JSON.stringify({ username }));
    document.getElementById('loginModal')?.remove();
    updateUserDisplay();
    showNotification(`Welcome, ${username}!`, 'success');
    loadNotes();
}

function logout() {
    authToken = null;
    currentUser = null;
    localStorage.removeItem('synote_token');
    localStorage.removeItem('synote_user');
    updateUserDisplay();
    // Clear panes
    openPanes = [];
    document.getElementById('panesContainer').innerHTML = `
        <div class="empty-state"><h2>Welcome to Synote</h2><p>Sign in to access your notes.</p></div>`;
    document.getElementById('notesList').innerHTML = '';
    showLoginModal('login');
}

function updateUserDisplay() {
    const btn = document.getElementById('userMenuBtn');
    if (!btn) return;
    if (currentUser) {
        btn.textContent = currentUser.username.slice(0, 2).toUpperCase();
        btn.title = `Signed in as ${currentUser.username} — click to sign out`;
        btn.style.display = '';
    } else {
        btn.style.display = 'none';
    }
}

// Bulk select

let bulkSelected = new Set();

function toggleBulkSelect(noteId, el) {
    if (bulkSelected.has(noteId)) {
        bulkSelected.delete(noteId);
        el.classList.remove('bulk-selected');
    } else {
        bulkSelected.add(noteId);
        el.classList.add('bulk-selected');
    }
    const bar = document.getElementById('bulkBar');
    if (bulkSelected.size > 0) {
        bar.style.display = 'flex';
        document.getElementById('bulkCount').textContent = `${bulkSelected.size} selected`;
    } else {
        bar.style.display = 'none';
    }
}

// ════════════════════════════════════════════════════════════
// Right-click context menu
// ════════════════════════════════════════════════════════════
function showNoteContextMenu(event, noteId) {
    event.preventDefault();
    event.stopPropagation();
    document.getElementById('ctxMenu')?.remove();

    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    const isStarred = starredNotes.has(noteId);
    const isOpen = openPanes.some(p => p.note.id === noteId);

    const menu = document.createElement('div');
    menu.id = 'ctxMenu';
    menu.className = 'ctx-menu';
    menu.innerHTML = `
        <div class="ctx-item" onclick="loadNote('${noteId}')">📄 Open</div>
        ${!isOpen ? `<div class="ctx-item" onclick="loadNoteInNewPane('${noteId}')">➕ Open in new pane</div>` : ''}
        <div class="ctx-item" onclick="ctxDuplicate('${noteId}')">⧉ Duplicate</div>
        <div class="ctx-separator"></div>
        <div class="ctx-item" onclick="ctxRename('${noteId}')">✏️ Rename</div>
        <div class="ctx-item" onclick="ctxToggleStar('${noteId}')">${isStarred ? '☆ Unpin' : '⭐ Pin'}</div>
        <div class="ctx-item" onclick="pickNoteColor(event,'${noteId}')">🎨 Color label</div>
        <div class="ctx-separator"></div>
        <div class="ctx-item danger" onclick="ctxDelete('${noteId}')">🗑 Delete</div>
    `;

    // Position near cursor
    let x = event.clientX, y = event.clientY;
    document.body.appendChild(menu);
    const r = menu.getBoundingClientRect();
    if (x + r.width > window.innerWidth) x = window.innerWidth - r.width - 8;
    if (y + r.height > window.innerHeight) y = window.innerHeight - r.height - 8;
    menu.style.left = x + 'px'; menu.style.top = y + 'px';

    setTimeout(() => {
        const close = e => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } };
        document.addEventListener('click', close);
    }, 0);
}

async function loadNoteInNewPane(noteId) {
    document.getElementById('ctxMenu')?.remove();
    if (openPanes.length >= MAX_PANES) { showNotification('Maximum panes open', 'info'); return; }
    let note = noteCache.get(noteId) || notes.find(n => n.id === noteId);
    if (!note) return;
    const uid = makePaneUid();
    openPanes.push({ uid, note, history: [noteId], historyIdx: 0 });
    renderPanes();
}

async function ctxDuplicate(noteId) {
    document.getElementById('ctxMenu')?.remove();
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    try {
        const res = await apiCall('/notes', { method: 'POST', body: JSON.stringify({ title: `${note.title} (copy)`, content: note.content }) });
        if (!res.ok) throw new Error();
        const dup = await res.json();
        noteCache.set(dup.id, dup);
        await loadNotes();
        loadNote(dup.id);
        showNotification('Duplicated', 'success');
    } catch { showNotification('Failed', 'error'); }
}

async function ctxRename(noteId) {
    document.getElementById('ctxMenu')?.remove();
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    const newTitle = prompt('Rename note:', note.title);
    if (!newTitle || newTitle === note.title) return;
    try {
        const res = await apiCall(`/notes/${noteId}`, { method: 'PUT', body: JSON.stringify({ title: newTitle, content: note.content }) });
        if (!res.ok) throw new Error();
        const updated = await res.json();
        noteCache.set(updated.id, updated);
        await loadNotes();
        openPanes.filter(p => p.note.id === noteId).forEach(p => { p.note = updated; renderPaneContent(p); });
        showNotification('Renamed', 'success');
    } catch { showNotification('Failed', 'error'); }
}

function ctxToggleStar(noteId) {
    document.getElementById('ctxMenu')?.remove();
    if (starredNotes.has(noteId)) starredNotes.delete(noteId);
    else starredNotes.add(noteId);
    localStorage.setItem('synote_starred', JSON.stringify([...starredNotes]));
    renderNotesList();
}

async function ctxDelete(noteId) {
    document.getElementById('ctxMenu')?.remove();
    const note = notes.find(n => n.id === noteId);
    if (!confirm(`Delete "${note?.title || 'this note'}"?`)) return;
    try {
        await apiCall(`/notes/${noteId}`, { method: 'DELETE' });
        noteCache.delete(noteId);
        openPanes = openPanes.filter(p => p.note.id !== noteId);
        await loadNotes(); renderPanes();
        showNotification('Deleted', 'success');
    } catch { showNotification('Failed', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Note color labels
// ════════════════════════════════════════════════════════════
const NOTE_COLORS = ['#e5534b','#f5a623','#2ea043','#6d5ef5','#58a6ff','#db61a2','',''];
const NOTE_COLOR_NAMES = ['Red','Orange','Green','Purple','Blue','Pink','Clear',''];

function pickNoteColor(event, noteId) {
    event.stopPropagation();
    document.getElementById('colorPickerPopup')?.remove();
    const popup = document.createElement('div');
    popup.id = 'colorPickerPopup';
    popup.className = 'color-picker-popup';
    popup.innerHTML = NOTE_COLORS.map((c, i) => c
        ? `<button class="color-swatch ${noteColors[noteId]===c?'active':''}" style="background:${c};" title="${NOTE_COLOR_NAMES[i]}" onclick="setNoteColor('${noteId}','${c}')"></button>`
        : `<button class="color-swatch clear" title="Clear" onclick="setNoteColor('${noteId}','')">✕</button>`
    ).join('');
    const rect = event.target.getBoundingClientRect();
    popup.style.top = (rect.bottom + 4) + 'px';
    popup.style.left = rect.left + 'px';
    document.body.appendChild(popup);
    setTimeout(() => {
        const close = e => { if (!popup.contains(e.target)) { popup.remove(); document.removeEventListener('click', close); } };
        document.addEventListener('click', close);
    }, 0);
}

function setNoteColor(noteId, color) {
    if (color) noteColors[noteId] = color;
    else delete noteColors[noteId];
    localStorage.setItem('synote_colors', JSON.stringify(noteColors));
    document.getElementById('colorPickerPopup')?.remove();
    renderNotesList();
}

function handleNoteItemClick(event, noteId, el) {
    if (event.shiftKey || bulkSelected.size > 0 && event.metaKey) {
        event.preventDefault();
        toggleBulkSelect(noteId, el);
    } else if (bulkSelected.size > 0) {
        // If bulk mode active and no modifier, toggle this item
        toggleBulkSelect(noteId, el);
    } else {
        loadNote(noteId);
    }
}

function clearBulkSelect() {
    bulkSelected.clear();
    document.querySelectorAll('.note-item.bulk-selected').forEach(el => el.classList.remove('bulk-selected'));
    document.getElementById('bulkBar').style.display = 'none';
}

function bulkPin() {
    const count = bulkSelected.size;
    bulkSelected.forEach(id => starredNotes.add(id));
    localStorage.setItem('synote_starred', JSON.stringify([...starredNotes]));
    clearBulkSelect();
    renderNotesList();
    showNotification(`Pinned ${count} note${count !== 1 ? 's' : ''}`, 'success');
}

async function bulkDelete() {
    if (!confirm(`Delete ${bulkSelected.size} note(s)? This cannot be undone.`)) return;
    const ids = [...bulkSelected];
    clearBulkSelect();
    for (const id of ids) {
        try {
            await apiCall(`/notes/${id}`, { method: 'DELETE' });
            noteCache.delete(id);
            openPanes = openPanes.filter(p => p.note.id !== id);
        } catch { /* continue */ }
    }
    await loadNotes();
    renderPanes();
    showNotification('Deleted', 'success');
}

async function loadNotes() {
    try {
        const res = await apiCall('/notes');
        if (!res.ok) { if (res.status === 401 || res.status === 403) { showLoginModal(); return; } return; }
        notes = await res.json();
        renderNotesList();
    } catch { showLoginModal(); }
}

function getSortedNotes(arr) {
    const copy = [...arr];
    switch (sortOrder) {
        case 'title':   return copy.sort((a,b) => a.title.localeCompare(b.title));
        case 'created': return copy.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
        case 'viewed': {
            const order = recentlyViewed.map(r => r.id);
            return copy.sort((a,b) => {
                const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
                if (ai === -1 && bi === -1) return 0;
                if (ai === -1) return 1; if (bi === -1) return -1;
                return ai - bi;
            });
        }
        default: return copy.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
    }
}

function setSortOrder(order) {
    sortOrder = order;
    localStorage.setItem('synote_sort', order);
    renderNotesList();
}

function makeNoteItemHtml(note, active, extraHtml = '', showDate = true, titleHtmlOverride = null) {
    const color = noteColors[note.id];
    const dot = color ? `<span class="note-color-dot" style="background:${color};" onclick="pickNoteColor(event,'${note.id}')"></span>` : '';
    const titleHtml = titleHtmlOverride || escapeHtml(note.title || 'Untitled');
    const ageStr = showDate ? getAgeString(note.updated_at) : '';
    return `<div class="note-item ${active ? 'active' : ''} ${bulkSelected.has(note.id)?'bulk-selected':''}"
        onclick="handleNoteItemClick(event,'${note.id}',this)"
        oncontextmenu="showNoteContextMenu(event,'${note.id}')">
        <div class="note-item-title">${dot}${titleHtml}</div>
        ${extraHtml}
        ${showDate ? `<div class="note-item-date"><span>${new Date(note.updated_at).toLocaleDateString()}</span><span class="note-age">${ageStr}</span></div>` : ''}
    </div>`;
}

function getAgeString(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}d ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}mo ago`;
    return `${Math.floor(months / 12)}y ago`;
}

function renderNotesList() {
    const list = document.getElementById('notesList');
    const info = document.getElementById('searchInfo');
    const openIds = new Set(openPanes.map(p => p.note.id));
    const sorted = getSortedNotes(notes);
    const searchQuery = isSearching ? document.getElementById('searchInput')?.value.trim() : '';

    let html = '';

    if (!isSearching) {
        // Pinned section
        const pinned = sorted.filter(n => starredNotes.has(n.id));
        if (pinned.length > 0) {
            html += `<div class="list-section-label">⭐ Pinned</div>`;
            pinned.forEach(note => {
                html += makeNoteItemHtml(note, openIds.has(note.id));
            });
        }

        // Recently viewed section
        if (recentlyViewed.length > 0) {
            html += `<div class="list-section-label"${pinned.length ? ' style="margin-top:4px;"' : ''}>Recently viewed</div>`;
            recentlyViewed.slice(0, 5).forEach(r => {
                const note = notes.find(n => n.id === r.id);
                if (!note) return;
                html += makeNoteItemHtml(note, openIds.has(r.id), '', false);
            });
            html += `<div class="list-section-label" style="margin-top:4px;">All notes</div>`;
        }
    }

    if (sorted.length === 0 && isSearching) {
        html += `<div style="padding:16px;text-align:center;color:var(--sidebar-muted);font-size:12.5px;">No notes found</div>`;
    } else {
        sorted.forEach(note => {
            const active = openIds.has(note.id);
            const titleHtml = searchQuery ? highlightMatch(note.title || 'Untitled', searchQuery) : null;
            let snippetHtml = '';
            if (isSearching && searchQuery && note.content) {
                const titleMatch = (note.title || '').toLowerCase().includes(searchQuery.toLowerCase());
                const badge = titleMatch ? '' : `<span class="note-item-match-badge">content</span>`;
                const snippet = extractSnippet(note.content, searchQuery);
                snippetHtml = `<div class="note-item-snippet">${snippet}</div>${badge}`;
            }
            html += makeNoteItemHtml(note, active, snippetHtml, true, titleHtml);
        });
    }

    list.innerHTML = html;

    if (isSearching) {
        info.style.display = 'block';
        info.textContent = `${notes.length} note${notes.length !== 1 ? 's' : ''} found`;
    } else {
        info.style.display = 'none';
    }
}

function addToRecentlyViewed(note) {
    recentlyViewed = recentlyViewed.filter(r => r.id !== note.id);
    recentlyViewed.unshift({ id: note.id, title: note.title });
    if (recentlyViewed.length > 7) recentlyViewed = recentlyViewed.slice(0, 7);
    localStorage.setItem('synote_recent', JSON.stringify(recentlyViewed));
}

// ════════════════════════════════════════════════════════════
// Search
// ════════════════════════════════════════════════════════════
async function handleSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (searchTimeout) clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
        if (q === '') {
            isSearching = false;
            await loadNotes();
        } else {
            isSearching = true;
            try {
                const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}`);
                notes = await res.json();
                renderNotesList();
            } catch { showNotification('Search failed', 'error'); }
        }
    }, 280);
}

// ════════════════════════════════════════════════════════════
// Pane management
// ════════════════════════════════════════════════════════════
function makePaneUid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

async function loadNote(id) {
    // Already open? scroll to it
    const existing = openPanes.find(p => p.note.id === id);
    if (existing) {
        currentNote = existing.note;
        document.getElementById(`pane-${existing.uid}`)?.scrollIntoView({ behavior: 'smooth', inline: 'nearest' });
        renderNotesList();
        return;
    }
    try {
        const res = await apiCall(`/notes/${id}`);
        if (!res.ok) { if (res.status === 401) { showLoginModal(); return; } throw new Error(); }
        const note = await res.json();
        noteCache.set(note.id, note);
        currentNote = note;
        addToRecentlyViewed(note);
        const uid = makePaneUid();

        if (openPanes.length >= MAX_PANES) {
            // Replace the oldest non-minimized pane; fall back to oldest overall
            const oldest = openPanes.find(p => !p.minimized) || openPanes[0];
            openPanes.splice(openPanes.indexOf(oldest), 1, { uid, note, history: [note.id], historyIdx: 0, minimized: false });
            showNotification(`Replaced oldest pane (max ${MAX_PANES})`, 'info');
        } else {
            openPanes.push({ uid, note, history: [note.id], historyIdx: 0, minimized: false });
        }

        renderPanes();
        renderNotesList();
        closeMobileSidebar();
    } catch { showNotification('Failed to load note', 'error'); }
}

async function navigateInPane(paneUid, noteId) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    let note = noteCache.get(noteId);
    if (!note) {
        try {
            const res = await apiCall(`/notes/${noteId}`);
            if (!res.ok) return;
            note = await res.json();
            noteCache.set(note.id, note);
        } catch { return; }
    }
    // Update history
    pane.history = pane.history.slice(0, pane.historyIdx + 1);
    pane.history.push(noteId);
    pane.historyIdx = pane.history.length - 1;
    pane.note = note;
    pane.minimized = false; // auto-restore when navigating into a pane
    currentNote = note;
    addToRecentlyViewed(note);
    renderPaneContent(pane);
    renderNotesList();
}

async function goBack(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane || pane.historyIdx <= 0) return;
    pane.historyIdx--;
    const noteId = pane.history[pane.historyIdx];
    let note = noteCache.get(noteId);
    if (!note) {
        try {
            const res = await apiCall(`/notes/${noteId}`);
            note = await res.json();
            noteCache.set(noteId, note);
        } catch { return; }
    }
    pane.note = note;
    currentNote = note;
    renderPaneContent(pane);
    renderNotesList();
}

async function goForward(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane || pane.historyIdx >= pane.history.length - 1) return;
    pane.historyIdx++;
    const noteId = pane.history[pane.historyIdx];
    let note = noteCache.get(noteId);
    if (!note) {
        try {
            const res = await apiCall(`/notes/${noteId}`);
            note = await res.json();
            noteCache.set(noteId, note);
        } catch { return; }
    }
    pane.note = note;
    currentNote = note;
    renderPaneContent(pane);
    renderNotesList();
}

function closePane(paneUid) {
    const idx = openPanes.findIndex(p => p.uid === paneUid);
    if (idx === -1) return;
    stopFocusTimer(paneUid);
    openPanes.splice(idx, 1);
    currentNote = openPanes[openPanes.length - 1]?.note || null;
    renderPanes();
    renderNotesList();
}

function toggleMinimizePane(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    pane.minimized = !pane.minimized;
    // Rebuild just this pane's shell in place
    const el = document.getElementById(`pane-${paneUid}`);
    if (!el) return;
    const newShell = document.createElement('div');
    newShell.innerHTML = buildPaneShell(pane);
    const newPane = newShell.firstElementChild;
    el.replaceWith(newPane);
    if (!pane.minimized) populatePaneBody(pane);
    // Re-attach resize handles after DOM change
    addPaneResizeHandles();
}

let maximizedPaneUid = null;

function toggleMaximizePane(paneUid) {
    const container = document.getElementById('panesContainer');
    if (maximizedPaneUid === paneUid) {
        // Restore
        maximizedPaneUid = null;
        document.getElementById(`pane-${paneUid}`)?.classList.remove('pane-maximized');
        container?.classList.remove('has-maximized');
    } else {
        // Un-maximize previous if any
        if (maximizedPaneUid) {
            document.getElementById(`pane-${maximizedPaneUid}`)?.classList.remove('pane-maximized');
        }
        maximizedPaneUid = paneUid;
        document.getElementById(`pane-${paneUid}`)?.classList.add('pane-maximized');
        container?.classList.add('has-maximized');
    }
}

function savePaneState() {
    const state = openPanes.map(p => ({ noteId: p.note.id, minimized: p.minimized || false }));
    localStorage.setItem('synote_open_panes', JSON.stringify(state));
}

async function restorePaneState() {
    try {
        const saved = JSON.parse(localStorage.getItem('synote_open_panes') || '[]');
        if (!saved.length) return;
        for (const { noteId, minimized } of saved.slice(0, MAX_PANES)) {
            let note = noteCache.get(noteId) || notes.find(n => n.id === noteId);
            if (!note) {
                try {
                    const res = await apiCall(`/notes/${noteId}`);
                    if (res.ok) { note = await res.json(); noteCache.set(note.id, note); }
                } catch { continue; }
            }
            if (!note) continue;
            if (openPanes.some(p => p.note.id === noteId)) continue;
            const uid = makePaneUid();
            openPanes.push({ uid, note, history: [noteId], historyIdx: 0, minimized });
        }
        if (openPanes.length > 0) renderPanes();
    } catch { /* ignore */ }
}

function renderPanes() {
    const container = document.getElementById('panesContainer');
    if (!container) return;
    savePaneState();
    const isMobile = window.innerWidth <= 768;
    if (openPanes.length === 0) {
        container.innerHTML = `<div class="empty-state">
            <h2>Welcome to Synote</h2>
            <p>${isMobile ? 'Swipe right to open notes' : 'Click a note in the sidebar to open it'}<br>
            <span style="font-size:12px;opacity:0.7;">${isMobile ? '' : 'Press <kbd style="background:var(--border-light);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:monospace;">⌘K</kbd> for command palette'}</span></p>
        </div>`;
        return;
    }
    container.innerHTML = openPanes.map(pane => buildPaneShell(pane)).join('');
    openPanes.forEach(pane => populatePaneBody(pane));
    addPaneResizeHandles();
    updateMobileBottomBar();
}

function buildPaneShell(pane) {
    const { uid, note, historyIdx, history, minimized } = pane;
    const canBack  = historyIdx > 0;
    const canFwd   = historyIdx < history.length - 1;
    const updated  = new Date(note.updated_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const minIcon  = minimized ? '⊡' : '⊟';
    const minTitle = minimized ? 'Restore pane' : 'Minimize pane';
    const isStarred = starredNotes.has(note.id);
    const isLocked  = lockedNotes.has(note.id);
    return `
    <div class="note-pane ${minimized ? 'minimized' : ''} ${isLocked ? 'locked' : ''}" id="pane-${uid}">
        <div class="pane-topbar" draggable="true"
             ondragstart="paneDragStart(event,'${uid}')"
             ondragover="paneDragOver(event,'${uid}')"
             ondragleave="paneDragLeave(event,'${uid}')"
             ondrop="paneDrop(event,'${uid}')">
            <button class="hamburger-btn" onclick="openMobileSidebar()" title="Open notes">☰</button>
            <button class="pane-nav-btn" onclick="goBack('${uid}')" ${canBack ? '' : 'disabled'} title="Go back">←</button>
            <button class="pane-nav-btn" onclick="goForward('${uid}')" ${canFwd ? '' : 'disabled'} title="Go forward">→</button>
            <span class="pane-title-label" title="${escapeHtml(note.title)}" ondblclick="startRenameInPane('${uid}')">${escapeHtml(note.title)}</span>
            <div class="pane-topbar-actions">
                <span style="font-size:11px;color:var(--text-muted);">${updated}</span>
                <button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar('${note.id}',event)" title="${isStarred ? 'Unstar' : 'Star note'}">${isStarred ? '⭐' : '☆'}</button>
                <button class="btn-icon" onclick="duplicateNote('${uid}')" title="Duplicate note">⧉</button>
                <button class="btn-icon" onclick="editReminder('${uid}')" title="Set reminder">⏰</button>
                <button class="btn-icon lock-btn" onclick="toggleLockNote('${note.id}')" title="${isLocked ? 'Unlock note' : 'Lock note'}">${isLocked ? '🔒' : '🔓'}</button>
                <button class="btn-icon" onclick="showNoteStats('${uid}')" title="Note stats">📊</button>
                <button class="btn-icon" onclick="toggleFindBar('${uid}')" title="Find in note (⌘F)">🔍</button>
                <button class="btn btn-primary" style="font-size:11.5px;padding:3px 9px;${isLocked ? 'opacity:0.4;pointer-events:none;' : ''}" onclick="openEditorModal('${uid}')">Edit</button>
                <div style="position:relative;" id="delete-wrap-${uid}">
                    <button class="btn-icon" onclick="confirmDeleteNote('${uid}')" title="Delete note" style="color:var(--danger);">🗑</button>
                </div>
                <div class="export-wrap" id="export-${uid}">
                    <button class="btn-icon" onclick="toggleExportMenu('${uid}')" title="Export">⬇</button>
                    <div class="export-menu">
                        <button class="export-item" onclick="exportMarkdown('${uid}')">📄 Markdown</button>
                        <button class="export-item" onclick="exportHTML('${uid}')">🌐 HTML</button>
                        <button class="export-item" onclick="copyPermalink('${uid}')">🔗 Copy link</button>
                        <button class="export-item" onclick="exportPDF('${uid}')">🖨 Print / PDF</button>
                    </div>
                </div>
                <button class="minimize-btn" onclick="toggleMinimizePane('${uid}')" title="${minTitle}">${minIcon}</button>
                <button class="btn-icon" onclick="toggleMaximizePane('${uid}')" title="Maximize pane (⌘M)">⤢</button>
                <button class="btn-icon" onclick="closePane('${uid}')" title="Close pane">✕</button>
            </div>
        </div>
        <div class="pane-progress" id="pane-progress-${uid}"></div>
        <div class="pane-body" id="pane-body-${uid}">
            <div style="color:var(--text-muted);font-size:13px;padding:40px 0;text-align:center;">Loading…</div>
        </div>
    </div>`;
}

function renderPaneContent(pane) {
    // Rebuild just this pane's shell (updates nav buttons) then populate
    const el = document.getElementById(`pane-${pane.uid}`);
    if (!el) return;
    el.outerHTML = buildPaneShell(pane);
    populatePaneBody(pane);
    updateMobileBottomBar();
}

function populatePaneBody(pane) {
    const { uid, note } = pane;
    const body = document.getElementById(`pane-body-${uid}`);
    if (!body) return;

    const toc = buildTOC(note.content, uid);
    const tocHtml = toc.length >= 3 ? renderTOCHtml(toc, uid) : '';
    const wc = getWordCount(note.content);
    const readMin = Math.max(1, Math.round(wc / 200));

    const reminder = getReminder(note.id);
    const reminderBadge = reminder
        ? `<span class="reminder-badge" onclick="editReminder('${uid}')" title="Reminder set">⏰ ${new Date(reminder).toLocaleDateString()}</span>`
        : '';

    body.innerHTML = `
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;">
            <div class="pane-note-title">${escapeHtml(note.title)}</div>
            ${reminderBadge}
        </div>
        <div class="tags-display" id="tags-${uid}"></div>
        ${tocHtml}
        <div class="preview-content" id="preview-${uid}"></div>
        <div class="pane-mini-graph" id="mini-graph-${uid}">
            <div class="pane-mini-graph-title">Connections</div>
            <svg id="mini-svg-${uid}"></svg>
        </div>
        <div class="pane-backlinks-section">
            <div class="pane-backlinks-title">Linked References</div>
            <div id="backlinks-${uid}"><div style="font-size:12.5px;color:var(--text-muted);">Loading…</div></div>
        </div>`;

    // Locked banner
    if (lockedNotes.has(note.id)) {
        const banner = document.createElement('div');
        banner.className = 'locked-banner';
        banner.textContent = '🔒 Read-only — unlock to edit';
        body.before(banner);
    }

    // Word count footer + focus timer
    const footer = document.createElement('div');
    footer.className = 'pane-footer';
    const charCount = note.content.length;
    footer.innerHTML = `<span class="wc-toggle" onclick="toggleWordCharCount(this,${wc},${charCount})" title="Click to toggle">${wc.toLocaleString()} words</span><span>·</span><span>${readMin} min read</span><span>·</span><span class="focus-timer" id="timer-${uid}">0:00</span>`;
    body.parentElement.appendChild(footer);

    // Start focus timer for this pane
    startFocusTimer(uid);

    renderMarkdownInto(`preview-${uid}`, note.content, uid);
    updateTagsDisplayFor(`tags-${uid}`, note.content, uid);
    loadAndRenderBacklinksFor(uid, note.id);
    loadMiniGraph(uid, note.id);
    applyTableEditor(`preview-${uid}`, uid);

    // Reading progress bar + scrollspy TOC
    const progressBar = document.getElementById(`pane-progress-${uid}`);
    body.addEventListener('scroll', () => {
        if (progressBar) {
            const pct = body.scrollHeight <= body.clientHeight ? 0
                : (body.scrollTop / (body.scrollHeight - body.clientHeight)) * 100;
            progressBar.style.width = pct + '%';
        }
        // Scrollspy: highlight active TOC item
        const headings = body.querySelectorAll('[id^="h-"]');
        if (headings.length === 0) return;
        let active = headings[0].id;
        headings.forEach(h => {
            if (h.offsetTop - body.scrollTop <= 60) active = h.id;
        });
        document.querySelectorAll(`#toc-${uid} .toc-item`).forEach(item => {
            const isActive = item.getAttribute('onclick')?.includes(`'${active}'`);
            item.classList.toggle('toc-active', !!isActive);
        });
    }, { passive: true });
}

// ════════════════════════════════════════════════════════════
// Table of Contents
// ════════════════════════════════════════════════════════════
function buildTOC(content, paneUid) {
    const regex = /^(#{1,4})\s+(.+)$/gm;
    const items = [];
    let m;
    while ((m = regex.exec(content)) !== null) {
        items.push({ level: m[1].length, text: m[2].trim(), id: 'h-' + paneUid + '-' + items.length });
    }
    return items;
}

function renderTOCHtml(items, paneUid) {
    const links = items.map(item =>
        `<span class="toc-item" data-level="${item.level}" onclick="scrollToHeading('${paneUid}','${item.id}')">${escapeHtml(item.text)}</span>`
    ).join('');
    return `<div class="pane-toc" id="toc-${paneUid}">
        <div class="pane-toc-header" onclick="toggleTOC('${paneUid}')">
            <span class="pane-toc-label">On this page</span>
            <span class="pane-toc-arrow">▾</span>
        </div>
        <div class="pane-toc-list">${links}</div>
    </div>`;
}

function toggleTOC(paneUid) {
    document.getElementById(`toc-${paneUid}`)?.classList.toggle('collapsed');
}

function scrollToHeading(paneUid, headingId) {
    const body = document.getElementById(`pane-body-${paneUid}`);
    const el = body?.querySelector(`#${headingId}`);
    if (el) {
        body.scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
    }
}

// ════════════════════════════════════════════════════════════
// Markdown rendering
// ════════════════════════════════════════════════════════════
function configureMarked(paneUid) {
    const renderer = new marked.Renderer();

    renderer.blockquote = function(quote) {
        // Check for callout syntax: > [!TYPE]
        const match = quote.match(/^\s*<p>\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\](.*?)<\/p>/si);
        if (match) {
            const type  = match[1].toLowerCase();
            const icons = { note:'💡', tip:'✅', warning:'⚠️', important:'🔴', caution:'🔥' };
            const labels = { note:'Note', tip:'Tip', warning:'Warning', important:'Important', caution:'Caution' };
            const body  = quote.replace(/^\s*<p>\[!(?:NOTE|TIP|WARNING|IMPORTANT|CAUTION)\].*?<\/p>/si, '').trim();
            return `<div class="callout ${type}">
                <div class="callout-title">${icons[type]} ${labels[type]}</div>
                ${body ? `<div class="callout-body">${body}</div>` : ''}
            </div>`;
        }
        return `<blockquote>${quote}</blockquote>`;
    };

    const headingCounts = {};
    renderer.heading = function(text, level) {
        const key = text.toLowerCase();
        headingCounts[key] = (headingCounts[key] || 0) + 1;
        const id = paneUid
            ? 'h-' + paneUid + '-' + (Object.keys(headingCounts).indexOf(key))
            : 'h-' + key.replace(/[^\w]+/g, '-');
        return `<h${level} id="${id}">${text}</h${level}>`;
    };
    renderer.code = function(code, lang) {
        let highlighted;
        if (lang && hljs.getLanguage(lang)) {
            try { highlighted = hljs.highlight(code, { language: lang }).value; } catch { highlighted = escapeHtml(code); }
        } else {
            highlighted = hljs.highlightAuto(code).value;
        }
        const langLabel = lang ? `<span class="code-lang">${escapeHtml(lang)}</span>` : '';
        const id = 'cb-' + Math.random().toString(36).slice(2, 8);
        // Add line numbers
        const lines = highlighted.split('\n');
        const numbered = lines.map((line, i) =>
            `<span class="code-line"><span class="line-num">${i + 1}</span>${line}</span>`
        ).join('\n');
        return `<div class="code-block-wrap">
            <div class="code-block-header">
                ${langLabel}
                <button class="copy-code-btn" onclick="copyCode('${id}')" title="Copy">⧉ Copy</button>
            </div>
            <pre id="${id}"><code class="hljs ${lang ? 'language-' + lang : ''}">${numbered}</code></pre>
        </div>`;
    };

    marked.setOptions({ breaks: true, gfm: true, renderer });
}

async function openDailyNote() {
    const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
    // Find existing note with today's date as title
    let note = notes.find(n => n.title === today || n.title.startsWith(today));
    if (note) {
        loadNote(note.id);
        showNotification('Daily note', 'info');
        return;
    }
    // Create new daily note from template
    const tpl = NOTE_TEMPLATES.find(t => t.id === 'daily');
    const content = tpl ? tpl.content : '';
    try {
        const res = await apiCall('/notes', { method: 'POST', body: JSON.stringify({ title: today, content }) });
        if (!res.ok) throw new Error();
        note = await res.json();
        noteCache.set(note.id, note);
        await loadNotes();
        loadNote(note.id);
        showNotification(`Daily note for ${today}`, 'success');
    } catch { showNotification('Failed to create daily note', 'error'); }
}

// Stub functions for features not in this version
function toggleFolderView() {
    showNotification('Folder view not available in this version', 'info');
}

function toggleTagCloud() {
    showNotification('Tag cloud not available in this version', 'info');
}

function copyCode(preId) {
    const pre = document.getElementById(preId);
    if (!pre) return;
    // Extract text without line numbers
    const lines = [...pre.querySelectorAll('.code-line')];
    const text = lines.map(l => l.childNodes[1]?.textContent || '').join('\n');
    navigator.clipboard.writeText(text).then(() => showNotification('Copied!', 'success'));
}

function renderMarkdownInto(elementId, content, paneUid) {
    const el = document.getElementById(elementId);
    if (!el) return;
    configureMarked(paneUid);
    // Process note embeds ![[Title]] before rendering
    const processed = processNoteEmbeds(content || '', paneUid);
    el.innerHTML = renderWikilinks(marked.parse(processed), paneUid);
    applyCallouts(el);
    applyFoldableHeadings(el);
    applyCheckboxToggle(el, paneUid);
    // Async: fill embed placeholders
    resolveEmbedPlaceholders(el, paneUid);
}

function processNoteEmbeds(content, paneUid) {
    // Replace ![[Title]] with a placeholder; actual content filled async
    return content.replace(/!\[\[([^\]]+)\]\]/g, (match, title) => {
        const safe = title.replace(/"/g, '&quot;');
        return `<div class="note-embed-placeholder" data-title="${safe}" data-pane="${paneUid||''}">⏳ Embedding: ${escapeHtml(title)}</div>`;
    });
}

async function resolveEmbedPlaceholders(container, paneUid) {
    const placeholders = container.querySelectorAll('.note-embed-placeholder');
    for (const ph of placeholders) {
        const title = ph.dataset.title;
        const note = notes.find(n => n.title === title);
        if (!note) {
            ph.innerHTML = `<div class="note-embed broken">⚠ Note not found: ${escapeHtml(title)}</div>`;
            continue;
        }
        try {
            let n = noteCache.get(note.id);
            if (!n) {
                const res = await apiCall(`/notes/${note.id}`);
                if (!res.ok) throw new Error();
                n = await res.json();
                noteCache.set(n.id, n);
            }
            configureMarked(paneUid);
            const html = marked.parse(n.content || '');
            ph.outerHTML = `<div class="note-embed">
                <div class="note-embed-title">📄 ${escapeHtml(n.title)}</div>
                <div class="note-embed-body">${html}</div>
            </div>`;
        } catch {
            ph.innerHTML = `<div class="note-embed broken">⚠ Failed to load: ${escapeHtml(title)}</div>`;
        }
    }
}

// ════════════════════════════════════════════════════════════
// Wikilinks
// ════════════════════════════════════════════════════════════
function parseWikilinks(text) {
    const re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
    const links = [];
    let m;
    while ((m = re.exec(text)) !== null) {
        const full = m[1].trim();
        const hi = full.indexOf('#');
        links.push({
            fullMatch: m[0],
            targetTitle: hi >= 0 ? full.slice(0, hi).trim() : full,
            displayText: m[2]?.trim() || (hi >= 0 ? full.slice(0, hi).trim() : full),
            start: m.index, end: m.index + m[0].length
        });
    }
    return links;
}

function findNoteByTitle(title) {
    return notes.find(n => n.title.toLowerCase() === title.toLowerCase());
}

function renderWikilinks(content, paneUid) {
    const links = parseWikilinks(content);
    let result = content;
    for (let i = links.length - 1; i >= 0; i--) {
        const link = links[i];
        const target = findNoteByTitle(link.targetTitle);
        let replacement;
        if (target) {
            const nav = paneUid
                ? `navigateInPane('${paneUid}','${target.id}')`
                : `loadNote('${target.id}')`;
            replacement = `<a href="#" class="wikilink"
                onmouseenter="showWikilinkPreview(event,'${escapeHtml(target.title).replace(/'/g,"\\'")}','${target.id}')"
                onmousemove="moveWikilinkPreview(event)"
                onmouseleave="hideWikilinkPreview()"
                onclick="${nav};return false;">${escapeHtml(link.displayText)}</a>`;
        } else {
            replacement = `<a href="#" class="wikilink broken"
                title="Note not found — click to create"
                onclick="createNoteFromLink('${link.targetTitle.replace(/'/g,"\\'")}');return false;">${escapeHtml(link.displayText)}</a>`;
        }
        result = result.slice(0, link.start) + replacement + result.slice(link.end);
    }
    return result;
}

async function createNoteFromLink(title) {
    try {
        const res = await apiCall('/notes', {
            method: 'POST',
            body: JSON.stringify({ title, content: '' })
        });
        const note = await res.json();
        notes.push(note);
        await loadNotes();
        loadNote(note.id);
        showNotification(`Created: ${title}`, 'success');
    } catch { showNotification('Failed to create note', 'error'); }
}

// Hover Preview
// ════════════════════════════════════════════════════════════
let previewTimeout = null;

function showWikilinkPreview(event, title, noteId) {
    clearTimeout(previewTimeout);
    previewTimeout = setTimeout(async () => {
        const preview = document.getElementById('wikilinkPreview');
        document.getElementById('wpTitle').textContent = title;
        const body = document.getElementById('wpBody');

        let note = noteCache.get(noteId);
        if (!note) {
            body.textContent = 'Loading…';
            preview.classList.add('visible');
            positionPreview(preview, event);
            try {
                const res = await apiCall(`/notes/${noteId}`);
                if (res.ok) { note = await res.json(); noteCache.set(note.id, note); }
            } catch {}
        }

        if (note) {
            // Render first ~600 chars of content as markdown
            const excerpt = note.content.slice(0, 600) + (note.content.length > 600 ? '\n\n…' : '');
            configureMarked(null);
            body.innerHTML = marked.parse(excerpt);
        } else {
            body.textContent = 'Click to open';
        }
        positionPreview(preview, event);
        preview.classList.add('visible');
    }, 380);
}

function moveWikilinkPreview(event) {
    const preview = document.getElementById('wikilinkPreview');
    if (preview.classList.contains('visible')) positionPreview(preview, event);
}

function positionPreview(el, event) {
    const x = event.clientX + 14;
    const y = event.clientY + 14;
    const maxX = window.innerWidth - el.offsetWidth - 16;
    const maxY = window.innerHeight - el.offsetHeight - 16;
    el.style.left = Math.min(x, maxX) + 'px';
    el.style.top  = Math.min(y, maxY) + 'px';
}

function hideWikilinkPreview() {
    clearTimeout(previewTimeout);
    document.getElementById('wikilinkPreview').classList.remove('visible');
}

// ════════════════════════════════════════════════════════════
// Tags
// ════════════════════════════════════════════════════════════
function extractTags(content) {
    const re = /(?<![a-zA-Z0-9])#([a-zA-Z0-9_\-/]+)/g;
    const hex = /^#[a-fA-F0-9]{3,6}$/;
    const tags = new Set();
    let m;
    while ((m = re.exec(content)) !== null) {
        if (!hex.test('#' + m[1])) tags.add(m[1].toLowerCase());
    }
    return [...tags];
}

function updateTagsDisplayFor(elId, content, paneUid) {
    const el = document.getElementById(elId);
    if (!el) return;
    const tags = extractTags(content);
    el.innerHTML = tags.map(t =>
        `<span class="tag">#${escapeHtml(t)}<span class="tag-remove" onclick="removeTagFromPane('${paneUid}','${t.replace(/'/g,"\\'")}',event)" title="Remove tag">✕</span></span>`
    ).join('') + (paneUid ? `<button class="tag-add-btn" onclick="startAddTag('${paneUid}')">+ tag</button>` : '');
}

async function removeTagFromPane(paneUid, tag, e) {
    e?.stopPropagation();
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const re = new RegExp(`(?<![a-zA-Z0-9])#${escapeRegex(tag)}(?![a-zA-Z0-9_\\-/])`, 'g');
    const newContent = pane.note.content.replace(re, '').replace(/[ \t]+\n/g, '\n').trim();
    try {
        const res = await apiCall(`/notes/${pane.note.id}`, {
            method: 'PUT', body: JSON.stringify({ title: pane.note.title, content: newContent })
        });
        if (!res.ok) throw new Error();
        const updated = await res.json();
        noteCache.set(updated.id, updated); pane.note = updated; currentNote = updated;
        renderPaneContent(pane);
    } catch { showNotification('Failed to remove tag', 'error'); }
}

function startAddTag(paneUid) {
    const tagsEl = document.getElementById(`tags-${paneUid}`);
    if (!tagsEl) return;
    // Replace "+ tag" button with input
    const addBtn = tagsEl.querySelector('.tag-add-btn');
    if (!addBtn) return;
    const input = document.createElement('input');
    input.className = 'tag-inline-input';
    input.placeholder = 'tag name…';
    addBtn.replaceWith(input);
    input.focus();
    const finish = async () => {
        const tag = input.value.trim().replace(/^#/, '').replace(/\s+/g, '-');
        if (tag) {
            const pane = openPanes.find(p => p.uid === paneUid);
            if (pane) {
                const newContent = pane.note.content.trimEnd() + `\n\nTags: #${tag}`;
                try {
                    const res = await apiCall(`/notes/${pane.note.id}`, {
                        method: 'PUT', body: JSON.stringify({ title: pane.note.title, content: newContent })
                    });
                    if (!res.ok) throw new Error();
                    const updated = await res.json();
                    noteCache.set(updated.id, updated); pane.note = updated; currentNote = updated;
                    renderPaneContent(pane);
                } catch { showNotification('Failed to add tag', 'error'); }
            }
        } else {
            updateTagsDisplayFor(`tags-${paneUid}`, openPanes.find(p=>p.uid===paneUid)?.note.content || '', paneUid);
        }
    };
    input.onblur = finish;
    input.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = ''; input.blur(); }
    };
}

async function filterByTag(tag) {
    isSearching = true;
    try {
        const res = await apiCall(`/tags/${encodeURIComponent(tag)}/notes`);
        notes = await res.json();
        renderNotesList();
        showNotification(`#${tag}`, 'info');
    } catch { showNotification('Filter failed', 'error'); }
}

// Backlinks (per pane)
// ════════════════════════════════════════════════════════════
async function loadBacklinks(noteId) {
    try {
        const res = await apiCall(`/notes/${noteId}/links`);
        return res.ok ? await res.json() : null;
    } catch { return null; }
}

async function loadAndRenderBacklinksFor(paneUid, noteId) {
    const data = await loadBacklinks(noteId);
    const container = document.getElementById(`backlinks-${paneUid}`);
    if (!container) return;

    if (!data || (!data.outgoing?.length && !data.incoming?.length)) {
        container.innerHTML = '<div class="no-backlinks">No links to or from this note</div>';
        return;
    }

    let html = '';
    if (data.incoming?.length) {
        html += `<div class="backlinks-section"><div class="backlinks-section-title">Links to this note</div>`;
        html += data.incoming.map(l => {
            const cached = noteCache.get(l.target_id);
            const excerpt = cached ? getBacklinkExcerpt(cached.content, l.display_text) : '';
            return `<div class="backlink-item" onclick="navigateInPane('${paneUid}','${l.target_id}')">
                <div class="backlink-title">${escapeHtml(l.display_text)}</div>
                ${excerpt ? `<div class="note-item-snippet" style="padding-left:0;">${excerpt}</div>` : ''}
             </div>`;
        }).join('') + '</div>';
    }
    if (data.outgoing?.length) {
        html += `<div class="backlinks-section"><div class="backlinks-section-title">Links from this note</div>`;
        html += data.outgoing.map(l => l.exists
            ? `<div class="backlink-item" onclick="navigateInPane('${paneUid}','${l.target_id || ''}')">
                   <div class="backlink-title">${escapeHtml(l.display_text)}</div>
               </div>`
            : `<div class="backlink-item broken" onclick="createNoteFromLink('${l.target_title.replace(/'/g,"\\'")}')">
                   <div class="backlink-title">${escapeHtml(l.display_text)} <span style="color:var(--danger);font-size:10.5px;">+create</span></div>
               </div>`
        ).join('') + '</div>';
    }
    container.innerHTML = html;
}

function updateModalPreview() {

async function saveFromModal(silent = false) {

// ════════════════════════════════════════════════════════════
// Image paste & drag-drop in editor
// ════════════════════════════════════════════════════════════
function handleImagePaste(event) {
    const items = event.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
        if (item.type.startsWith('image/')) {
            event.preventDefault();
            const file = item.getAsFile();
            insertImageFromFile(event.target, file);
            break;
        }
    }
}

function handleImageDrop(event) {
    event.preventDefault();
    const file = event.dataTransfer.files[0];
    if (file?.type.startsWith('image/')) {
        insertImageFromFile(document.getElementById('modalContent'), file);
    }
}

function insertImageFromFile(textarea, file) {
    const reader = new FileReader();
    reader.onload = e => {
        const markdown = `![${file.name}](${e.target.result})`;
        insertAtCursor(textarea, markdown);
        updateModalPreview();
    };
    reader.readAsDataURL(file);
}

// ════════════════════════════════════════════════════════════
// Markdown toolbar helpers
// ════════════════════════════════════════════════════════════
function wrapSelection(before, after, placeholder) {
    const ta = document.getElementById('modalContent');
    if (!ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.slice(start, end) || placeholder;
    const replacement = before + sel + after;
    ta.value = ta.value.slice(0, start) + replacement + ta.value.slice(end);
    ta.selectionStart = start + before.length;
    ta.selectionEnd = start + before.length + sel.length;
    ta.focus();
    updateModalPreview();
}

function insertHeading() {
    const ta = document.getElementById('modalContent');
    if (!ta) return;
    const pos = ta.selectionStart;
    const lineStart = ta.value.lastIndexOf('\n', pos - 1) + 1;
    const line = ta.value.slice(lineStart, ta.value.indexOf('\n', pos) === -1 ? undefined : ta.value.indexOf('\n', pos));
    const m = line.match(/^(#{1,5})\s/);
    const prefix = m ? (m[1].length < 5 ? m[1] + '# ' : '## ') : '## ';
    if (m) {
        ta.value = ta.value.slice(0, lineStart) + prefix + line.slice(m[0].length) + ta.value.slice(lineStart + line.length);
    } else {
        ta.value = ta.value.slice(0, lineStart) + '## ' + ta.value.slice(lineStart);
    }
    ta.focus(); updateModalPreview();
}

function insertListItem() {
    const ta = document.getElementById('modalContent');
    if (!ta) return;
    const pos = ta.selectionStart;
    const newline = ta.value.lastIndexOf('\n', pos - 1) === pos - 1 ? '' : '\n';
    insertAtCursor(ta, newline + '- ');
    updateModalPreview();
}

function insertCheckbox() {
    const ta = document.getElementById('modalContent');
    if (!ta) return;
    const pos = ta.selectionStart;
    const newline = ta.value.lastIndexOf('\n', pos - 1) === pos - 1 ? '' : '\n';
    insertAtCursor(ta, newline + '- [ ] ');
    updateModalPreview();
}

function insertLink() {
    const ta = document.getElementById('modalContent');
    if (!ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.slice(start, end);
    if (sel) {
        ta.value = ta.value.slice(0, start) + `[${sel}](url)` + ta.value.slice(end);
        ta.selectionStart = start + sel.length + 3;
        ta.selectionEnd = start + sel.length + 6;
    } else {
        insertAtCursor(ta, '[text](url)');
    }
    ta.focus(); updateModalPreview();
}

function insertCodeBlock() {
    const ta = document.getElementById('modalContent');
    if (!ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.slice(start, end);
    const block = `\`\`\`\n${sel || 'code here'}\n\`\`\``;
    ta.value = ta.value.slice(0, start) + block + ta.value.slice(end);
    ta.selectionStart = start + 4;
    ta.selectionEnd = start + 4 + (sel || 'code here').length;
    ta.focus(); updateModalPreview();
}

function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
}

// Tag cloud panel
// ════════════════════════════════════════════════════════════
async function toggleTagCloud() {
    const panel = document.getElementById('tagCloudPanel');
    const btn = document.getElementById('tagCloudBtn');
    if (!panel) return;
    if (panel.style.display !== 'none') {
        panel.style.display = 'none';
        btn?.classList.remove('active');
        return;
    }
    btn?.classList.add('active');
    panel.style.display = 'flex';
    panel.innerHTML = '<span style="font-size:11px;color:var(--text-muted);padding:4px;">Loading…</span>';
    try {
        const res = await apiCall('/tags');
        if (!res.ok) throw new Error();
        const tags = await res.json();
        if (!tags.length) { panel.innerHTML = '<span style="font-size:11px;color:var(--text-muted);">No tags yet</span>'; return; }
        // Sort by count, compute relative sizes
        const sorted = [...tags].sort((a,b) => (b.count||0)-(a.count||0));
        const maxCount = sorted[0]?.count || 1;
        panel.innerHTML = sorted.map(t => {
            const size = Math.max(10, Math.min(14, 10 + Math.round((t.count/maxCount) * 4)));
            return `<span class="tag-cloud-item" style="font-size:${size}px;" onclick="filterByTag('${escapeHtml(t.name)}')">#${escapeHtml(t.name)}<span class="tc-count">${t.count}</span></span>`;
        }).join('');
    } catch { panel.innerHTML = '<span style="font-size:11px;color:var(--danger);">Failed to load tags</span>'; }
}

async function saveQuickCapture() {
    const title = document.getElementById('qcTitle')?.value.trim() || `Quick note — ${new Date().toLocaleString()}`;
    const content = document.getElementById('qcBody')?.value.trim() || '';
    document.getElementById('quickCaptureModal')?.remove();

    try {
        const res = await apiCall('/notes', { method: 'POST', body: JSON.stringify({ title, content }) });
        if (!res.ok) throw new Error();
        const note = await res.json();
        noteCache.set(note.id, note);
        await loadNotes();
        showNotification('Captured!', 'success');
        loadNote(note.id);
    } catch { showNotification('Failed to save', 'error'); }
}

// Typewriter mode
// ════════════════════════════════════════════════════════════
let typewriterMode = false;
let typewriterHandler = null;

function toggleTypewriterMode() {
    typewriterMode = !typewriterMode;
    const btn = document.getElementById('typewriterBtn');
    if (btn) {
        btn.style.background = typewriterMode ? 'var(--accent)' : '';
        btn.style.color = typewriterMode ? 'white' : '';
    }
    const textarea = document.getElementById('modalContent');
    if (!textarea) return;
    if (typewriterMode) {
        typewriterHandler = () => {
            const lineH = parseInt(getComputedStyle(textarea).lineHeight) || 20;
            const lines = textarea.value.slice(0, textarea.selectionStart).split('\n').length;
            const targetScroll = lines * lineH - textarea.clientHeight / 2;
            textarea.scrollTop = Math.max(0, targetScroll);
        };
        textarea.addEventListener('keyup', typewriterHandler);
        textarea.addEventListener('click', typewriterHandler);
    } else {
        if (typewriterHandler) {
            textarea.removeEventListener('keyup', typewriterHandler);
            textarea.removeEventListener('click', typewriterHandler);
            typewriterHandler = null;
        }
    }
}

function toggleEditorFindReplace() {
    const bar = document.getElementById('editorFindReplace');
    if (!bar) return;
    const visible = bar.style.display !== 'none';
    bar.style.display = visible ? 'none' : 'flex';
    if (!visible) document.getElementById('frFind')?.focus();
}

function editorFRHighlight() {
    const q = document.getElementById('frFind')?.value || '';
    const textarea = document.getElementById('modalContent');
    const counter = document.getElementById('frCount');
    if (!textarea || !q) { if (counter) counter.textContent = ''; return; }
    const matches = [...textarea.value.matchAll(new RegExp(escapeRegex(q), 'gi'))];
    if (counter) counter.textContent = `${matches.length} match${matches.length !== 1 ? 'es' : ''}`;
}

function editorFRReplace() {
    const q = document.getElementById('frFind')?.value || '';
    const r = document.getElementById('frReplace')?.value || '';
    const textarea = document.getElementById('modalContent');
    if (!textarea || !q) return;
    const pos = textarea.selectionStart;
    const val = textarea.value;
    const re = new RegExp(escapeRegex(q), 'i');
    // Find next from cursor
    const after = val.slice(pos);
    const match = re.exec(after);
    if (match) {
        const start = pos + match.index;
        textarea.value = val.slice(0, start) + r + val.slice(start + match[0].length);
        textarea.selectionStart = start;
        textarea.selectionEnd = start + r.length;
    }
    editorFRHighlight();
    updateModalPreview();
}

function editorFRReplaceAll() {
    const q = document.getElementById('frFind')?.value || '';
    const r = document.getElementById('frReplace')?.value || '';
    const textarea = document.getElementById('modalContent');
    if (!textarea || !q) return;
    textarea.value = textarea.value.replace(new RegExp(escapeRegex(q), 'gi'), r);
    editorFRHighlight();
    updateModalPreview();
    scheduleAutosave();
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function toggleWordCharCount(el, words, chars) {
    const showWords = el.dataset.mode !== 'chars';
    el.dataset.mode = showWords ? 'chars' : 'words';
    el.textContent = showWords ? `${chars.toLocaleString()} chars` : `${words.toLocaleString()} words`;
}

// Wikilink autocomplete in editor
// ════════════════════════════════════════════════════════════
let _wlSelectedIdx = 0;
let _wlMatches = [];

function getWikilinkQuery(textarea) {
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const before = val.slice(0, pos);
    const m = before.match(/\[\[([^\][\n]*)$/);
    return m ? m[1] : null;
}

function handleWikilinkAutocomplete(event) {
    const textarea = event.target;
    const q = getWikilinkQuery(textarea);
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;

    if (q === null) { dropdown.style.display = 'none'; _wlMatches = []; return; }

    _wlMatches = notes
        .filter(n => n.title.toLowerCase().includes(q.toLowerCase()))
        .slice(0, 8);

    if (_wlMatches.length === 0) { dropdown.style.display = 'none'; return; }

    _wlSelectedIdx = 0;
    renderWikilinkDropdown();
    dropdown.style.display = 'block';
}

function renderWikilinkDropdown() {
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;
    dropdown.innerHTML = _wlMatches.map((n, i) => `
        <div class="wl-item ${i === _wlSelectedIdx ? 'selected' : ''}" onmousedown="applyWikilinkCompletion('${n.title.replace(/'/g, "\\'")}')">
            📄 ${escapeHtml(n.title)}
        </div>`).join('');
}

function handleWikilinkKey(event) {
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown || dropdown.style.display === 'none') return;
    if (event.key === 'ArrowDown') {
        event.preventDefault();
        _wlSelectedIdx = Math.min(_wlSelectedIdx + 1, _wlMatches.length - 1);
        renderWikilinkDropdown();
    } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        _wlSelectedIdx = Math.max(_wlSelectedIdx - 1, 0);
        renderWikilinkDropdown();
    } else if (event.key === 'Enter' || event.key === 'Tab') {
        if (_wlMatches.length > 0) {
            event.preventDefault();
            applyWikilinkCompletion(_wlMatches[_wlSelectedIdx].title);
        }
    } else if (event.key === 'Escape') {
        dropdown.style.display = 'none';
    }
}

function applyWikilinkCompletion(title) {
    const textarea = document.getElementById('modalContent');
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!textarea) return;
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const before = val.slice(0, pos);
    const after = val.slice(pos);
    // Replace [[query with [[Title]]
    const replaced = before.replace(/\[\[([^\][\n]*)$/, `[[${title}]]`);
    textarea.value = replaced + after;
    textarea.selectionStart = textarea.selectionEnd = replaced.length;
    dropdown.style.display = 'none';
    _wlMatches = [];
    updateModalPreview();
}

let _slashMatches = [];
let _slashIdx = 0;

function getSlashQuery(textarea) {
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const before = val.slice(0, pos);
    const lineStart = before.lastIndexOf('\n') + 1;
    const line = before.slice(lineStart);
    const m = line.match(/^\/([a-zA-Z0-9 ]*)$/);
    return m ? m[1] : null;
}

function handleSlashCommand(event) {
    const textarea = event.target;
    if (_wlMatches.length || _tagMatches.length || _mentionMatches.length) return;
    const q = getSlashQuery(textarea);
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;
    if (q === null) { _slashMatches = []; if (!_wlMatches.length && !_tagMatches.length) dropdown.style.display = 'none'; return; }

    _slashMatches = SLASH_COMMANDS.filter(c => c.label.toLowerCase().startsWith(q.toLowerCase()));
    if (!_slashMatches.length) { dropdown.style.display = 'none'; return; }

    _slashIdx = 0;
    dropdown.innerHTML = _slashMatches.map((c, i) => `
        <div class="wl-item ${i === _slashIdx ? 'selected' : ''}" style="display:flex;gap:8px;align-items:center;" onmousedown="applySlashCommand(${i})">
            <span style="width:22px;text-align:center;font-size:11px;font-weight:700;opacity:0.7;">${c.icon}</span>
            <span style="flex:1;">${c.label}</span>
            <span style="font-size:10.5px;color:var(--text-muted);">${c.desc}</span>
        </div>`).join('');
    dropdown.style.display = 'block';
}

function handleSlashKey(event) {
    if (!_slashMatches.length) return;
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown || dropdown.style.display === 'none') return;
    if (event.key === 'ArrowDown') { event.preventDefault(); _slashIdx = Math.min(_slashIdx+1, _slashMatches.length-1); handleSlashCommand({ target: document.getElementById('modalContent') }); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); _slashIdx = Math.max(_slashIdx-1, 0); handleSlashCommand({ target: document.getElementById('modalContent') }); }
    else if (event.key === 'Enter' || event.key === 'Tab') { if (_slashMatches.length) { event.preventDefault(); applySlashCommand(_slashIdx); } }
    else if (event.key === 'Escape') { dropdown.style.display = 'none'; _slashMatches = []; }
}

function applySlashCommand(idx) {
    const cmd = _slashMatches[idx];
    if (!cmd) return;
    const textarea = document.getElementById('modalContent');
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!textarea) return;
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
    const insert = typeof cmd.insert === 'function' ? cmd.insert() : cmd.insert;
    textarea.value = val.slice(0, lineStart) + insert + val.slice(pos);
    textarea.selectionStart = textarea.selectionEnd = lineStart + insert.length;
    dropdown.style.display = 'none';
    _slashMatches = [];
    updateModalPreview();
    textarea.focus();
}

let _tagSelectedIdx = 0;

async function ensureKnownTags() {
    if (_knownTags.length) return;
    try {
        const res = await apiCall('/tags');
        if (res.ok) _knownTags = (await res.json()).map(t => t.name);
    } catch { /* ignore */ }
}

function getTagQuery(textarea) {
    const val = textarea.value;
    const pos = textarea.selectionStart;
    const before = val.slice(0, pos);
    const m = before.match(/#([a-zA-Z0-9_-]*)$/);
    return m ? m[1] : null;
}

async function handleTagAutocomplete(event) {
    await ensureKnownTags();
    const textarea = event.target;
    const q = getTagQuery(textarea);
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;

    // Only show if we don't already have wikilink matches
    if (_wlMatches.length > 0) return;
    if (q === null) { if (!_wlMatches.length) dropdown.style.display = 'none'; _tagMatches = []; return; }

    _tagMatches = _knownTags.filter(t => t.startsWith(q.toLowerCase())).slice(0, 8);
    if (_tagMatches.length === 0) { dropdown.style.display = 'none'; return; }

    _tagSelectedIdx = 0;
    renderTagDropdown();
    dropdown.style.display = 'block';
}

function renderTagDropdown() {
    const dropdown = document.getElementById('wikilinkDropdown');
    if (!dropdown) return;
    dropdown.innerHTML = _tagMatches.map((t, i) => `
        <div class="wl-item ${i === _tagSelectedIdx ? 'selected' : ''}" onmousedown="applyTagCompletion('${t}')">

function handleTagKey(event) {
    if (!_tagMatches.length) return;

    if (!dropdown || dropdown.style.display === 'none') return;
    if (event.key === 'ArrowDown') {
        event.preventDefault();
        _tagSelectedIdx = Math.min(_tagSelectedIdx + 1, _tagMatches.length - 1);
        renderTagDropdown();
    } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        _tagSelectedIdx = Math.max(_tagSelectedIdx - 1, 0);
        renderTagDropdown();
    } else if (event.key === 'Enter' || event.key === 'Tab') {
        if (_tagMatches.length > 0) { event.preventDefault(); applyTagCompletion(_tagMatches[_tagSelectedIdx]); }

function toggleExportMenu(paneUid) {
    const wrap = document.getElementById(`export-${paneUid}`);
    // Close all other open menus
    document.querySelectorAll('.export-wrap.open').forEach(el => {
        if (el !== wrap) el.classList.remove('open');
    });
    wrap?.classList.toggle('open');
    // Close on outside click
    setTimeout(() => {
        const close = e => { if (!wrap?.contains(e.target)) { wrap?.classList.remove('open'); document.removeEventListener('click', close); } };
        document.addEventListener('click', close);
    }, 0);
}

function exportMarkdown(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const { note } = pane;
    const blob = new Blob([`# ${note.title}\n\n${note.content}`], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${note.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.md`;
    a.click();
    URL.revokeObjectURL(a.href);
    document.getElementById(`export-${paneUid}`)?.classList.remove('open');
}

function exportPDF(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    // Hide all other panes, print, restore
    const allPanes = document.querySelectorAll('.note-pane');
    allPanes.forEach(el => {
        if (el.id !== `pane-${paneUid}`) el.style.display = 'none';
    });
    document.getElementById(`export-${paneUid}`)?.classList.remove('open');
    window.print();
    allPanes.forEach(el => el.style.display = '');
}

function exportHTML(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const { note } = pane;
    const preview = document.getElementById(`preview-${paneUid}`);
    const bodyHtml = preview ? preview.innerHTML : marked.parse(note.content);
    const html = `<!DOCTYPE html>

</body></html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${note.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.html`;
    a.click();
    URL.revokeObjectURL(a.href);
    document.getElementById(`export-${paneUid}`)?.classList.remove('open');

function copyPermalink(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const url = `${location.origin}${location.pathname}#note-${pane.note.id}`;
