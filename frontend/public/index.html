let sidebarNavIdx = -1;

function getSidebarItems() {
    return [...document.querySelectorAll('#notesList .note-item')];
}

function moveSidebarFocus(dir) {
    const items = getSidebarItems();
    if (!items.length) return;
    items[sidebarNavIdx]?.classList.remove('keyboard-focus');
    sidebarNavIdx = Math.max(0, Math.min(items.length - 1, sidebarNavIdx + dir));
    items[sidebarNavIdx].classList.add('keyboard-focus');
    items[sidebarNavIdx].scrollIntoView({ block: 'nearest' });
}

function openSidebarFocused() {
    const items = getSidebarItems();
    const focused = items[sidebarNavIdx];
    focused?.click();
}

// Wire arrow keys to sidebar when search is focused or sidebar is hovered
document.addEventListener('keydown', e => {
    const inSearch = document.activeElement?.id === 'searchInput';
    const sidebarHovered = document.querySelector('.sidebar:hover');
    if (!inSearch && !sidebarHovered) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSidebarFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSidebarFocus(-1); }
    else if (e.key === 'Enter' && sidebarNavIdx >= 0) { e.preventDefault(); openSidebarFocused(); }
});

// Reset index when list re-renders
const _origRenderNotesList = renderNotesList;

// ════════════════════════════════════════════════════════════
// Folder view in sidebar
// ════════════════════════════════════════════════════════════
let folderViewOpen = false;

function renderFolderView() {
    // Group notes by top-level folder from note.path
    const folders = {};
    const root = [];
    notes.forEach(note => {
        const parts = (note.path || '').split('/');
        if (parts.length <= 1) {
            root.push(note);
        } else {
            const folder = parts.slice(0, -1).join('/');
            if (!folders[folder]) folders[folder] = [];
            folders[folder].push(note);
        }
    });

    const openIds = new Set(openPanes.map(p => p.note.id));
    let html = '';

    // Folders first
    Object.entries(folders).sort(([a],[b]) => a.localeCompare(b)).forEach(([folder, folderNotes]) => {
        const folderId = 'folder-' + folder.replace(/[^a-z0-9]/gi, '-');
        html += `<div class="folder-item" id="${folderId}-btn" onclick="toggleFolder('${folderId}')">
            <span class="folder-arrow">▶</span> 📁 ${escapeHtml(folder)}
            <span style="margin-left:auto;font-size:10px;opacity:0.6;">${folderNotes.length}</span>
        </div>
        <div class="folder-notes closed" id="${folderId}-notes">`;
        folderNotes.forEach(note => {
            const active = openIds.has(note.id);
            html += `<div class="note-item ${active?'active':''} ${bulkSelected.has(note.id)?'bulk-selected':''}" onclick="handleNoteItemClick(event,'${note.id}',this)">
                <div class="note-item-title">${escapeHtml(note.title||'Untitled')}</div>
            </div>`;
        });
        html += `</div>`;
    });

    // Root notes
    if (root.length) {
        if (Object.keys(folders).length) html += `<div class="list-section-label">Ungrouped</div>`;
        root.forEach(note => {
            const active = openIds.has(note.id);
            html += `<div class="note-item ${active?'active':''} ${bulkSelected.has(note.id)?'bulk-selected':''}" onclick="handleNoteItemClick(event,'${note.id}',this)">
                <div class="note-item-title">${escapeHtml(note.title||'Untitled')}</div>
                <div class="note-item-date">${new Date(note.updated_at).toLocaleDateString()}</div>
            </div>`;
        });
    }

    document.getElementById('notesList').innerHTML = html;
}

function toggleFolder(folderId) {
    const btn   = document.getElementById(`${folderId}-btn`);
    const notes = document.getElementById(`${folderId}-notes`);
    if (!btn || !notes) return;
    const isOpen = !notes.classList.contains('closed');
    notes.classList.toggle('closed', isOpen);
    btn.classList.toggle('open', !isOpen);
}

// Hook folder view into the graph button area
function toggleFolderView() {
    folderViewOpen = !folderViewOpen;
    const btn = document.getElementById('folderViewBtn');
    if (btn) { btn.style.opacity = folderViewOpen ? '1' : ''; btn.style.color = folderViewOpen ? 'var(--accent)' : ''; }
    if (folderViewOpen) renderFolderView();
    else renderNotesList();
}

// ════════════════════════════════════════════════════════════
// Mini-graph per pane
// ════════════════════════════════════════════════════════════
async function loadMiniGraph(paneUid, noteId) {
    try {
        const res = await apiCall('/graph');
        if (!res.ok) return;
        const data = await res.json();
        renderMiniGraph(paneUid, noteId, data);
    } catch {}
}

function renderMiniGraph(paneUid, noteId, data) {
    const svgEl = document.getElementById(`mini-svg-${paneUid}`);
    if (!svgEl || !data.nodes?.length) {
        document.getElementById(`mini-graph-${paneUid}`)?.style.setProperty('display','none');
        return;
    }

    // Find connected nodes
    const connected = new Set([noteId]);
    (data.edges||[]).forEach(e => {
        const s = e.source?.id ?? e.source, t = e.target?.id ?? e.target;
        if (s === noteId) connected.add(t);
        if (t === noteId) connected.add(s);
    });

    if (connected.size <= 1) { document.getElementById(`mini-graph-${paneUid}`)?.style.setProperty('display','none'); return; }

    const subNodes = data.nodes.filter(n => connected.has(n.id));
    const subEdges = (data.edges||[]).filter(e => {
        const s = e.source?.id ?? e.source, t = e.target?.id ?? e.target;
        return connected.has(s) && connected.has(t);
    });

    const svg = d3.select(svgEl);
    svg.selectAll('*').remove();
    const w = svgEl.getBoundingClientRect().width || 300, h = 160;
    svg.attr('viewBox', `0 0 ${w} ${h}`);

    const sim = d3.forceSimulation(subNodes)
        .force('link', d3.forceLink(subEdges).id(d=>d.id).distance(55))
        .force('charge', d3.forceManyBody().strength(-120))
        .force('center', d3.forceCenter(w/2, h/2))
        .force('collision', d3.forceCollide(18));

    const link = svg.append('g').selectAll('line').data(subEdges).enter().append('line')
        .attr('stroke','rgba(109,94,245,0.4)').attr('stroke-width',1.5);

    const node = svg.append('g').selectAll('g').data(subNodes).enter().append('g')
        .style('cursor','pointer')
        .on('click', (e,d) => { if (d.id !== noteId) navigateInPane(paneUid, d.id); });

    node.append('circle')
        .attr('r', d => d.id === noteId ? 10 : 6)
        .attr('fill', d => d.id === noteId ? 'var(--accent)' : '#888')
        .attr('stroke','rgba(255,255,255,0.2)').attr('stroke-width',1.5);

    node.append('text')
        .attr('dy', d => (d.id===noteId?10:6)+11).attr('text-anchor','middle')
        .text(d => d.title?.length>14 ? d.title.slice(0,14)+'…' : d.title)
        .attr('font-size','9px').attr('fill','rgba(255,255,255,0.65)').attr('font-family','Inter,sans-serif');

    sim.on('tick', () => {
        link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

// ════════════════════════════════════════════════════════════
// Reminders
// ════════════════════════════════════════════════════════════
function getReminder(noteId) {
    const r = localStorage.getItem(`synote_reminder_${noteId}`);
    return r ? parseInt(r) : null;
}

function editReminder(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const existing = getReminder(pane.note.id);
    const existingStr = existing ? new Date(existing).toISOString().slice(0,16) : '';

    const dialog = document.createElement('div');
    dialog.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:3000;display:flex;align-items:center;justify-content:center;';
    dialog.innerHTML = `
        <div style="background:var(--content-bg);border:1px solid var(--border);border-radius:12px;padding:22px 24px;width:320px;box-shadow:var(--shadow-lg);">
            <h3 style="font-size:14px;font-weight:700;margin-bottom:14px;">⏰ Set reminder</h3>
            <input type="datetime-local" id="reminderInput" value="${existingStr}"
                style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--content-bg);color:var(--text-primary);margin-bottom:12px;font-family:var(--font);outline:none;">
            <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" style="flex:1;" onclick="saveReminder('${paneUid}')">Set</button>
                ${existing ? `<button class="btn btn-danger" onclick="clearReminder('${paneUid}')">Clear</button>` : ''}
                <button class="btn" onclick="this.closest('[style]').remove()">Cancel</button>
            </div>
        </div>`;
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.remove(); });
    document.body.appendChild(dialog);
    document.getElementById('reminderInput').focus();
}

function saveReminder(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const val = document.getElementById('reminderInput').value;
    if (!val) return;
    const ts = new Date(val).getTime();
    localStorage.setItem(`synote_reminder_${pane.note.id}`, ts);
    document.querySelector('[style*="inset:0"]')?.remove();
    renderPaneContent(pane);
    scheduleReminderNotification(pane.note.id, pane.note.title, ts);
    showNotification('Reminder set', 'success');
}

function clearReminder(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    localStorage.removeItem(`synote_reminder_${pane.note.id}`);
    document.querySelector('[style*="inset:0"]')?.remove();
    renderPaneContent(pane);
    showNotification('Reminder cleared', 'info');
}

function scheduleReminderNotification(noteId, title, ts) {
    const delay = ts - Date.now();
    if (delay <= 0) return;
    setTimeout(async () => {
        if (Notification.permission === 'granted') {
            new Notification(`⏰ Reminder: ${title}`, { body: 'Your Synote reminder is due.', icon: '' });
        } else {
            showNotification(`⏰ Reminder: ${title}`, 'info');
        }
    }, delay);
}

function initReminders() {
    // Request notification permission
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
    // Re-schedule any pending reminders
    notes.forEach(note => {
        const ts = getReminder(note.id);
        if (ts && ts > Date.now()) scheduleReminderNotification(note.id, note.title, ts);
    });
}

// ════════════════════════════════════════════════════════════
// Inline table editor
// ════════════════════════════════════════════════════════════
function applyTableEditor(previewId, paneUid) {
    const preview = document.getElementById(previewId);
    if (!preview) return;
    preview.querySelectorAll('table td, table th').forEach(cell => {
        cell.style.cursor = 'text';
        cell.addEventListener('dblclick', e => {
            if (cell.classList.contains('editing')) return;
            const original = cell.textContent;
            cell.classList.add('editing');
            const input = document.createElement('input');
            input.type = 'text';
            input.value = original;
            cell.textContent = '';
            cell.appendChild(input);
            input.focus();
            input.select();

            const finish = async () => {
                const newVal = input.value;
                cell.classList.remove('editing');
                cell.textContent = newVal;
                if (newVal === original) return;
                // Update markdown source
                const pane = openPanes.find(p => p.uid === paneUid);
                if (!pane) return;
                const updated = pane.note.content.replace(
                    new RegExp(`(\\|[^|\\n]*\\|[^|\\n]*\\|[^\\n]*)${escapeRegex(original)}([^|\\n]*)`, 'g'),
                    `$1${newVal}$2`
                );
                if (updated === pane.note.content) return;
                try {
                    const res = await apiCall(`/notes/${pane.note.id}`, {
                        method: 'PUT', body: JSON.stringify({ title: pane.note.title, content: updated })
                    });
                    if (!res.ok) throw new Error();
                    const saved = await res.json();
                    noteCache.set(saved.id, saved); pane.note = saved; currentNote = saved;
                } catch { showNotification('Table save failed', 'error'); }
            };

            input.onblur = finish;
            input.onkeydown = e => {
                if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { input.value = original; input.blur(); }
            };
        });
    });
}

// ════════════════════════════════════════════════════════════
// Note duplication
// ════════════════════════════════════════════════════════════
async function duplicateNote(paneUid) {
    const pane = openPanes.find(p => p.uid === paneUid);
    if (!pane) return;
    const { note } = pane;
    try {
        const res = await apiCall('/notes', {
            method: 'POST',
            body: JSON.stringify({ title: `${note.title} (copy)`, content: note.content })
        });
        if (!res.ok) throw new Error();
        const dup = await res.json();
        noteCache.set(dup.id, dup);
        await loadNotes();
        loadNote(dup.id);
        showNotification('Note duplicated', 'success');
    } catch { showNotification('Failed to duplicate', 'error'); }
}

// ════════════════════════════════════════════════════════════
// Drag-to-reorder panes
// ════════════════════════════════════════════════════════════
let dragPaneUid = null;

function paneDragStart(e, uid) {
    dragPaneUid = uid;
    e.dataTransfer.effectAllowed = 'move';
    document.getElementById(`pane-${uid}`)?.classList.add('dragging-pane');
}

function paneDragOver(e, uid) {
    if (!dragPaneUid || dragPaneUid === uid) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.getElementById(`pane-${uid}`)?.classList.add('drag-over');
}

function paneDragLeave(e, uid) {
    document.getElementById(`pane-${uid}`)?.classList.remove('drag-over');
}

function paneDrop(e, targetUid) {
    e.preventDefault();
    document.querySelectorAll('.note-pane').forEach(el => el.classList.remove('drag-over', 'dragging-pane'));
    if (!dragPaneUid || dragPaneUid === targetUid) { dragPaneUid = null; return; }

    const fromIdx = openPanes.findIndex(p => p.uid === dragPaneUid);
    const toIdx   = openPanes.findIndex(p => p.uid === targetUid);
    if (fromIdx === -1 || toIdx === -1) { dragPaneUid = null; return; }

    const [moved] = openPanes.splice(fromIdx, 1);
    openPanes.splice(toIdx, 0, moved);
    dragPaneUid = null;
    renderPanes();
}

// ════════════════════════════════════════════════════════════
// Smart URL paste in editor
// ════════════════════════════════════════════════════════════
function handleSmartPaste(event) {
    // First check for image paste
    const items = event.clipboardData?.items;
    if (items) {
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                event.preventDefault();
                insertImageFromFile(event.target, item.getAsFile());
                return;
            }
        }
    }

    // Smart URL paste: if clipboard text is a URL and there's selected text, wrap it
    const text = event.clipboardData?.getData('text') || '';
    const isUrl = /^https?:\/\/[^\s]+$/.test(text.trim());
    if (!isUrl) return; // let default paste handle it

    const textarea = event.target;
    const sel = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
    if (sel) {
        // Wrap selected text as [selected](url)
        event.preventDefault();
        insertAtCursor(textarea, `[${sel}](${text.trim()})`);
        updateModalPreview();
    } else {
        // No selection: paste as <url> (auto-linked)
        event.preventDefault();
        insertAtCursor(textarea, `<${text.trim()}>`);
        updateModalPreview();
    }
}
