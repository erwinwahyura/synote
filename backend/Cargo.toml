[package]
name = "synote"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async utilities
futures = "0.3"

# File system and paths
walkdir = "2.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Git sync (libgit2 bindings)
git2 = "0.19"

# Wikilinks parsing
regex = "1.10"
lazy_static = "1.4"
urlencoding = "2.1"

# Full-text search with Tantivy
tantivy = "0.21"

# Lock zstd-safe to compatible version
zstd-safe = "=5.0.2"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
